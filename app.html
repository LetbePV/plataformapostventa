function renderInterviewsContainer(){
  const flow = state.ordenFlow;
  if(!flow || !flow.interviews || !flow.interviews.length){
    return `<p style="color:var(--text-faint); font-size:12px;">Aún no se ha agregado ningún cuestionario.</p>`;
  }
  return flow.interviews.map((item, idx) => {
    const questions = INTERVIEW_CATEGORIES[item.categoria] || [];
    return `
    <div class="card" style="margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <b style="font-size:13.5px;">${esc(item.categoria)}</b>
        <button type="button" class="btn btn-ghost btn-sm" data-remove-interview="${idx}">✕ Quitar</button>
      </div>
      ${questions.map((q, qi) => `
        <div style="margin-bottom:14px;">
          <label style="display:block; margin-bottom:6px; font-size:12.5px; color:var(--text-muted);">${esc(q.q)}</label>
          ${q.freeText ? `
            <textarea class="interview-freetext" data-idx="${idx}" data-qi="${qi}" placeholder="Escribe aquí...">${esc(item.respuestas[q.q]||'')}</textarea>
          ` : `
          <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
            ${q.options.map(opt => `
              <button type="button" class="btn ${item.respuestas[q.q]===opt ? 'btn-primary':'btn-ghost'} btn-sm" data-select-answer="${idx}" data-qi="${qi}" data-opt="${esc(opt)}">${esc(opt)}</button>
              ${q.audio ? `<button type="button" class="btn btn-yellow btn-sm" data-play-audio="${esc(opt)}" title="Escuchar ejemplo de audio">▶️</button>` : ''}
            `).join('')}
          </div>`}
        </div>
      `).join('')}
    </div>`;
  }).join('');
}

function renderInterviewsAndBind(){
  const container = document.getElementById('diag-interviews-container');
  if(!container) return;
  container.innerHTML = renderInterviewsContainer();
  bindInterviewsContainer();
}

function bindInterviewsContainer(){
  const container = document.getElementById('diag-interviews-container');
  if(!container) return;
  container.querySelectorAll('[data-select-answer]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = Number(btn.dataset.selectAnswer);
      const qi = Number(btn.dataset.qi);
      const item = state.ordenFlow.interviews[idx];
      const q = INTERVIEW_CATEGORIES[item.categoria][qi];
      item.respuestas[q.q] = btn.dataset.opt;
      renderInterviewsAndBind();
    });
  });
  container.querySelectorAll('[data-play-audio]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); playNoiseExample(btn.dataset.playAudio); });
  });
  container.querySelectorAll('.interview-freetext').forEach(ta=>{
    ta.addEventListener('input', e=>{
      const idx = Number(e.target.dataset.idx);
      const qi = Number(e.target.dataset.qi);
      const item = state.ordenFlow.interviews[idx];
      const q = INTERVIEW_CATEGORIES[item.categoria][qi];
      item.respuestas[q.q] = e.target.value;
    });
  });
  container.querySelectorAll('[data-remove-interview]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.ordenFlow.interviews.splice(Number(btn.dataset.removeInterview), 1);
      renderInterviewsAndBind();
    });
  });
}

function bindNuevaOrdenDiagnostico(taller){
  bindTallerBack();
  const flow = state.ordenFlow;
  if(!flow || !flow.customer){
    const go = async ()=>{
      const id = document.getElementById('diag-cliente-input').value.trim().toUpperCase();
      const errEl = document.getElementById('diag-cliente-error');
      errEl.style.display = 'none';
      if(!id) return;
      const c = await getCustomer(id);
      if(!c){
        errEl.innerHTML = 'No encontramos ese código. Si el cliente aún no está registrado, debe darse de alta primero en <b>Bitácora Digital</b> antes de continuar.';
        errEl.style.display = 'block';
        return;
      }
      state.ordenFlow = { customer: c, nivelGasolina: 4, interviews: [] };
      render();
    };
    document.getElementById('diag-buscar-btn').addEventListener('click', go);
    document.getElementById('diag-cliente-input').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
    return;
  }

  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const localNow = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const feInput = document.getElementById('diag-fecha-entrada');
  if(feInput && !feInput.value) feInput.value = localNow;

  document.getElementById('diag-llamar-check').addEventListener('change', (e)=>{
    document.getElementById('diag-fecha-promesa-wrap').style.display = e.target.checked ? 'none' : 'block';
  });

  document.getElementById('diag-add-category-btn').addEventListener('click', ()=>{
    const cat = document.getElementById('diag-category-select').value;
    flow.interviews.push({ categoria: cat, respuestas: {} });
    renderInterviewsAndBind();
  });
  bindInterviewsContainer();

  document.getElementById('diag-generar-btn').addEventListener('click', handleGenerarOrdenDiagnostico);
}

async function handleGenerarOrdenDiagnostico(){
  const flow = state.ordenFlow;
  const taller = state.tallerAuthed;
  const btn = document.getElementById('diag-generar-btn');
  const lockDiv = document.getElementById('diag-km-lock');
  const kmVal = document.getElementById('diag-km').value;
  if(lockDiv) lockDiv.style.display = 'none';

  if(kmVal !== ''){
    const lock = await checkKmLock(flow.customer.id, kmVal);
    if(lock.bloqueado){
      if(lockDiv){
        lockDiv.style.display = 'block';
        lockDiv.innerHTML = renderKmLockWarning(lock, kmVal);
        wireKmLockWarning(lockDiv, { customer: flow.customer, taller, tipoOrden:'diagnostico', kmDeclarado: kmVal, kmAnterior: lock.ultimoKm, fuente: lock.fuente });
      }
      return;
    }
  }

  btn.disabled = true; btn.textContent = 'Generando...';
  try{
    const checklist = {};
    document.querySelectorAll('.diag-checklist-item').forEach(cb => { checklist[cb.dataset.item] = cb.checked; });
    checklist.nivel_aceite = document.getElementById('diag-nivel-aceite').value;
    checklist.nivel_gasolina = `${flow.nivelGasolina ?? 4}/8`;

    const llamarCheck = document.getElementById('diag-llamar-check').checked;
    const fechaEntradaVal = document.getElementById('diag-fecha-entrada').value;
    const fechaPromesaVal = document.getElementById('diag-fecha-promesa').value;

    const order = {
      id: genOrderId('OD'),
      tipo: 'diagnostico',
      taller_id: taller.id,
      taller_nombre: taller.nombre,
      customer_id: flow.customer.id,
      cliente_nombre: flow.customer.name,
      cliente_telefono: flow.customer.phone,
      cliente_email: flow.customer.email,
      moto_modelo: flow.customer.model,
      moto_year: flow.customer.year,
      moto_serial: flow.customer.serial,
      fecha_entrada: fechaEntradaVal ? new Date(fechaEntradaVal).toISOString() : new Date().toISOString(),
      fecha_promesa: (!llamarCheck && fechaPromesaVal) ? new Date(fechaPromesaVal).toISOString() : null,
      llamar_cuando_lista: llamarCheck,
      km_actual: document.getElementById('diag-km').value,
      asesor: document.getElementById('diag-asesor').value.trim(),
      nota: document.getElementById('diag-nota').value.trim(),
      danos_entrada: document.getElementById('diag-danos-entrada').value.trim(),
      checklist,
      servicio_n: null,
      servicio_precio: 0,
      lineas_adicionales: [{ descripcion: 'Diagnóstico técnico (mínimo 1 hora)', precio: DIAGNOSTICO_TARIFA }],
      total: DIAGNOSTICO_TARIFA,
      interview: flow.interviews,
      status: 'recibido',
      created_at: new Date().toISOString(),
    };

    await createOrder(order);
    buildDiagnosticoOrderPDF(order);
    toast('Orden de diagnóstico generada y PDF descargado.', 'ok');
    state.ordenFlow = null;
    state.tallerSub = 'mis-ordenes';
    render();
  }catch(err){
    console.error(err);
    toast('No se pudo generar la orden. Revisa tu conexión e intenta de nuevo.', 'err');
    btn.disabled = false;
    btn.textContent = 'Generar orden y descargar PDF';
  }
}

/* ---- Generación de PDF: Orden de Diagnóstico ---- */
function buildDiagnosticoOrderPDF(o){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const pageW = 210;

  doc.addImage(LETBE_LOGO_BASE64, 'PNG', 14, 10, 42, 7.59);
  doc.setTextColor(90,94,108);
  doc.setFont('helvetica','bold');
  doc.setFontSize(8.5);
  doc.text(o.taller_nombre || '', 14, 28);

  doc.setTextColor(90,94,108);
  doc.setFont('helvetica','normal');
  doc.setFontSize(10);
  doc.text('Orden de Diagnóstico', 14, 33);

  doc.setTextColor(20,20,20);
  doc.setFontSize(9);
  doc.text(`Folio: ${o.id}`, pageW-14, 12, {align:'right'});
  doc.text(`N° de taller: ${o.taller_id}`, pageW-14, 17, {align:'right'});
  doc.text(`Fecha: ${new Date(o.created_at||Date.now()).toLocaleDateString('es-MX')}`, pageW-14, 22, {align:'right'});

  doc.setDrawColor(255,199,44);
  doc.setLineWidth(0.8);
  doc.line(14, 37, pageW-14, 37);
  doc.setTextColor(20,20,20);

  let y = 45;
  const section = (title)=>{ doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text(title, 14, y); doc.setFont('helvetica','normal'); y+=5.5; };
  const line = (text)=>{ doc.setFontSize(9); doc.text(text, 14, y); y+=5; };
  const checkBreak = (needed)=>{ if(y + needed > 280){ doc.addPage(); y = 20; } };

  section('Cliente');
  line(`${o.cliente_nombre}   ·   Código: ${o.customer_id}`);
  line(`Tel: ${o.cliente_telefono||'—'}    Correo: ${o.cliente_email||'—'}`);
  y += 3;

  section('Motocicleta');
  line(`${o.moto_modelo} (${o.moto_year})   ·   VIN: ${o.moto_serial}   ·   Km. actual: ${o.km_actual||'—'}`);
  y += 3;

  section('Fechas y asesor');
  line(`Entrada: ${o.fecha_entrada ? new Date(o.fecha_entrada).toLocaleString('es-MX') : '—'}`);
  line(o.llamar_cuando_lista ? 'Entrega: Te llamamos cuando esté lista' : `Fecha promesa estimada: ${o.fecha_promesa ? new Date(o.fecha_promesa).toLocaleString('es-MX') : 'No especificada'}`);
  line(`Asesor: ${o.asesor || '—'}`);
  y += 3;

  checkBreak(30);
  section('Inventario de unidad (check-in)');
  const checked = Object.keys(o.checklist||{}).filter(k => CHECKLIST_ITEMS.includes(k) && o.checklist[k]);
  doc.setFontSize(8.5);
  const checklistTxt = checked.length ? checked.join(', ') : 'Ninguno marcado';
  const splitChecklist = doc.splitTextToSize(checklistTxt, pageW-28);
  doc.text(splitChecklist, 14, y);
  y += splitChecklist.length * 4 + 3;
  doc.setFontSize(9);
  line(`Nivel de aceite: ${o.checklist?.nivel_aceite||'—'}     Nivel de gasolina: ${o.checklist?.nivel_gasolina||'—'}`);
  if(o.danos_entrada){
    checkBreak(15);
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.text('Daños encontrados en la inspección de entrada:', 14, y); doc.setFont('helvetica','normal'); y+=4.5;
    doc.setFontSize(8.5);
    const splitDanos = doc.splitTextToSize(o.danos_entrada, pageW-28);
    doc.text(splitDanos, 14, y);
    y += splitDanos.length * 3.8 + 3;
  }
  y += 2;

  checkBreak(20);
  section('Entrevista técnica');
  (o.interview || []).forEach(item=>{
    checkBreak(15);
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.text(item.categoria, 14, y); doc.setFont('helvetica','normal'); y += 4.5;
    doc.setFontSize(8.5);
    Object.entries(item.respuestas || {}).forEach(([q,a])=>{
      checkBreak(10);
      const split = doc.splitTextToSize(`${q}  →  ${a}`, pageW-30);
      doc.text(split, 18, y);
      y += split.length * 3.8 + 1.5;
    });
    y += 2;
  });
  if(!o.interview || !o.interview.length){ line('Sin cuestionarios registrados.'); }
  y += 2;

  checkBreak(24);
  doc.setDrawColor(255,199,44);
  doc.setLineWidth(0.6);
  doc.rect(14, y, pageW-28, 18);
  doc.setFontSize(8.5);
  doc.setFont('helvetica','bold');
  doc.text(`Tarifa de mano de obra por hora para diagnóstico: ${fmtMoney(DIAGNOSTICO_TARIFA)} (IVA incluido)`, 17, y+6.5);
  doc.setFont('helvetica','normal');
  const legalDiag = doc.splitTextToSize('Tiempo mínimo para diagnóstico: 72 horas hábiles. La fecha de entrega dependerá de los hallazgos del diagnóstico y de la disponibilidad de refacciones.', pageW-34);
  doc.text(legalDiag, 17, y+12);
  y += 24;

  checkBreak(30);
  const rows = (o.lineas_adicionales||[]).map(l => [l.descripcion, '1', fmtMoney(l.precio), fmtMoney(l.precio)]);
  doc.autoTable({
    startY: y,
    head: [['Concepto','Cant.','P. Unitario','Subtotal']],
    body: rows.length ? rows : [['Sin conceptos registrados','','','']],
    styles:{ fontSize:9 },
    headStyles:{ fillColor:[255,199,44], textColor:[20,20,20] },
    margin:{ left:14, right:14 },
  });
  y = doc.lastAutoTable.finalY + 8;

  checkBreak(20);
  doc.setFont('helvetica','bold');
  doc.setFontSize(12);
  doc.text(`Total a pagar: ${fmtMoney(o.total)}`, pageW-14, y, {align:'right'});
  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  y += 10;

  if(o.nota){
    checkBreak(20);
    section('Descripción adicional');
    doc.setFontSize(9);
    const splitNota = doc.splitTextToSize(o.nota, pageW-28);
    doc.text(splitNota, 14, y);
    y += splitNota.length * 4.2 + 6;
  }

  checkBreak(30);
  doc.setFontSize(7.5);
  doc.setTextColor(90,94,108);
  const legal = [
    'No nos hacemos responsables por objetos olvidados o encargados a cualquier persona de esta sucursal.',
    'Este formato indica los detalles observados en la unidad; favor de validar antes de retirarse.',
    'El presente diagnóstico no incluye reparación; cualquier trabajo adicional requiere autorización previa del cliente.',
  ];
  legal.forEach(l=>{
    const split = doc.splitTextToSize(l, pageW-28);
    doc.text(split, 14, y);
    y += split.length * 3.6 + 1.5;
  });

  doc.save(`${o.id}_Orden_Diagnostico.pdf`);
}

        state.garantiaFlow.refacciones[idx].numero_parte = r.numero_parte || '';
        state.garantiaFlow.refacciones[idx].nombre = r.nombre || '';
        renderRefaccionesRows();
      });
    });
  });
}

/* ---- Selector de catálogo de refacciones para reclamos de garantía ----
   Reutiliza el mismo catálogo del cotizador (getAllRefacciones, secciones
   con diagrama) para que el taller elija una refacción en vez de escribir
   el número de parte a mano. Ofrece dos formas de encontrarla:
   1) Buscar: lista plana filtrable por número de parte o nombre.
   2) Catálogo por diagrama: navega Modelo -> Sección -> imagen de despiece
      con checklist de piezas (igual que en Refacciones), útil cuando el
      taller no sabe de memoria el número de parte pero sí identifica la
      pieza en el dibujo. Al elegir, se agrega/actualiza en la fila de
      "Refacciones solicitadas" del reclamo. */
async function openRefaccionCatalogoModal(onPick){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:640px; max-height:88vh; overflow-y:auto;">
      <div class="eyebrow">Catálogo de refacciones</div>
      <h2 style="font-family:'Archivo Black'; font-size:18px; margin:0 0 6px;">Selecciona una refacción</h2>
      <p style="color:var(--text-muted); font-size:12.5px; margin:0 0 14px;">Se agregará al reclamo con su número de parte y nombre tal como están en el catálogo.</p>
      <div class="alert-tabs" id="cat-modal-tabs" style="margin-bottom:16px;">
        <button class="alert-tab active" type="button" data-modal-tab="buscar">🔍 Buscar</button>
        <button class="alert-tab" type="button" data-modal-tab="diagrama">📖 Catálogo por diagrama</button>
      </div>
      <div id="cat-modal-body"></div>
      <button type="button" class="btn btn-ghost btn-block" id="cerrar-cat-refaccion" style="margin-top:16px;">Cerrar</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });
  overlay.querySelector('#cerrar-cat-refaccion').addEventListener('click', ()=> overlay.remove());

  const bodyEl = overlay.querySelector('#cat-modal-body');
  const tabsEl = overlay.querySelector('#cat-modal-tabs');

  /* ---- Vista "Buscar": lista plana filtrable (comportamiento original) ---- */
  async function showBuscarView(){
    bodyEl.innerHTML = `
      <div class="field" style="margin-bottom:14px;">
        <label>Buscar por número de parte o nombre</label>
        <input id="cat-refaccion-search" placeholder="Ej. GB5789-06020-V-C o Balero" autocomplete="off">
      </div>
      <div id="cat-refaccion-results"><div class="empty">Cargando catálogo...</div></div>
    `;
    const resultsEl = bodyEl.querySelector('#cat-refaccion-results');
    const todas = window.__allRefacciones || await getAllRefacciones();
    if(todas) window.__allRefacciones = todas;
    if(!todas){
      resultsEl.innerHTML = `<div class="empty" style="color:var(--danger);">No se pudo conectar al catálogo.</div>`;
      return;
    }
    const renderResults = (filterText)=>{
      const q = (filterText||'').trim().toLowerCase();
      const filtered = !q ? todas : todas.filter(r =>
        (r.numero_parte||'').toLowerCase().includes(q) ||
        (r.nombre||'').toLowerCase().includes(q)
      );
      if(!filtered.length){
        resultsEl.innerHTML = `<div class="empty">Sin resultados para esa búsqueda.</div>`;
        return;
      }
      resultsEl.innerHTML = filtered.slice(0, 100).map(r => `
        <div class="cat-refaccion-row" data-numero="${esc(r.numero_parte)}" style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 8px; border-bottom:1px solid var(--border); cursor:pointer;">
          <div>
            <div class="mono" style="color:var(--yellow-ink); font-size:11.5px;">${esc(r.numero_parte)}</div>
            <div style="font-size:13px; font-weight:600;">${esc(r.nombre || 'Sin nombre capturado')}</div>
            ${r.modelos ? `<div style="font-size:11px; color:var(--text-faint); margin-top:2px;">${esc(r.modelos)}</div>` : ''}
          </div>
          <span class="btn btn-ghost btn-sm" style="pointer-events:none; flex:0 0 auto;">Elegir</span>
        </div>
      `).join('');
      resultsEl.querySelectorAll('.cat-refaccion-row').forEach(row=>{
        row.addEventListener('click', ()=>{
          const r = todas.find(x => x.numero_parte === row.dataset.numero);
          if(r) onPick(r);
          overlay.remove();
        });
      });
    };
    renderResults('');
    bodyEl.querySelector('#cat-refaccion-search').addEventListener('input', (e)=> renderResults(e.target.value));
  }

  /* ---- Vista "Catálogo por diagrama": Modelo -> Sección -> piezas ---- */
  let diagModelo = null;

  function showModelosView(){
    bodyEl.innerHTML = `
      <p style="color:var(--text-muted); font-size:12.5px; margin:0 0 12px;">Elige el modelo y luego la sección donde se encuentra la pieza.</p>
      <div class="grid3" id="cat-modal-modelos"></div>
    `;
    const grid = bodyEl.querySelector('#cat-modal-modelos');
    grid.innerHTML = MODELS.map(m => `
      <div class="card" style="cursor:pointer; text-align:center; padding:14px;" data-modelo="${esc(m)}">
        <div style="font-family:'Archivo Black'; font-size:13px;">${esc(m)}</div>
        <div style="color:var(--text-faint); font-size:11px; margin-top:4px;">Ver secciones →</div>
      </div>
    `).join('');
    grid.querySelectorAll('[data-modelo]').forEach(card=>{
      card.addEventListener('click', ()=>{ diagModelo = card.dataset.modelo; showSeccionesView(); });
    });
  }

  async function showSeccionesView(){
    bodyEl.innerHTML = `
      <button type="button" class="btn btn-ghost btn-sm" id="cat-modal-back-modelos" style="margin-bottom:14px;">← Modelos</button>
      <div class="eyebrow">${esc(diagModelo)}</div>
      <div class="grid3" id="cat-modal-secciones"><div class="empty">Cargando...</div></div>
    `;
    bodyEl.querySelector('#cat-modal-back-modelos').addEventListener('click', showModelosView);
    const secciones = await getSeccionesForModelo(diagModelo);
    const grid = bodyEl.querySelector('#cat-modal-secciones');
    if(!secciones.length){
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">Catálogo de despiece aún no disponible para este modelo.</div>`;
      return;
    }
    grid.innerHTML = secciones.map(s => `
      <div class="card" style="cursor:pointer; padding:0; overflow:hidden;" data-seccion="${esc(s.codigo)}">
        ${s.imagen_url ? `<img src="${s.imagen_url}" alt="${esc(s.nombre)}" style="width:100%; height:90px; object-fit:contain; background:#fff; display:block;">` : `<div style="height:90px; display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:11px;">Sin imagen</div>`}
        <div style="padding:10px;">
          <div class="id-pill" style="margin-bottom:4px; font-size:11px;">${esc(s.codigo)}</div>
          <div style="font-weight:700; font-size:12px;">${esc(s.nombre)}</div>
        </div>
      </div>
    `).join('');
    grid.querySelectorAll('[data-seccion]').forEach(card=>{
      card.addEventListener('click', ()=>{
        const s = secciones.find(x => x.codigo === card.dataset.seccion);
        showSeccionDetailView(s);
      });
    });
  }

  async function showSeccionDetailView(seccion){
    bodyEl.innerHTML = `
      <button type="button" class="btn btn-ghost btn-sm" id="cat-modal-back-secciones" style="margin-bottom:14px;">← ${esc(diagModelo)}</button>
      <div class="eyebrow">${esc(diagModelo)} · ${esc(seccion.codigo)}</div>
      <h3 style="font-family:'Archivo Black'; font-size:14px; margin:0 0 12px;">${esc(seccion.nombre)}</h3>
      ${seccion.imagen_url ? `
      <div class="card" style="padding:0; overflow:hidden; margin-bottom:14px;">
        <div style="overflow:auto; max-height:280px; background:#fff; text-align:center;">
          <img src="${seccion.imagen_url}" alt="${esc(seccion.nombre)}" style="width:100%; display:inline-block;">
        </div>
      </div>` : `<div class="card" style="margin-bottom:14px;"><div class="empty">Esta sección no tiene diagrama disponible.</div></div>`}
      <div id="cat-modal-partes"><div class="empty">Cargando piezas...</div></div>
      <div style="position:sticky; bottom:0; margin-top:12px; background:var(--surface); padding-top:8px;">
        <button type="button" class="btn btn-primary btn-block" id="cat-modal-agregar-btn" disabled>Agregar seleccionadas (0)</button>
      </div>
    `;
    bodyEl.querySelector('#cat-modal-back-secciones').addEventListener('click', showSeccionesView);

    const partesSeccion = await getPartesForSeccion(diagModelo, seccion.codigo);
    const todas = window.__allRefacciones || await getAllRefacciones() || [];
    if(window.__allRefacciones == null) window.__allRefacciones = todas;
    const refMap = new Map(todas.map(r => [r.numero_parte, r]));
    const partesEl = bodyEl.querySelector('#cat-modal-partes');
    if(!partesSeccion.length){
      partesEl.innerHTML = `<div class="empty">Sin piezas registradas en esta sección.</div>`;
      return;
    }
    partesEl.innerHTML = `
      <div class="card" style="padding:0; overflow:hidden;">
        <div style="overflow-x:auto;">
          <table><thead><tr><th></th><th>N°</th><th>N° de parte</th><th>Nombre</th></tr></thead>
          <tbody>
            ${partesSeccion.map(p => {
              const r = refMap.get(p.numero_parte);
              return `
              <tr>
                <td><input type="checkbox" class="cat-modal-parte-check" value="${esc(p.numero_parte)}" style="width:auto;"></td>
                <td><span class="id-pill" style="font-size:12px;">${esc(p.numero_diagrama || '—')}</span></td>
                <td class="mono" style="color:var(--yellow-ink); font-size:11.5px;">${esc(p.numero_parte)}</td>
                <td style="font-size:12.5px;">${esc(r?.nombre || 'Sin nombre capturado')}</td>
              </tr>`;
            }).join('')}
          </tbody></table>
        </div>
      </div>`;
    const addBtn = bodyEl.querySelector('#cat-modal-agregar-btn');
    const updateAddBtn = ()=>{
      const n = partesEl.querySelectorAll('.cat-modal-parte-check:checked').length;
      addBtn.disabled = n === 0;
      addBtn.textContent = `Agregar seleccionadas (${n})`;
    };
    partesEl.querySelectorAll('.cat-modal-parte-check').forEach(cb=> cb.addEventListener('change', updateAddBtn));
    addBtn.addEventListener('click', ()=>{
      const seleccionadas = [...partesEl.querySelectorAll('.cat-modal-parte-check:checked')].map(cb => cb.value);
      seleccionadas.forEach(np => {
        const r = refMap.get(np) || { numero_parte: np, nombre: '' };
        onPick(r);
      });
      overlay.remove();
    });
  }

  tabsEl.querySelectorAll('[data-modal-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      tabsEl.querySelectorAll('[data-modal-tab]').forEach(b=> b.classList.toggle('active', b===btn));
      if(btn.dataset.modalTab === 'buscar'){ showBuscarView(); }
      else{ diagModelo = null; showModelosView(); }
    });
  });

  await showBuscarView();
}

function bindNuevaGarantiaTaller(taller){
  bindTallerBack();
  const flow = state.garantiaFlow;
  if(!flow || !flow.customer){
    const go = async ()=>{
      const q = document.getElementById('gt-cliente-input').value.trim();
      const errEl = document.getElementById('gt-cliente-error');
      errEl.style.display = 'none';
      if(!q) return;
      const c = await findCustomerByCodeOrSerial(q);
      if(!c){
        errEl.innerHTML = 'No encontramos ese cliente ni motocicleta. Si aún no está registrado, debe darse de alta primero en <b>Bitácora Digital</b>.';
        errEl.style.display = 'block';
        return;
      }
      state.garantiaFlow = { customer: c, refacciones: [] };
      render();
    };
    document.getElementById('gt-buscar-btn').addEventListener('click', go);
    document.getElementById('gt-cliente-input').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
    return;
  }

  renderRefaccionesRows();
  document.getElementById('gt-add-refaccion').addEventListener('click', ()=>{
    flow.refacciones.push({ numero_parte:'', nombre:'', cantidad:1 });
    renderRefaccionesRows();
  });
  document.getElementById('gt-add-refaccion-catalogo').addEventListener('click', ()=>{
    openRefaccionCatalogoModal((r)=>{
      flow.refacciones.push({ numero_parte: r.numero_parte || '', nombre: r.nombre || '', cantidad: 1 });
      renderRefaccionesRows();
    });
  });

  document.getElementById('gt-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const f = e.target;
    const btn = document.getElementById('gt-submit-btn');
    const errEl = document.getElementById('gt-submit-error');
    errEl.style.display = 'none';
    btn.disabled = true;
    try{
      const gtId = genGarantiaTallerId();
      btn.textContent = 'Subiendo fotos...';
      const [photoMoto, photoTablero, photoP1, photoP2] = await Promise.all([
        uploadFile(f.photo_moto.files[0], `garantias-taller/${flow.customer.id}/${gtId}`),
        uploadFile(f.photo_tablero.files[0], `garantias-taller/${flow.customer.id}/${gtId}`),
        uploadFile(f.photo_parte1.files[0], `garantias-taller/${flow.customer.id}/${gtId}`),
        uploadFile(f.photo_parte2.files[0], `garantias-taller/${flow.customer.id}/${gtId}`),
      ]);
      btn.textContent = 'Guardando reclamo...';
      const refaccionesFiltradas = (flow.refacciones || [])
        .filter(r => r.numero_parte.trim() || r.nombre.trim())
        .map(r => ({ numero_parte: r.numero_parte.trim(), nombre: r.nombre.trim(), cantidad: Number(r.cantidad)||1, decision: null }));
      await createGarantiaTaller({
        id: gtId,
        taller_id: taller.id,
        taller_nombre: taller.nombre,
        customer_id: flow.customer.id,
        cliente_nombre: flow.customer.name,
        cliente_telefono: flow.customer.phone,
        moto_modelo: flow.customer.model,
        moto_serial: flow.customer.serial,
        km_actual: f.km_actual.value,
        description: f.description.value.trim(),
        photo_moto: photoMoto,
        photo_tablero: photoTablero,
        photo_parte1: photoP1,
        photo_parte2: photoP2,
        refacciones: refaccionesFiltradas,
        status: 'en_proceso',
      });
      toast('Reclamo de garantía enviado.', 'ok');
      state.garantiaFlow = null;
      state.tallerSub = 'mis-garantias';
      render();
    }catch(err){
      console.error(err);
      errEl.textContent = 'No se pudo enviar el reclamo. Revisa tu conexión e intenta de nuevo.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Enviar reclamo';
    }
  });
}

      <button class="btn btn-ghost btn-sm" data-gt-pdf="${g.id}" style="margin-top:10px;">📄 Descargar comprobante PDF</button>` : '';
    return `
    <div class="card" style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
        <div>
          <div class="id-pill" style="margin-bottom:6px;">${g.id}</div>

          <div style="color:var(--text-muted); font-size:12.5px; margin-top:4px; max-width:480px;">${esc(g.description)}</div>
          <div style="color:var(--text-faint); font-size:11.5px; margin-top:4px;">${fmtDate((g.created_at||'').slice(0,10))} · Km: ${Number(g.km_actual).toLocaleString('es-MX')} km</div>

    </div>`;
  }).join('');

  container.querySelectorAll('[data-finalize-gt]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const gtId = btn.dataset.finalizeGt;
      const errEl = container.querySelector(`.gt-finalize-error[data-gt="${gtId}"]`);
      const f1 = container.querySelector(`.gt-final-photo1[data-gt="${gtId}"]`);
      const f2 = container.querySelector(`.gt-final-photo2[data-gt="${gtId}"]`);
      const fechaEntregaInput = container.querySelector(`.gt-fecha-entrega[data-gt="${gtId}"]`);
      const comentariosInput = container.querySelector(`.gt-comentarios-finalizacion[data-gt="${gtId}"]`);
      errEl.style.display = 'none';
      if(!f1.files[0] || !f2.files[0]){
        errEl.textContent = 'Sube ambas fotografías antes de finalizar.';
        errEl.style.display = 'block';
        return;
      }
      if(!fechaEntregaInput.value){
        errEl.textContent = 'Indica la fecha y hora de entrega de la unidad al cliente.';
        errEl.style.display = 'block';
        return;
      }
      btn.disabled = true; btn.textContent = 'Subiendo evidencia...';
      try{
        const [photoProceso, photoReparada] = await Promise.all([
          uploadFile(f1.files[0], `garantias-taller/${taller.id}/${gtId}`),
          uploadFile(f2.files[0], `garantias-taller/${taller.id}/${gtId}`),
        ]);
        await updateGarantiaTaller(gtId, {
          status:'finalizada',
          photo_proceso: photoProceso,
          photo_reparada: photoReparada,
          fecha_entrega: new Date(fechaEntregaInput.value).toISOString(),
          comentarios_finalizacion: comentariosInput.value.trim(),
        });
        const g = await getGarantiaTaller(gtId);
        buildGarantiaFinalizadaPDF(g);
        toast('Garantía finalizada. Se descargó el comprobante en PDF.', 'ok');
        await bindMisGarantiasTaller(taller);
      }catch(err){
        console.error(err);
        errEl.textContent = 'No se pudo finalizar. Revisa tu conexión e intenta de nuevo.';
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Marcar como Finalizada';
      }
    });
  });

  container.querySelectorAll('[data-gt-pdf]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const g = await getGarantiaTaller(btn.dataset.gtPdf);
      if(g) buildGarantiaFinalizadaPDF(g);
    });
  });
}

/* ---- PDF: Comprobante de Garantía Finalizada ---- */
function buildGarantiaFinalizadaPDF(g){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const pageW = 210;

  doc.addImage(LETBE_LOGO_BASE64, 'PNG', 14, 10, 42, 7.59);
  doc.setTextColor(90,94,108);
  doc.setFont('helvetica','bold');
  doc.setFontSize(8.5);
  doc.text(g.taller_nombre || '', 14, 28);

  doc.setFont('helvetica','normal');
  doc.setFontSize(10);
  doc.text('Comprobante de Garantía Finalizada', 14, 33);

  doc.setTextColor(20,20,20);
  doc.setFontSize(9);
  doc.text(`Folio: ${g.id}`, pageW-14, 12, {align:'right'});
  doc.text(`N° de taller: ${g.taller_id}`, pageW-14, 17, {align:'right'});
  doc.text(`Fecha: ${new Date(g.updated_at||Date.now()).toLocaleDateString('es-MX')}`, pageW-14, 22, {align:'right'});

  doc.setDrawColor(255,199,44);
  doc.setLineWidth(0.8);
  doc.line(14, 37, pageW-14, 37);

  let y = 45;
  const section = (title)=>{ doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text(title, 14, y); doc.setFont('helvetica','normal'); y+=5.5; };
  const line = (text)=>{ doc.setFontSize(9); doc.text(text, 14, y); y+=5; };

  section('Cliente');
  line(`${g.cliente_nombre}   ·   Código: ${g.customer_id}`);
  y += 3;

  section('Motocicleta');
  line(`${g.moto_modelo}   ·   VIN: ${g.moto_serial}   ·   Km. reportado: ${g.km_actual||'—'}`);
  y += 3;

  section('Falla reportada');
  doc.setFontSize(9);
  const splitDesc = doc.splitTextToSize(g.description || '—', pageW-28);
  doc.text(splitDesc, 14, y);
  y += splitDesc.length * 4.2 + 6;

  doc.setFillColor(234,247,239);
  doc.setDrawColor(31,138,76);
  doc.roundedRect(14, y, pageW-28, 16, 2, 2, 'FD');
  doc.setTextColor(31,138,76);
  doc.setFont('helvetica','bold');
  doc.setFontSize(10);
  doc.text('Garantía finalizada', 20, y+10);
  doc.setTextColor(20,20,20);
  doc.setFont('helvetica','normal');
  y += 24;

  section('Entrega de la unidad');
  line(`Fecha y hora de entrega al cliente: ${g.fecha_entrega ? new Date(g.fecha_entrega).toLocaleString('es-MX') : '—'}`);
  y += 3;

  if(g.comentarios_finalizacion){
    section('Comentarios de la reparación');
    doc.setFontSize(9);
    const splitComentarios = doc.splitTextToSize(g.comentarios_finalizacion, pageW-28);
    doc.text(splitComentarios, 14, y);
    y += splitComentarios.length * 4.2 + 6;
  }

  doc.setFontSize(9);
  doc.setFont('helvetica','bold');
  doc.text('Nota:', 14, y); y += 5;
  doc.setFont('helvetica','normal');
  const nota = 'Adjunte el presente documento a la factura de cobro para el pago correspondiente.';
  const splitNota = doc.splitTextToSize(nota, pageW-28);
  doc.text(splitNota, 14, y);
  y += splitNota.length * 4.5 + 8;

  doc.setFontSize(7.5);
  doc.setTextColor(90,94,108);
  doc.text('Este comprobante certifica que la reparación en garantía fue completada por el taller autorizado indicado, con evidencia fotográfica en el sistema Letbe.', 14, y, {maxWidth: pageW-28});

  doc.save(`${g.id}_Garantia_Finalizada.pdf`);
}

/* ---- Solicitudes asignadas al taller (activación / falla-garantía) ---- */
function renderSolicitudesAsignadas(taller){
  return `
  ${tallerBackButton()}
  <div class="eyebrow">Solicitudes asignadas</div>
  <h1 class="page-title">Activaciones y reportes por atender</h1>
  <p class="page-sub">Tienes 72 horas desde la asignación para atender cada solicitud.</p>
  <div id="solicitudes-asignadas-list"><div class="empty">Cargando...</div></div>
  `;
}
async function bindSolicitudesAsignadas(taller){
  bindTallerBack();
  const solicitudes = await getSolicitudesForTaller(taller.id);
  const listEl = document.getElementById('solicitudes-asignadas-list');
  const pendientes = solicitudes.filter(s => s.status !== 'finalizada');
  const finalizadas = solicitudes.filter(s => s.status === 'finalizada');
  if(!solicitudes.length){
    listEl.innerHTML = `<div class="empty">No tienes solicitudes asignadas por ahora.</div>`;
    return;
  }
  const tipoLabel = { activacion: 'Activación', falla_garantia: 'Falla / Garantía' };

  const renderCard = (s) => {
    const esActivacion = s.tipo === 'activacion';
    const finalizeBlock = s.status === 'asignada' ? `
      <div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--border);">
        ${esActivacion ? `
          <div class="field"><label>Foto de evidencia (unidad lista)</label><input type="file" accept="image/*" class="sol-final-photo1" data-sol="${s.id}"></div>
        ` : `
          <div class="field"><label>Foto del proceso de reparación</label><input type="file" accept="image/*" class="sol-final-photo1" data-sol="${s.id}"></div>
          <div class="field"><label>Foto de la unidad ya reparada</label><input type="file" accept="image/*" class="sol-final-photo2" data-sol="${s.id}"></div>
        `}
        <button class="btn btn-primary btn-sm" data-finalize-sol="${s.id}" data-tipo="${s.tipo}">Marcar como Finalizada</button>
        <p class="sol-finalize-error" data-sol="${s.id}" style="color:var(--danger); font-size:12px; margin-top:8px; display:none;"></p>
      </div>` : '';
    const pdfBtn = s.status === 'finalizada' ? `<button class="btn btn-ghost btn-sm" data-sol-pdf="${s.id}" style="margin-top:10px;">📄 Descargar comprobante PDF</button>` : '';

    return `
    <div class="card" style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
        <div>
          <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <span class="id-pill">${s.id}</span>
            <b style="font-size:13.5px;">${tipoLabel[s.tipo]}</b>
          </div>
          <div style="font-size:12px; color:var(--text-muted); margin-top:6px;">${esc(s.moto_modelo)} · VIN: ${esc(s.moto_serie||'—')}</div>
          <div style="font-size:12px; color:var(--text-faint); margin-top:4px;">Solicitado por: ${esc(s.origen_nombre)}</div>
          ${esActivacion ? `<div style="font-size:12px; color:var(--text-muted); margin-top:4px;">Entrega: ${s.fecha_entrega||'—'} · Vendedor: ${esc(s.vendedor||'—')}</div>` : `<div style="color:var(--text-muted); font-size:12.5px; margin-top:6px; max-width:480px;">${esc(s.descripcion||'')}</div>`}
        </div>
        <div style="text-align:right;">
          <span class="badge ${solicitudStatusInfo(s.status).badge}">${solicitudStatusInfo(s.status).label}</span>
          ${s.status==='asignada' ? `<div style="margin-top:6px;">${countdownBadge(s.fecha_limite)}</div>` : ''}
        </div>
      </div>
      ${finalizeBlock}
      ${pdfBtn}
    </div>`;
  };

  listEl.innerHTML = `
    ${pendientes.length ? pendientes.map(renderCard).join('') : `<div class="empty">Sin solicitudes pendientes.</div>`}
    ${finalizadas.length ? `<h3 style="font-family:'Archivo Black'; font-size:14px; margin:24px 0 12px;">Finalizadas</h3>${finalizadas.map(renderCard).join('')}` : ''}
  `;

  listEl.querySelectorAll('[data-finalize-sol]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.finalizeSol;
      const tipo = btn.dataset.tipo;
      const errEl = listEl.querySelector(`.sol-finalize-error[data-sol="${id}"]`);
      const f1 = listEl.querySelector(`.sol-final-photo1[data-sol="${id}"]`);
      const f2 = listEl.querySelector(`.sol-final-photo2[data-sol="${id}"]`);
      errEl.style.display = 'none';
      if(!f1.files[0] || (tipo === 'falla_garantia' && !f2.files[0])){
        errEl.textContent = 'Sube la evidencia requerida antes de finalizar.';
        errEl.style.display = 'block';
        return;
      }
      btn.disabled = true; btn.textContent = 'Subiendo evidencia...';
      try{
        const evidenciaFinalizacion = [];
        const url1 = await uploadFile(f1.files[0], `solicitudes-finalizacion/${taller.id}/${id}`);
        evidenciaFinalizacion.push({ nombre: f1.files[0].name, url: url1 });
        if(tipo === 'falla_garantia'){
          const url2 = await uploadFile(f2.files[0], `solicitudes-finalizacion/${taller.id}/${id}`);
          evidenciaFinalizacion.push({ nombre: f2.files[0].name, url: url2 });
        }
        await updateSolicitud(id, { status: 'finalizada', evidencia_finalizacion: evidenciaFinalizacion });
        const s = await getSolicitud(id);
        buildSolicitudFinalizadaPDF(s);
        toast('Solicitud finalizada. Se descargó el comprobante en PDF.', 'ok');
        await bindSolicitudesAsignadas(taller);
      }catch(err){
        console.error(err);
        errEl.textContent = 'No se pudo finalizar. Revisa tu conexión e intenta de nuevo.';
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Marcar como Finalizada';
      }
    });
  });

  listEl.querySelectorAll('[data-sol-pdf]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const s = await getSolicitud(btn.dataset.solPdf);
      if(s) buildSolicitudFinalizadaPDF(s);
    });
  });
}

/* =========================================================
   VIEW: REFACCIONES (catálogo visual + cotizador)
   ========================================================= */
function renderCotizador(){
  const sub = state.refaccionesSub || 'hub';
  if(sub === 'modelo') return renderRefaccionesModelo(state.refaccionesFlow.modelo);
  if(sub === 'seccion') return renderRefaccionesSeccion(state.refaccionesFlow);
  return renderRefaccionesHub();
}
function bindCotizador(){
  const sub = state.refaccionesSub || 'hub';
  if(sub === 'modelo') return bindRefaccionesModelo();
  if(sub === 'seccion') return bindRefaccionesSeccion();
  return bindRefaccionesHub();
}

function tallerLockCard(){
  const unlocked = !!state.cotizadorTaller;
  return `
  <div class="card" style="max-width:480px; margin-bottom:24px;">
    ${unlocked ? `
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div class="eyebrow" style="color:var(--yellow-ink); margin-bottom:4px;">Sesión de taller activa</div>

        </div>
        <button class="btn btn-ghost btn-sm" id="cot-taller-logout">Cerrar sesión</button>
      </div>
    ` : `
      <div class="eyebrow" style="color:var(--yellow-ink); margin-bottom:8px;">¿Eres taller autorizado?</div>
      <p style="color:var(--text-muted); font-size:12.5px; margin:0 0 12px;">Ingresa con tu número de taller y contraseña para ver el precio de taller.</p>
      <div class="grid2">
        <div class="field"><label>Número de taller</label><input id="cot-taller-id" class="mono" placeholder="TL-XXXX" style="text-transform:uppercase;"></div>
        <div class="field"><label>Contraseña</label><input id="cot-taller-pass" type="password"></div>
      </div>
      <button class="btn btn-ghost btn-block" id="cot-taller-login">Desbloquear precio de taller</button>
      <p id="cot-taller-error" style="color:var(--danger); font-size:12.5px; margin-top:8px; display:none;"></p>
    `}
  </div>`;
}
function bindTallerLockCard(){
  const loginBtn = document.getElementById('cot-taller-login');
  if(loginBtn){
    loginBtn.addEventListener('click', async ()=>{
      const id = document.getElementById('cot-taller-id').value.trim().toUpperCase();
      const pass = document.getElementById('cot-taller-pass').value;
      const errEl = document.getElementById('cot-taller-error');
      errEl.style.display = 'none';
      if(!id || !pass) return;
      const result = await getTaller(id, pass);
      if(result.error){
        const msgs = { notfound:'No encontramos ese número de taller.', inactive:'Este taller está dado de baja.', badpassword:'Contraseña incorrecta.', connection: result.detail || 'No se pudo conectar.' };
        errEl.textContent = msgs[result.error] || 'Error desconocido.';
        errEl.style.display = 'block';
        return;
      }
      state.cotizadorTaller = result.taller;
      render();
    });
  }
  const logoutBtn = document.getElementById('cot-taller-logout');
  if(logoutBtn){
    logoutBtn.addEventListener('click', ()=>{ state.cotizadorTaller = null; render(); });
  }
}

/* ---- Hub: búsqueda rápida + selector de modelo ---- */
function renderRefaccionesHub(){
  const modelCards = MODELS.map(m => `
    <div class="card" style="cursor:pointer; text-align:center;" data-open-modelo="${esc(m)}">
      <h3 style="font-family:'Archivo Black'; font-size:15px; margin:0;">${esc(m)}</h3>
      <p style="color:var(--text-faint); font-size:11.5px; margin-top:6px;">Ver catálogo →</p>
    </div>`).join('');
  return `
  <div class="eyebrow">Catálogo de refacciones</div>
  <h1 class="page-title">Refacciones</h1>
  <p class="page-sub">Busca directo por número de parte, o navega el catálogo visual por modelo.</p>

  <div class="card" style="max-width:480px; margin-bottom:24px;">
    <div class="field" style="margin-bottom:14px;">
      <label>Búsqueda rápida por número de parte</label>
      <input id="cot-parte-input" class="mono" placeholder="Ej. GB5789-06020-V-C" style="text-transform:uppercase;">
    </div>
    <button class="btn btn-primary btn-block" id="cot-buscar-btn">Buscar</button>
  </div>

  ${tallerLockCard()}

  <div id="cotizador-result" style="margin-bottom:24px;"></div>

  <h3 style="font-family:'Archivo Black'; font-size:16px; margin:0 0 14px;">Catálogo por modelo</h3>
  <div class="grid3">${modelCards}</div>
  `;
}
function bindRefaccionesHub(){
  document.getElementById('cot-buscar-btn').addEventListener('click', doCotizadorSearch);
  document.getElementById('cot-parte-input').addEventListener('keydown', e=>{ if(e.key==='Enter') doCotizadorSearch(); });
  bindTallerLockCard();
  document.querySelectorAll('[data-open-modelo]').forEach(card=>{
    card.addEventListener('click', ()=>{
      state.refaccionesSub = 'modelo';
      state.refaccionesFlow = { modelo: card.dataset.openModelo };
      render();
    });
  });
}
async function doCotizadorSearch(){
  const q = document.getElementById('cot-parte-input').value.trim();
  const resultEl = document.getElementById('cotizador-result');
  if(!q) return;
  resultEl.innerHTML = `<div class="empty">Buscando...</div>`;
  const r = await getRefaccionByNumero(q);
  if(!r){
    resultEl.innerHTML = `<div class="card"><div class="empty">No encontramos ese número de parte en el catálogo.</div></div>`;
    return;
  }
  resultEl.innerHTML = refaccionResultCard(r) + `<div style="margin-top:12px;">${bankTransferInfoCard()}</div>`;
  wireAddPedidoButtons(resultEl);
}
function refaccionResultCard(r){
  const esTaller = !!state.cotizadorTaller;
  const sinIva = esTaller ? r.precio_taller_sin_iva : r.precio_publico_sin_iva;
  const precioConIva = conIva(sinIva);
  const dispBadge = r.disponibilidad === 'Disponible' ? 'badge-success' : r.disponibilidad === 'Sobre pedido' ? 'badge-yellow' : 'badge-yellow';

  // En modo taller, mostramos también el precio público y el ahorro que
  // representa comprar a precio de taller (solo si ambos precios existen).
  let ahorroBlock = '';
  if(esTaller && precioConIva != null){
    const precioPublicoConIva = conIva(r.precio_publico_sin_iva);
    if(precioPublicoConIva != null){
      const ahorro = precioPublicoConIva - precioConIva;
      const pctAhorro = precioPublicoConIva > 0 ? (ahorro / precioPublicoConIva) * 100 : null;
      ahorroBlock = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
        <span style="font-size:11px; color:var(--text-faint);">Precio público (con IVA)</span>
        <span class="mono" style="font-size:13px; color:var(--text-faint); text-decoration:line-through;">${fmtMoney(precioPublicoConIva)}</span>
      </div>
      ${ahorro > 0 ? `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
        <span style="font-size:11.5px; color:var(--success); font-weight:700;">Tu ahorro</span>
        <span class="mono" style="font-size:13.5px; color:var(--success); font-weight:800;">${fmtMoney(ahorro)}${pctAhorro != null ? ` (${pctAhorro.toFixed(0)}%)` : ''}</span>

function wireAddPedidoButtons(root){
  if(!root) return;
  root.querySelectorAll('[data-add-pedido]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const numeroParte = btn.dataset.addPedido;
      const nombre = btn.dataset.nombre;
      const precio = Number(btn.dataset.precio) || 0;
      const qtyInput = root.querySelector(`.pedido-qty-input[data-parte="${CSS.escape(numeroParte)}"]`);
      const cantidad = Math.max(1, Math.floor(Number(qtyInput?.value) || 1));
      addToPedido({ numero_parte: numeroParte, nombre, precio_unitario_con_iva: precio, cantidad });
    });
  });
}
function addToPedido(item){
  state.pedidoCotizador = state.pedidoCotizador || [];
  const existente = state.pedidoCotizador.find(i => i.numero_parte === item.numero_parte);
  if(existente){ existente.cantidad += item.cantidad; }
  else{ state.pedidoCotizador.push(item); }
  toast(`${item.nombre} agregada a tu pedido.`, 'ok');
  renderPedidoFloat();
}
function removeFromPedido(numeroParte){
  state.pedidoCotizador = (state.pedidoCotizador || []).filter(i => i.numero_parte !== numeroParte);
  renderPedidoFloat();
}
function setPedidoQty(numeroParte, cantidad){
  const item = (state.pedidoCotizador || []).find(i => i.numero_parte === numeroParte);
  if(item) item.cantidad = Math.max(1, Math.floor(Number(cantidad) || 1));
}
function pedidoTotal(){
  return (state.pedidoCotizador || []).reduce((sum,i)=> sum + (i.precio_unitario_con_iva||0) * i.cantidad, 0);
}
function renderPedidoFloat(){
  const wrap = document.getElementById('pedido-float-wrap');
  if(!wrap) return;
  const n = (state.pedidoCotizador || []).reduce((s,i)=> s + i.cantidad, 0);
  if(state.view !== 'cotizador' || n === 0){
    wrap.innerHTML = '';
    return;
  }
  wrap.innerHTML = `
  <button class="pedido-float" id="pedido-float-btn">
    🛒 Mi pedido <span class="pedido-float-count">${n}</span>
    <span class="mono">${fmtMoney(pedidoTotal())}</span>
  </button>`;
  document.getElementById('pedido-float-btn').addEventListener('click', openPedidoModal);
}

function pedidoItemsRowsHTML(){
  const items = state.pedidoCotizador || [];
  if(!items.length) return `<p style="color:var(--text-faint); font-size:12px;">Tu pedido está vacío.</p>`;
  return items.map(i => `
    <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
      <div style="flex:2;">
        <div class="mono" style="font-size:11.5px; color:var(--yellow-ink);">${esc(i.numero_parte)}</div>
        <div style="font-size:12.5px;">${esc(i.nombre)}</div>
      </div>
      <input type="number" min="1" value="${i.cantidad}" class="mono pedido-modal-qty" data-parte="${esc(i.numero_parte)}" style="width:64px; flex:0 0 auto;">
      <div class="mono" style="flex:0 0 90px; text-align:right; font-size:13px;">${fmtMoney(i.precio_unitario_con_iva * i.cantidad)}</div>
      <button type="button" class="btn btn-ghost btn-sm" data-remove-pedido-item="${esc(i.numero_parte)}" style="flex:0 0 auto;">✕</button>
    </div>`).join('');
}

function openPedidoModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const taller = state.cotizadorTaller;
  overlay.innerHTML = `
    <div class="modal" style="max-width:560px; max-height:88vh; overflow-y:auto;">
      <div class="eyebrow">Solicitud de compra</div>
      <h2 style="font-family:'Archivo Black'; font-size:20px; margin:0 0 6px;">Mi pedido</h2>
      <p style="color:var(--text-muted); font-size:12.5px; margin:0 0 16px;">Revisa las refacciones que quieres solicitar. Al enviar, el equipo de Letbe te contactará para confirmar disponibilidad, forma de pago y entrega.</p>
      <div id="pedido-modal-items">${pedidoItemsRowsHTML()}</div>
      <div style="display:flex; justify-content:space-between; align-items:center; padding-top:10px; margin-top:6px; border-top:1px solid var(--border);">
        <span style="font-weight:700; font-size:13px;">Total estimado</span>

      </div>
      <div class="divider"></div>
      <form id="pedido-form">
        <div class="grid2">
          <div class="field"><label>Nombre completo</label><input required name="nombre" value="${esc((taller && (taller.contacto || taller.nombre)) || '')}"></div>
          <div class="field"><label>Teléfono</label><input required name="telefono" type="tel" value="${esc((taller && taller.telefono) || '')}"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>Correo (opcional)</label><input name="correo" type="email" value="${esc((taller && taller.email) || '')}"></div>
          <div class="field"><label>Código de cliente (opcional)</label><input name="codigo_cliente" class="mono" placeholder="LB-XXXXXX" style="text-transform:uppercase;"></div>
        </div>

        <p id="pedido-form-error" style="color:var(--danger); font-size:12.5px; margin:0 0 10px; display:none;"></p>
        <div style="display:flex; gap:10px;">
          <button type="button" class="btn btn-ghost" id="cancel-pedido" style="flex:1;">Cancelar</button>
          <button type="submit" class="btn btn-primary" style="flex:1;" id="enviar-pedido-btn">Enviar solicitud de compra</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(overlay);

  const refreshItems = ()=>{
    document.getElementById('pedido-modal-items').innerHTML = pedidoItemsRowsHTML();
    document.getElementById('pedido-modal-total').textContent = fmtMoney(pedidoTotal());
    bindPedidoModalItemEvents();
    renderPedidoFloat();
    if(!(state.pedidoCotizador || []).length) overlay.remove();
  };
  function bindPedidoModalItemEvents(){
    overlay.querySelectorAll('.pedido-modal-qty').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        setPedidoQty(inp.dataset.parte, inp.value);
        refreshItems();
      });
    });
    overlay.querySelectorAll('[data-remove-pedido-item]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        removeFromPedido(btn.dataset.removePedidoItem);
        refreshItems();
      });
    });
  }
  bindPedidoModalItemEvents();

  overlay.querySelector('#cancel-pedido').addEventListener('click', ()=> overlay.remove());
  overlay.querySelector('#pedido-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const f = e.target;
    const errEl = document.getElementById('pedido-form-error');
    errEl.style.display = 'none';
    if(!(state.pedidoCotizador || []).length){
      errEl.textContent = 'Tu pedido está vacío.';
      errEl.style.display = 'block';
      return;
    }
    const btn = document.getElementById('enviar-pedido-btn');
    btn.disabled = true; btn.textContent = 'Enviando...';
    try{
      const id = genSolicitudCompraId();
      const items = state.pedidoCotizador.map(i => ({
        numero_parte: i.numero_parte,
        nombre: i.nombre,
        cantidad: i.cantidad,
        precio_unitario_con_iva: i.precio_unitario_con_iva,
        subtotal: Math.round(i.precio_unitario_con_iva * i.cantidad * 100) / 100,
      }));
      const total = Math.round(pedidoTotal() * 100) / 100;
      await createSolicitudCompra({
        id,
        nombre: f.nombre.value.trim(),
        telefono: f.telefono.value.trim(),
        correo: f.correo.value.trim(),
        codigo_cliente: f.codigo_cliente.value.trim().toUpperCase(),
        notas: f.notas.value.trim(),
        taller_id: taller ? taller.id : null,
        taller_nombre: taller ? taller.nombre : null,
        items,
        total_estimado: total,
        status: 'nueva',
      });
      notifySolicitudCompra({
        folio: id,
        nombre_cliente: f.nombre.value.trim(),
        codigo_cliente: f.codigo_cliente.value.trim().toUpperCase() || (taller ? taller.id : ''),
        telefono_cliente: f.telefono.value.trim(),
        taller_nombre: taller ? taller.nombre : '',
        taller_id: taller ? taller.id : '',
        total_estimado: total,
        items,
        notas: f.notas.value.trim(),
      });
      overlay.remove();
      state.pedidoCotizador = [];
      renderPedidoFloat();
      showPedidoConfirmModal(id);
    }catch(err){
      console.error(err);
      errEl.textContent = 'No se pudo enviar tu solicitud. Revisa tu conexión e intenta de nuevo.';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Enviar solicitud de compra';
    }
  });
}

function showPedidoConfirmModal(id){

      <h2 style="font-family:'Archivo Black'; font-size:22px; margin:0 0 10px;">¡Ya recibimos tu pedido!</h2>

  `;
}
async function bindRefaccionesModelo(){
  document.getElementById('cat-back-hub').addEventListener('click', ()=>{
    state.refaccionesSub = 'hub'; state.refaccionesFlow = null; render();
  });
  const modelo = state.refaccionesFlow.modelo;
  const secciones = await getSeccionesForModelo(modelo);
  const grid = document.getElementById('cat-secciones-grid');
  if(!secciones.length){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">Catálogo aún no disponible para este modelo. Vuelve pronto.</div>`;
    return;
  }
  grid.innerHTML = secciones.map(s => `
    <div class="card" style="cursor:pointer; padding:0; overflow:hidden;" data-open-seccion="${esc(s.codigo)}">
      ${s.imagen_url ? `<img src="${s.imagen_url}" alt="${esc(s.nombre)}" style="width:100%; height:120px; object-fit:contain; background:#fff; display:block;">` : `<div style="height:120px; display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:11px;">Sin imagen</div>`}

        <div style="font-weight:700; font-size:13px;">${esc(s.nombre)}</div>
      </div>
    </div>
  `).join('');

    card.addEventListener('click', ()=>{
      const s = secciones.find(x => x.codigo === card.dataset.openSeccion);
      state.refaccionesSub = 'seccion';
      state.refaccionesFlow = { modelo, codigo: s.codigo, nombre: s.nombre, imagenUrl: s.imagen_url, seleccionadas: new Set() };
      render();
    });
  });
}

  ${flow.imagenUrl ? `

  </div>
  <div id="cat-cotizar-resultado" style="margin-top:20px;"></div>
  `;
}
async function bindRefaccionesSeccion(){
  const flow = state.refaccionesFlow;
  document.getElementById('cat-back-modelo').addEventListener('click', ()=>{
    state.refaccionesSub = 'modelo'; state.refaccionesFlow = { modelo: flow.modelo }; render();
  });

  // Zoom del diagrama
  const img = document.getElementById('cat-diagram-img');
  if(img){
    let zoom = 100;
    const applyZoom = ()=>{ img.style.width = zoom + '%'; };
    document.getElementById('cat-zoom-in').addEventListener('click', ()=>{ zoom = Math.min(zoom+40, 400); applyZoom(); });
    document.getElementById('cat-zoom-out').addEventListener('click', ()=>{ zoom = Math.max(zoom-40, 40); applyZoom(); });
    document.getElementById('cat-zoom-reset').addEventListener('click', ()=>{ zoom = 100; applyZoom(); });
    img.addEventListener('click', ()=>{ zoom = zoom === 100 ? 200 : 100; applyZoom(); });
  }

  // Lista de piezas de la sección, cruzada con el catálogo de precios/nombres
  const partesSeccion = await getPartesForSeccion(flow.modelo, flow.codigo);
  const todas = window.__allRefacciones || await getAllRefacciones() || [];
  const refMap = new Map(todas.map(r => [r.numero_parte, r]));
  const listEl = document.getElementById('cat-partes-list');
  if(!partesSeccion.length){
    listEl.innerHTML = `<div class="empty">Sin piezas registradas en esta sección.</div>`;
    return;
  }
  listEl.innerHTML = `
  <div class="card" style="padding:0; overflow:hidden;">
    <div style="overflow-x:auto;">
      <table><thead><tr><th></th><th>N° en diagrama</th><th>N° de parte</th><th>Nombre</th><th>Disponibilidad</th></tr></thead>
      <tbody>
        ${partesSeccion.map(p => {
          const r = refMap.get(p.numero_parte);
          const dispBadge = r?.disponibilidad === 'Disponible' ? 'badge-success' : r?.disponibilidad === 'Sobre pedido' ? 'badge-yellow' : 'badge-yellow';
          return `
          <tr>
            <td><input type="checkbox" class="cat-parte-check" value="${esc(p.numero_parte)}" style="width:auto;"></td>
            <td><span class="id-pill" style="font-size:14px;">${esc(p.numero_diagrama || '—')}</span></td>
            <td class="mono" style="color:var(--yellow-ink);">${esc(p.numero_parte)}</td>
            <td>${esc(r?.nombre || 'Sin nombre capturado')}</td>
            <td><span class="badge ${dispBadge}">${esc(r?.disponibilidad || 'Sobre pedido')}</span></td>
          </tr>`;
        }).join('')}
      </tbody></table>
    </div>
  </div>`;

  const cotizarBtn = document.getElementById('cat-cotizar-btn');
  const updateCotizarBtn = ()=>{
    const n = listEl.querySelectorAll('.cat-parte-check:checked').length;
    cotizarBtn.disabled = n === 0;
    cotizarBtn.textContent = `Cotizar seleccionadas (${n})`;
  };
  listEl.querySelectorAll('.cat-parte-check').forEach(cb=>{
    cb.addEventListener('change', updateCotizarBtn);
  });
  cotizarBtn.addEventListener('click', ()=>{
    const seleccionadas = [...listEl.querySelectorAll('.cat-parte-check:checked')].map(cb => cb.value);
    const resultEl = document.getElementById('cat-cotizar-resultado');
    resultEl.innerHTML = `<h3 style="font-family:'Archivo Black'; font-size:15px; margin:0 0 12px;">Cotización</h3>` +
      seleccionadas.map(np => refaccionResultCard(refMap.get(np) || { numero_parte: np })).map(c => `<div style="margin-bottom:12px;">${c}</div>`).join('') +
      bankTransferInfoCard();
    wireAddPedidoButtons(resultEl);
    resultEl.scrollIntoView({ behavior:'smooth', block:'start' });
  });
}

async function loadGarantiasTallerAdmin(){
  const items = await getAllGarantiasTaller();
  const container = document.getElementById('admin-garantia-taller-list');
  if(items === null){
    container.innerHTML = `<div class="empty" style="color:var(--danger); padding:24px;">No se pudo conectar a la base de datos.</div>`;
    window.__allGarantiasTaller = [];
    return;
  }
  window.__allGarantiasTaller = items;
  const counts = {};
  GARANTIA_TALLER_STATUSES.forEach(s => counts[s.key] = 0);
  items.forEach(g => { if(counts[g.status] !== undefined) counts[g.status]++; });
  document.getElementById('garantia-taller-stats').innerHTML = `
    <div class="card"><div class="eyebrow">Total reportadas</div><div class="display" style="font-size:28px;">${items.length}</div></div>

    <div class="card"><div class="eyebrow">Autorizadas / finalizadas</div><div class="display" style="font-size:28px; color:var(--success);">${counts.autorizada + counts.finalizada}</div></div>
  `;
  renderGarantiasTallerAdminList(items);
}

function renderGarantiasTallerAdminList(items){
  const tab = state.garantiaTallerTab || 'all';
  const filtered = items.filter(g => tab === 'all' ? true : g.status === tab);
  const container = document.getElementById('admin-garantia-taller-list');
  if(!container) return;
  if(!filtered.length){
    container.innerHTML = `<div class="empty" style="padding:24px;">Sin garantías en esta categoría.</div>`;
    return;
  }
  const adminEditableStatuses = GARANTIA_TALLER_STATUSES.filter(s => s.key !== 'finalizada');
  container.innerHTML = filtered.map(g => {
    const info = garantiaTallerStatusInfo(g.status);
    const initialThumbs = [
      ['photo_moto','Moto'], ['photo_tablero','Tablero TFT'], ['photo_parte1','Pieza dañada 1'], ['photo_parte2','Pieza dañada 2']
    ].map(([f,l]) => g[f] ? `<a href="${g[f]}" target="_blank" title="${l}"><img src="${g[f]}" alt="${l}" style="width:60px; height:60px; object-fit:cover; border-radius:8px; border:1px solid var(--border);"></a>` : '').join('');
    const finalThumbs = (g.photo_proceso || g.photo_reparada) ? [
      ['photo_proceso','Proceso de reparación'], ['photo_reparada','Ya reparada']
    ].map(([f,l]) => g[f] ? `<a href="${g[f]}" target="_blank" title="${l}"><img src="${g[f]}" alt="${l}" style="width:60px; height:60px; object-fit:cover; border-radius:8px; border:1px solid var(--yellow);"></a>` : '').join('') : '';
    return `
    <div class="card" style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
        <div>
          <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <b style="font-size:13.5px;">${esc(g.cliente_nombre)}</b>
            <span class="id-pill">${esc(g.customer_id)}</span>
            <span style="color:var(--text-faint); font-size:12px;">${esc(g.moto_modelo)}</span>
          </div>
          <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">Taller: ${esc(g.taller_nombre)} (${esc(g.taller_id)}) · ${fmtDate((g.created_at||'').slice(0,10))} · Km: ${Number(g.km_actual).toLocaleString('es-MX')} km</div>
          <div style="color:var(--text-muted); font-size:12.5px; margin-top:6px; max-width:520px;">${esc(g.description)}</div>
        </div>
        <span class="badge ${info.badge}">${info.label}</span>
      </div>
      <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">${initialThumbs}</div>
      ${finalThumbs ? `<div style="margin-top:8px;"><div class="eyebrow" style="color:var(--yellow-ink); font-size:10px;">Evidencia de reparación</div><div style="display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;">${finalThumbs}</div>
        <div style="margin-top:8px; font-size:12px; color:var(--text-muted);">
          Entrega al cliente: <b style="color:var(--text);">${g.fecha_entrega ? new Date(g.fecha_entrega).toLocaleString('es-MX') : '—'}</b>
          ${g.comentarios_finalizacion ? `<div style="margin-top:4px;">${esc(g.comentarios_finalizacion)}</div>` : ''}
        </div>
      </div>` : ''}
      ${(g.refacciones && g.refacciones.length) ? `
      <div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--border);">
        <div class="eyebrow" style="color:var(--yellow-ink); font-size:10px; margin-bottom:8px;">Refacciones solicitadas</div>
        ${g.refacciones.map((r, ri) => `
          <div style="display:flex; align-items:center; gap:10px; font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--border); flex-wrap:wrap;">
            <span class="mono" style="color:var(--yellow-ink); min-width:90px;">${esc(r.numero_parte||'—')}</span>
            <span style="flex:1; min-width:120px;">${esc(r.nombre||'—')}</span>
            <span style="color:var(--text-faint);">Cant. ${r.cantidad}</span>
            <div style="display:flex; gap:6px;">
              <button type="button" class="btn ${r.decision==='autorizada' ? 'btn-primary':'btn-ghost'} btn-sm gt-refaccion-btn" data-gt="${g.id}" data-ri="${ri}" data-decision="autorizada" ${g.status==='finalizada' ? 'disabled':''}>✓ Autorizada</button>
              <button type="button" class="btn ${r.decision==='rechazada' ? 'btn-primary':'btn-ghost'} btn-sm gt-refaccion-btn" data-gt="${g.id}" data-ri="${ri}" data-decision="rechazada" ${g.status==='finalizada' ? 'disabled':''}>✕ Rechazada</button>
            </div>
          </div>
        `).join('')}
      </div>` : ''}
      <div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--border);">
        <div class="field" style="margin-bottom:10px;">
          <label>Comentarios / solicitud de información al taller</label>
          <textarea class="gt-notes-input" data-gt="${g.id}" placeholder="Ej. Sube una foto más clara de la pieza, o indica el número de parte...">${esc(g.admin_notes || '')}</textarea>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <select class="gt-status-select" data-gt="${g.id}" style="max-width:240px;" ${g.status==='finalizada' ? 'disabled':''}>
            ${adminEditableStatuses.map(s => `<option value="${s.key}" ${g.status===s.key?'selected':''}>${s.label}</option>`).join('')}
            ${g.status==='finalizada' ? `<option value="finalizada" selected>Finalizada</option>` : ''}
          </select>
          <button class="btn btn-yellow btn-sm" data-gt-save="${g.id}" ${g.status==='finalizada' ? 'disabled':''}>Guardar cambios</button>
        </div>
        <p class="gt-save-error" data-gt="${g.id}" style="color:var(--danger); font-size:12px; margin-top:8px; display:none;"></p>
      </div>
    </div>`;
  }).join('');

  // Guarda el estado de las decisiones (autorizada/rechazada) por refacción en memoria,
  // sin re-renderizar toda la tarjeta, para no perder el resto de la captura del admin.
  container.querySelectorAll('.gt-refaccion-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const gtId = btn.dataset.gt;
      const ri = Number(btn.dataset.ri);
      const g = filtered.find(x => x.id === gtId);
      g.refacciones[ri].decision = btn.dataset.decision;
      container.querySelectorAll(`.gt-refaccion-btn[data-gt="${gtId}"][data-ri="${ri}"]`).forEach(b=>{
        b.classList.toggle('btn-primary', b.dataset.decision === btn.dataset.decision);
        b.classList.toggle('btn-ghost', b.dataset.decision !== btn.dataset.decision);
      });
    });
  });

  container.querySelectorAll('[data-gt-save]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.gtSave;
      const select = container.querySelector(`.gt-status-select[data-gt="${id}"]`);
      const notes = container.querySelector(`.gt-notes-input[data-gt="${id}"]`);
      const errEl = container.querySelector(`.gt-save-error[data-gt="${id}"]`);
      const newStatus = select.value;
      errEl.style.display = 'none';
      const g = filtered.find(x => x.id === id);
      const refacciones = g.refacciones || [];

      if(newStatus === 'autorizada' && refacciones.length){
        const pendientes = refacciones.filter(r => r.decision !== 'autorizada' && r.decision !== 'rechazada');
        if(pendientes.length){
          errEl.textContent = `Faltan ${pendientes.length} refacción(es) por marcar como Autorizada o Rechazada antes de autorizar la garantía.`;
          errEl.style.display = 'block';
          return;
        }
      }

      btn.disabled = true; btn.textContent = 'Guardando...';
      try{
        await updateGarantiaTaller(id, { status: newStatus, admin_notes: notes.value.trim(), refacciones });
        let emailMsg = '';
        if(newStatus === 'autorizada'){
          const updated = { ...g, status: newStatus, admin_notes: notes.value.trim(), refacciones };
          const emailOk = await notifyRefaccionesAutorizadas(updated);
          emailMsg = emailOk ? ' Correo enviado a refacciones.' : ' ⚠ No se pudo enviar el correo a refacciones (revisa la consola o el historial de EmailJS).';
        }
        toast('Garantía actualizada.' + emailMsg, emailMsg.includes('⚠') ? 'err' : 'ok');
        await loadGarantiasTallerAdmin();
      }catch(err){
        console.error(err);
        toast('No se pudo actualizar. Intenta de nuevo.', 'err');
        btn.disabled = false; btn.textContent = 'Guardar cambios';
      }
    });
  });
}

async function loadRefaccionesAdmin(filter){
  const rows = await getAllRefacciones();
  const tbody = document.getElementById('refacciones-tbody');
  if(!tbody) return;
  if(rows === null){
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty" style="color:var(--danger);">No se pudo conectar a la base de datos.</div></td></tr>`;
    return;
  }
  window.__allRefacciones = rows;
  const f = (filter||'').toLowerCase();
  const filtered = f ? rows.filter(r => r.numero_parte.toLowerCase().includes(f) || (r.nombre||'').toLowerCase().includes(f)) : rows;
  if(!filtered.length){
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty">${rows.length ? 'Sin resultados para ese filtro.' : 'Aún no hay refacciones cargadas. Sube un catálogo arriba.'}</div></td></tr>`;
    return;
  }
  const dispOptions = ['Disponible','Sobre pedido','Bajo pedido'];
  tbody.innerHTML = filtered.slice(0, 300).map(r => `
    <tr>
      <td class="mono" style="color:var(--yellow-ink);">${esc(r.numero_parte)}</td>
      <td><input class="ref-nombre-input" data-parte="${esc(r.numero_parte)}" value="${esc(r.nombre||'')}" style="min-width:180px;"></td>
      <td style="color:var(--text-faint); font-size:12px;">${esc(r.modelos||'')}</td>
      <td>
        <input class="ref-precio-taller-input mono" data-parte="${esc(r.numero_parte)}" type="number" min="0" step="0.01" value="${r.precio_taller_sin_iva ?? ''}" style="width:90px;">
        <div class="ref-taller-computed" data-parte="${esc(r.numero_parte)}" style="font-size:10.5px; color:var(--text-faint); margin-top:3px;">${fmtMoneyOrDash(conIva(r.precio_taller_sin_iva))} c/IVA</div>
      </td>
      <td>
        <input class="ref-precio-pub-input mono" data-parte="${esc(r.numero_parte)}" type="number" min="0" step="0.01" value="${r.precio_publico_sin_iva ?? ''}" style="width:90px;">
        <div class="ref-pub-computed" data-parte="${esc(r.numero_parte)}" style="font-size:10.5px; color:var(--text-faint); margin-top:3px;">${fmtMoneyOrDash(conIva(r.precio_publico_sin_iva))} c/IVA</div>
      </td>
      <td class="ref-utilidad-cell" data-parte="${esc(r.numero_parte)}" style="font-size:12px;">
        ${fmtMoneyOrDash(calcUtilidad(r.precio_publico_sin_iva, r.precio_taller_sin_iva))}<br>
        <span style="color:var(--text-faint); font-size:10.5px;">${fmtPctOrDash(calcPctUtilidad(r.precio_publico_sin_iva, r.precio_taller_sin_iva))}</span>
      </td>
      <td><select class="ref-disp-select" data-parte="${esc(r.numero_parte)}">
        ${dispOptions.map(d => `<option value="${d}" ${r.disponibilidad===d?'selected':''}>${d}</option>`).join('')}
      </select>
      ${r.existencia != null ? `<div style="font-size:10.5px; color:var(--text-faint); margin-top:3px;">Existencia: ${r.existencia}</div>` : ''}
      </td>
      <td><button class="btn btn-yellow btn-sm" data-ref-save="${esc(r.numero_parte)}">Guardar</button></td>
    </tr>
  `).join('') + (filtered.length > 300 ? `<tr><td colspan="8"><div class="empty">Mostrando los primeros 300 de ${filtered.length} resultados. Usa el buscador para acotar.</div></td></tr>` : '');

  // Recalcula en vivo (con IVA, utilidad, % utilidad) mientras el admin captura precios sin IVA.
  function recompute(parte){
    const tallerInput = tbody.querySelector(`.ref-precio-taller-input[data-parte="${parte}"]`);
    const pubInput = tbody.querySelector(`.ref-precio-pub-input[data-parte="${parte}"]`);
    const tallerVal = tallerInput.value ? Number(tallerInput.value) : null;
    const pubVal = pubInput.value ? Number(pubInput.value) : null;
    tbody.querySelector(`.ref-taller-computed[data-parte="${parte}"]`).textContent = `${fmtMoneyOrDash(conIva(tallerVal))} c/IVA`;
    tbody.querySelector(`.ref-pub-computed[data-parte="${parte}"]`).textContent = `${fmtMoneyOrDash(conIva(pubVal))} c/IVA`;
    const utilCell = tbody.querySelector(`.ref-utilidad-cell[data-parte="${parte}"]`);
    utilCell.innerHTML = `${fmtMoneyOrDash(calcUtilidad(pubVal, tallerVal))}<br><span style="color:var(--text-faint); font-size:10.5px;">${fmtPctOrDash(calcPctUtilidad(pubVal, tallerVal))}</span>`;
  }
  tbody.querySelectorAll('.ref-precio-taller-input, .ref-precio-pub-input').forEach(inp=>{
    inp.addEventListener('input', ()=> recompute(inp.dataset.parte));
  });

  tbody.querySelectorAll('[data-ref-save]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const parte = btn.dataset.refSave;
      const nombre = tbody.querySelector(`.ref-nombre-input[data-parte="${parte}"]`).value.trim();
      const precioTallerSinIva = tbody.querySelector(`.ref-precio-taller-input[data-parte="${parte}"]`).value;
      const precioPubSinIva = tbody.querySelector(`.ref-precio-pub-input[data-parte="${parte}"]`).value;
      const disponibilidad = tbody.querySelector(`.ref-disp-select[data-parte="${parte}"]`).value;
      btn.disabled = true; btn.textContent = '...';
      try{
        await updateRefaccion(parte, {
          nombre,
          precio_taller_sin_iva: precioTallerSinIva ? Number(precioTallerSinIva) : null,
          precio_publico_sin_iva: precioPubSinIva ? Number(precioPubSinIva) : null,
          disponibilidad,
        });
        toast('Refacción actualizada.', 'ok');
        btn.disabled = false; btn.textContent = 'Guardar';
      }catch(err){
        console.error(err);
        toast('No se pudo guardar. Intenta de nuevo.', 'err');
        btn.disabled = false; btn.textContent = 'Guardar';
      }
    });
  });
}

async function exportPedidosExcel(){
  const btn = document.getElementById('pedidos-export-btn');
  const originalText = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Generando...'; }
  try{
    const pedidos = window.__allPedidos || await getAllSolicitudesCompra();
    const pedidosRows = (pedidos || []).map(p => ({
      'Folio': p.id,
      'Nombre': p.nombre,
      'Teléfono': p.telefono,
      'Correo': p.correo || '',
      'Código cliente': p.codigo_cliente || '',
      'Taller': p.taller_nombre || '',
      'N° de taller': p.taller_id || '',
      'Refacciones solicitadas': (p.items||[]).map(i => `${i.numero_parte} · ${i.nombre} · Cant.${i.cantidad} · ${fmtMoney(i.subtotal)}`).join(' | '),
      'Total estimado': p.total_estimado || '',
      'Estatus': pedidoStatusInfo(p.status).label,
      'Notas del cliente': p.notas || '',
      'Notas internas': p.admin_notes || '',
      'Fecha de solicitud': (p.created_at || '').slice(0,10),
      'Última actualización': (p.updated_at || '').slice(0,10),
    }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, xlsxSheetOrPlaceholder(pedidosRows, 'Aún no hay pedidos registrados.'), 'Pedidos de refacciones');
    const filename = `Letbe_Pedidos_Refacciones_${new Date().toISOString().slice(0,10)}.xlsx`;
    XLSX.writeFile(wb, filename);
    toast('Reporte de pedidos generado.', 'ok');
  }catch(err){
    console.error(err);
    toast('No se pudo generar el reporte.', 'err');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = originalText; }
  }
}
