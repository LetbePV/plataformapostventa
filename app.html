async function handleCatalogoUpload(file, modelo, overwriteNombre){
  const statusEl = document.getElementById('refacciones-upload-status');
  const btn = document.getElementById('refacciones-upload-btn');
  statusEl.style.display = 'block';
  statusEl.style.color = 'var(--text-muted)';
  statusEl.textContent = 'Leyendo archivo...';
  btn.disabled = true;
  try{
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data);
    const { items: parsed, porSeccion } = parseCatalogoWorkbook(wb);
    if(!parsed.length){
      statusEl.textContent = 'No se encontraron renglones de refacciones en este archivo.';
      statusEl.style.color = 'var(--danger)';
      btn.disabled = false;
      return;
    }
    statusEl.textContent = `Se encontraron ${parsed.length} refacciones. Combinando con el catálogo existente...`;

    const existing = window.__allRefacciones || await getAllRefacciones() || [];
    const existingMap = new Map(existing.map(r => [r.numero_parte, r]));

    const rowsToUpsertMap = new Map();
    parsed.forEach(item => {
      const prev = existingMap.get(item.numero_parte);
      let modelos = modelo;
      if(prev && prev.modelos){
        const modelosSet = new Set(prev.modelos.split(',').map(m=>m.trim()).filter(Boolean));
        modelosSet.add(modelo);
        modelos = Array.from(modelosSet).join(', ');
      }
      // Si el número de parte se repite dentro del mismo catálogo (piezas comunes
      // usadas en varias secciones), nos quedamos con un solo renglón por parte.
      rowsToUpsertMap.set(item.numero_parte, {
        numero_parte: item.numero_parte,
        nombre: (overwriteNombre || !prev || !prev.nombre) ? item.nombre : prev.nombre,
        modelos,
        precio_taller_sin_iva: prev ? prev.precio_taller_sin_iva : null,
        precio_publico_sin_iva: prev ? prev.precio_publico_sin_iva : null,
        disponibilidad: prev ? prev.disponibilidad : 'Sobre pedido',
      });
    });
    const rowsToUpsert = Array.from(rowsToUpsertMap.values());

    statusEl.textContent = `Guardando ${rowsToUpsert.length} refacciones en la base de datos...`;
    await bulkUpsertRefacciones(rowsToUpsert);

    // Extrae los diagramas incrustados y arma el índice visual por sección
    statusEl.textContent = 'Extrayendo diagramas del catálogo...';
    const seccionSheetNames = Object.keys(porSeccion);
    const indiceEntries = parseIndiceEntries(wb);
    const images = await extractCatalogImages(data, seccionSheetNames);

    let imgCount = 0;
    const seccionesPartesRows = [];
    for(const sheetName of seccionSheetNames){
      const nombreSeccion = findNombreForSheet(sheetName, indiceEntries);
      let imagenUrl = '';
      const img = images[sheetName];
      if(img){
        statusEl.textContent = `Subiendo diagrama ${++imgCount} de ${seccionSheetNames.length} (${sheetName})...`;
        const fileObj = new File([img.blob], `${modelo}_${sheetName}.${img.ext}`, { type: img.blob.type || 'image/png' });
        imagenUrl = await uploadFile(fileObj, `catalogos/${slugify(modelo)}`);
      }
      await upsertCatalogoSeccion({
        id: `${modelo}-${sheetName}`,
        modelo,
        codigo: sheetName,
        nombre: nombreSeccion,
        imagen_url: imagenUrl,
        orden: seccionSheetNames.indexOf(sheetName),
      });
      porSeccion[sheetName].forEach(p=>{
        seccionesPartesRows.push({ modelo, codigo: sheetName, numero_parte: p.numero_parte, numero_diagrama: p.numero_diagrama });
      });
    }

    statusEl.textContent = 'Guardando índice de secciones...';
    await replaceSeccionesPartes(modelo, seccionesPartesRows);

    statusEl.textContent = `✓ Catálogo de ${modelo} cargado: ${rowsToUpsert.length} refacciones en ${seccionSheetNames.length} secciones (${imgCount} diagramas).`;
    statusEl.style.color = 'var(--success)';
    await loadRefaccionesAdmin('');
  }catch(err){
    console.error(err);
    statusEl.textContent = 'No se pudo procesar el archivo: ' + (err && err.message ? err.message : 'error desconocido') + '. Revisa el formato o tu conexión.';
    statusEl.style.color = 'var(--danger)';
  }
  btn.disabled = false;
}

async function handleExistenciasUpload(file){
  const statusEl = document.getElementById('existencias-upload-status');
  const btn = document.getElementById('existencias-upload-btn');
  statusEl.style.display = 'block';
  statusEl.style.color = 'var(--text-muted)';
  statusEl.textContent = 'Leyendo archivo...';
  btn.disabled = true;
  try{
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data);
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:null });

    // Detecta en qué columna está cada dato buscando el encabezado, sin
    // depender de un orden fijo de columnas.
    let headerRowIdx = -1, colParte = -1, colExistencia = -1;
    for(let ri=0; ri<Math.min(rows.length, 10); ri++){
      const row = rows[ri] || [];
      const pIdx = row.findIndex(c => typeof c === 'string' && /numero.*parte/i.test(c));
      const eIdx = row.findIndex(c => typeof c === 'string' && /existencia/i.test(c));
      if(pIdx >= 0 && eIdx >= 0){ headerRowIdx = ri; colParte = pIdx; colExistencia = eIdx; break; }
    }
    if(headerRowIdx === -1){
      statusEl.textContent = 'No se encontraron las columnas "Número de parte" y "Existencia" en el archivo.';
      statusEl.style.color = 'var(--danger)';
      btn.disabled = false;
      return;
    }

    const existentes = window.__allRefacciones || await getAllRefacciones() || [];
    const existentesSet = new Set(existentes.map(r => r.numero_parte));

    const updates = [];
    let noEncontrados = 0;
    for(let ri=headerRowIdx+1; ri<rows.length; ri++){
      const row = rows[ri] || [];
      const parteRaw = row[colParte];
      const existRaw = row[colExistencia];
      if(!parteRaw || typeof parteRaw !== 'string') continue;
      const numeroParte = parteRaw.trim().toUpperCase();
      const existencia = (existRaw === null || existRaw === undefined || existRaw === '') ? 0 : Number(existRaw);
      if(!existentesSet.has(numeroParte)){ noEncontrados++; continue; }
      updates.push({
        numero_parte: numeroParte,
        existencia,
        disponibilidad: existencia > 0 ? 'Disponible' : 'Sobre pedido',
      });
    }

    if(!updates.length){
      statusEl.textContent = 'No se encontró ninguna coincidencia con el catálogo ya cargado.';
      statusEl.style.color = 'var(--danger)';
      btn.disabled = false;
      return;
    }

    statusEl.textContent = `Actualizando existencias de ${updates.length} refacciones...`;
    await bulkUpsertRefacciones(updates);

    statusEl.textContent = `✓ Existencias actualizadas: ${updates.length} refacciones.` + (noEncontrados ? ` ${noEncontrados} número(s) de parte no se encontraron en el catálogo (no se tocaron).` : '');
    statusEl.style.color = 'var(--success)';
    await loadRefaccionesAdmin('');
  }catch(err){
    console.error(err);
    statusEl.textContent = 'No se pudo procesar el archivo: ' + (err && err.message ? err.message : 'error desconocido') + '. Revisa el formato o tu conexión.';
    statusEl.style.color = 'var(--danger)';
  }
  btn.disabled = false;
}

// Sube el archivo de precios "Precios para sistema.xlsx": columnas típicas
// No / Numero de parte / Nombre español / EXISTENCIA / Precio taller con iva / Precio publico general con iva.
// Los precios vienen CON IVA; aquí se les quita el IVA (IVA_RATE) para guardarlos
// en el formato interno sin IVA que usa el resto de la app.
async function handlePreciosUpload(file){
  const statusEl = document.getElementById('precios-upload-status');
  const btn = document.getElementById('precios-upload-btn');
  statusEl.style.display = 'block';
  statusEl.style.color = 'var(--text-muted)';
  statusEl.textContent = 'Leyendo archivo...';
  btn.disabled = true;
  try{
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data);
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:null });

    // Detecta columnas por encabezado (acepta variaciones de acentos/orden).
    let headerRowIdx = -1, colParte = -1, colNombre = -1, colTaller = -1, colPublico = -1;
    for(let ri=0; ri<Math.min(rows.length, 10); ri++){
      const row = rows[ri] || [];
      const pIdx = row.findIndex(c => typeof c === 'string' && /numero.*parte/i.test(c));
      const tIdx = row.findIndex(c => typeof c === 'string' && /precio.*taller/i.test(c));
      const uIdx = row.findIndex(c => typeof c === 'string' && /precio.*p.?ublic/i.test(c));
      if(pIdx >= 0 && tIdx >= 0 && uIdx >= 0){
        headerRowIdx = ri; colParte = pIdx; colTaller = tIdx; colPublico = uIdx;
        colNombre = row.findIndex(c => typeof c === 'string' && /nombre/i.test(c));
        break;
      }
    }
    if(headerRowIdx === -1){
      statusEl.textContent = 'No se encontraron las columnas de "Número de parte", "Precio taller" y "Precio público" en el archivo.';
      statusEl.style.color = 'var(--danger)';
      btn.disabled = false;
      return;
    }

    const existentes = window.__allRefacciones || await getAllRefacciones() || [];
    const existentesMap = new Map(existentes.map(r => [r.numero_parte, r]));

    // PostgREST exige que, dentro de un mismo POST masivo, todos los objetos
    // tengan exactamente las mismas llaves. Por eso separamos en dos lotes:
    // "nuevos" (traen nombre) y "actualizados" (solo precios, sin tocar nombre).
    const nuevosMap = new Map();
    const actualizadosMap = new Map();
    let omitidas = 0;
    for(let ri=headerRowIdx+1; ri<rows.length; ri++){
      const row = rows[ri] || [];
      const parteRaw = row[colParte];
      const tallerConIva = row[colTaller];
      const publicoConIva = row[colPublico];
      if(!parteRaw || typeof parteRaw !== 'string'){ continue; }
      const numeroParte = parteRaw.trim().toUpperCase();
      const tallerNum = Number(tallerConIva);
      const publicoNum = Number(publicoConIva);
      if(tallerConIva == null || publicoConIva == null || isNaN(tallerNum) || isNaN(publicoNum)){
        omitidas++;
        continue;
      }
      const precioTallerSinIva = Math.round((tallerNum / (1 + IVA_RATE)) * 100) / 100;
      const precioPublicoSinIva = Math.round((publicoNum / (1 + IVA_RATE)) * 100) / 100;
      const prev = existentesMap.get(numeroParte);
      if(!prev){
        const nombreRaw = colNombre >= 0 ? row[colNombre] : null;
        nuevosMap.set(numeroParte, {
          numero_parte: numeroParte,
          nombre: (typeof nombreRaw === 'string' && nombreRaw.trim()) ? nombreRaw.trim() : '',
          precio_taller_sin_iva: precioTallerSinIva,
          precio_publico_sin_iva: precioPublicoSinIva,
        });
      }else{
        actualizadosMap.set(numeroParte, {
          numero_parte: numeroParte,
          precio_taller_sin_iva: precioTallerSinIva,
          precio_publico_sin_iva: precioPublicoSinIva,
        });
      }
    }
    const nuevosRows = Array.from(nuevosMap.values());
    const actualizadosRows = Array.from(actualizadosMap.values());

    if(!nuevosRows.length && !actualizadosRows.length){
      statusEl.textContent = 'No se encontró ningún renglón con número de parte y precios válidos.';
      statusEl.style.color = 'var(--danger)';
      btn.disabled = false;
      return;
    }

    statusEl.textContent = `Guardando precios de ${nuevosRows.length + actualizadosRows.length} refacciones...`;
    if(actualizadosRows.length) await bulkUpsertRefacciones(actualizadosRows);
    if(nuevosRows.length) await bulkUpsertRefacciones(nuevosRows);

    statusEl.textContent = `✓ Precios actualizados: ${actualizadosRows.length} refacción(es) existente(s), ${nuevosRows.length} nueva(s) creada(s).` + (omitidas ? ` ${omitidas} renglón(es) omitido(s) por no traer precio.` : '');
    statusEl.style.color = 'var(--success)';
    await loadRefaccionesAdmin('');
  }catch(err){
    console.error(err);
    statusEl.textContent = 'No se pudo procesar el archivo: ' + (err && err.message ? err.message : 'error desconocido') + '. Revisa el formato o tu conexión.';
    statusEl.style.color = 'var(--danger)';
  }
  btn.disabled = false;
}

async function exportRefaccionesExcel(){
  const btn = document.getElementById('refacciones-export-btn');
  const originalText = btn.textContent;
  btn.disabled = true; btn.textContent = 'Generando...';
  try{
    const rows = window.__allRefacciones || await getAllRefacciones();
    if(rows === null){ toast('No se pudo conectar a la base de datos.', 'err'); return; }
    if(!rows.length){ toast('Aún no hay refacciones cargadas.', 'err'); return; }
    const excelRows = rows.map(r => ({
      'N.o DE PARTE': r.numero_parte,
      'DESCRIPCION': r.nombre,
      'MODELO(S)': r.modelos,
      'PRECIO A TALLER SIN IVA': r.precio_taller_sin_iva ?? '',
      'PRECIO PUBLICO SUGERIDO SIN IVA': r.precio_publico_sin_iva ?? '',
      'PRECIO PUBLICO SUGERIDO CON IVA': conIva(r.precio_publico_sin_iva) ?? '',
      'UTILIDAD': calcUtilidad(r.precio_publico_sin_iva, r.precio_taller_sin_iva) ?? '',
      '% UTILIDAD': calcPctUtilidad(r.precio_publico_sin_iva, r.precio_taller_sin_iva) != null ? Number(calcPctUtilidad(r.precio_publico_sin_iva, r.precio_taller_sin_iva).toFixed(2)) : '',
      'PRECIO A TALLER CON IVA': conIva(r.precio_taller_sin_iva) ?? '',
      'DISPONIBILIDAD': r.disponibilidad,
      'EXISTENCIA': r.existencia ?? '',
    }));
    const ws = XLSX.utils.json_to_sheet(excelRows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Refacciones');
    XLSX.writeFile(wb, `Letbe_Refacciones_${new Date().toISOString().slice(0,10)}.xlsx`);
    toast('Catálogo descargado.', 'ok');
  }catch(err){
    console.error(err);
    toast('No se pudo generar el archivo.', 'err');
  }
  btn.disabled = false; btn.textContent = originalText;
}

      'Contacto': d.contacto,
      'Estatus': d.activo ? 'Activo' : 'Dado de baja',
      'Fecha de alta': (d.created_at || '').slice(0,10),
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();

}

async function handleDistribuidorBulkUpload(file){
  if(!file) return;
  try{
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data);
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet);
    if(!rows.length){ toast('El archivo Excel no tiene filas.', 'err'); return; }

    const created = [];
    const skipped = [];
    for(const row of rows){
      const nombre = row['Nombre del distribuidor'] || row['Nombre'] || row['nombre'] || '';
      if(!nombre || !String(nombre).trim()) continue;
      const idFromFile = row['No distribuidor'] || row['Número de distribuidor'] || row['ID'] || '';
      const id = String(idFromFile).trim() ? String(idFromFile).trim().toUpperCase() : genDistribuidorId();
      const dist = {
        id,
        nombre: String(nombre).trim(),
        password: genTallerPassword(),
        ciudad: String(row['Ciudad'] || row['ciudad'] || '').trim(),
        estado: String(row['Estado'] || row['estado'] || '').trim(),
        telefono: String(row['Teléfono'] || row['Telefono'] || row['telefono'] || '').trim(),
        contacto: String(row['Contacto'] || row['contacto'] || '').trim(),
        activo: true,
      };
      try{
        await createDistribuidor(dist);
        created.push(dist);
      }catch(e){
        skipped.push(id);
      }
    }

    if(!created.length){
      toast('No se pudo dar de alta ningún distribuidor. Verifica las columnas del archivo.', 'err');
      return;
    }

    const wsOut = XLSX.utils.json_to_sheet(created.map(d => ({
      'Número de distribuidor': d.id,
      'Nombre': d.nombre,
      'Contraseña': d.password,
      'Ciudad': d.ciudad,
      'Estado': d.estado,
      'Teléfono': d.telefono,
      'Contacto': d.contacto,
    })));
    const wbOut = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wbOut, wsOut, 'Accesos de distribuidores');
    XLSX.writeFile(wbOut, `Letbe_Accesos_Distribuidores_${new Date().toISOString().slice(0,10)}.xlsx`);

    await loadDistribuidoresAdmin();
    const skipMsg = skipped.length ? ` (${skipped.length} se omitieron, posiblemente ya existían)` : '';
    toast(`${created.length} distribuidor(es) creados${skipMsg}. Se descargó un Excel con sus accesos.`, 'ok');
  }catch(err){
    console.error(err);
    toast('No se pudo procesar el archivo Excel.', 'err');
  }
}

async function handleTiendaRetailBulkUpload(file, cadenaId, cadenaNombre){
  if(!file) return;
  try{
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data);
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet);
    if(!rows.length){ toast('El archivo Excel no tiene filas.', 'err'); return; }

    const created = [];
    const skipped = [];
    for(const row of rows){
      const nombre = row['Nombre de la tienda'] || row['Nombre'] || row['nombre'] || row['Sucursal'] || row['sucursal'] || '';
      if(!nombre || !String(nombre).trim()) continue;
      const idFromFile = row['No tienda'] || row['Número de tienda'] || row['ID'] || '';
      const id = String(idFromFile).trim() ? String(idFromFile).trim().toUpperCase() : genTiendaRetailId();
      const tienda = {
        id,
        cadena_id: cadenaId,
        cadena_nombre: cadenaNombre,
        nombre: String(nombre).trim(),
        password: genTallerPassword(),
        ciudad: String(row['Ciudad'] || row['ciudad'] || '').trim(),
        estado: String(row['Estado'] || row['estado'] || '').trim(),
        telefono: String(row['Teléfono'] || row['Telefono'] || row['telefono'] || '').trim(),
        contacto: String(row['Contacto'] || row['contacto'] || '').trim(),
        activo: true,
      };
      try{
        await createTiendaRetail(tienda);
        created.push(tienda);
      }catch(e){
        skipped.push(id);
      }
    }

    if(!created.length){
      toast('No se pudo dar de alta ninguna tienda. Verifica las columnas del archivo.', 'err');
      return;
    }

    const wsOut = XLSX.utils.json_to_sheet(created.map(t => ({
      'Número de tienda': t.id,
      'Nombre': t.nombre,
      'Contraseña': t.password,
      'Ciudad': t.ciudad,
      'Estado': t.estado,
      'Teléfono': t.telefono,
      'Contacto': t.contacto,
    })));
    const wbOut = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wbOut, wsOut, 'Accesos de tiendas');
    XLSX.writeFile(wbOut, `Letbe_Accesos_Tiendas_${cadenaNombre.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.xlsx`);

    await loadTiendasRetailAdmin(cadenaId);

    toast(`${created.length} tienda(s) creadas${skipMsg}. Se descargó un Excel con sus accesos.`, 'ok');
  }catch(err){
    console.error(err);
    toast('No se pudo procesar el archivo Excel.', 'err');
  }
}

/* ---- Carga masiva multi-cadena: un solo Excel con columnas "Cadena" y
   "Sucursal" (formato de las bases de sucursales de cadenas comerciales) —
   crea las cadenas que falten y da de alta todas las tiendas en lotes. ---- */
function genUniqueTiendaIds(n, existingIdsSet){
  const chars = '23456789';
  const used = existingIdsSet || new Set();
  const ids = [];
  const seen = new Set();
  let guard = 0;
  while(ids.length < n && guard < n * 50){
    guard++;
    let s = 'RT-';
    for(let i=0;i<4;i++) s += chars[Math.floor(Math.random()*chars.length)];
    if(used.has(s) || seen.has(s)) continue;
    seen.add(s);
    ids.push(s);
  }
  return ids;
}
async function ensureCadenasExist(nombres){
  const existing = await getAllCadenas() || [];
  const byLower = new Map(existing.map(c => [String(c.nombre).trim().toLowerCase(), c]));
  const result = new Map();
  for(const nombreRaw of nombres){
    const nombre = String(nombreRaw).trim();
    const key = nombre.toLowerCase();
    if(byLower.has(key)){
      result.set(key, byLower.get(key));
      continue;
    }
    const rec = { id: genCadenaId(nombre), nombre, activo: true };
    try{
      await createCadena(rec);
    }catch(e){
      console.error('No se pudo crear la cadena', nombre, e);
      continue;
    }
    byLower.set(key, rec);
    result.set(key, rec);
  }
  return result;
}

async function handleRetailMultiCadenaBulkUpload(file){
  if(!file) return;
  const btn = document.getElementById('retail-bulk-multi-btn');
  const originalText = btn ? btn.textContent : '';
  const setProgress = (msg) => { if(btn) btn.textContent = msg; };
  try{
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data);
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
    if(!rows.length){ toast('El archivo Excel no tiene filas.', 'err'); return; }

    const parsed = [];
    for(const row of rows){
      const cadena = String(row['Cadena'] || row['cadena'] || '').trim();
      const sucursal = String(row['Sucursal'] || row['sucursal'] || row['Nombre'] || row['nombre'] || '').trim();
      if(!cadena || !sucursal) continue;
      parsed.push({ cadena, sucursal });
    }
    if(!parsed.length){
      toast('No se encontraron filas válidas. El archivo debe tener columnas "Cadena" y "Sucursal".', 'err');
      return;
    }

    // Cada fila es una tienda física independiente, aunque el nombre se
    // repita entre distintas ciudades (p.ej. "Coppel Juárez" existe en
    // muchas plazas) — no se deduplica por nombre, cada fila = un acceso.
    const cadenaNombresUnicos = Array.from(new Set(parsed.map(p => p.cadena)));
    const proceed = await openRetailBulkConfirmModal(parsed, cadenaNombresUnicos);
    if(!proceed) return;

    if(btn) btn.disabled = true;
    setProgress('Preparando cadenas...');
    const cadenaMap = await ensureCadenasExist(cadenaNombresUnicos);

    setProgress('Generando accesos...');
    const existingTiendas = await getAllTiendasRetail() || [];
    const existingIds = new Set(existingTiendas.map(t => t.id));

    const toInsert = [];
    for(const p of parsed){
      const cadena = cadenaMap.get(p.cadena.toLowerCase());
      if(!cadena) continue;
      toInsert.push({ cadena_id: cadena.id, cadena_nombre: cadena.nombre, nombre: p.sucursal });
    }

    if(!toInsert.length){
      toast('No se pudo relacionar ninguna fila con una cadena válida.', 'err');
      return;
    }

    const ids = genUniqueTiendaIds(toInsert.length, existingIds);
    const finalRows = toInsert.map((t, i) => ({
      id: ids[i],
      cadena_id: t.cadena_id,
      cadena_nombre: t.cadena_nombre,
      nombre: t.nombre,
      password: genTallerPassword(),
      ciudad: '',
      estado: '',
      telefono: '',
      contacto: '',
      activo: true,
    }));

    const chunkSize = 300;
    for(let i=0; i<finalRows.length; i+=chunkSize){
      setProgress(`Creando tiendas ${Math.min(i+chunkSize, finalRows.length)}/${finalRows.length}...`);
      const chunk = finalRows.slice(i, i+chunkSize);
      await sbRequest('tiendas_retail', {
        method: 'POST',
        headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify(chunk),
      });
    }

    setProgress('Generando Excel de accesos...');
    const wsOut = XLSX.utils.json_to_sheet(finalRows.map(t => ({
      'Cadena': t.cadena_nombre,
      'Número de tienda': t.id,
      'Nombre': t.nombre,
      'Contraseña': t.password,
    })));
    const wbOut = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wbOut, wsOut, 'Accesos tiendas retail');
    XLSX.writeFile(wbOut, `Letbe_Accesos_Tiendas_Retail_${new Date().toISOString().slice(0,10)}.xlsx`);

    await loadCadenasAdmin();
    toast(`${finalRows.length} tienda(s) creadas en ${cadenaMap.size} cadena(s). Se descargó un Excel con sus accesos.`, 'ok');
  }catch(err){
    console.error(err);
    toast('No se pudo procesar el archivo Excel.', 'err');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = originalText || '📥 Carga masiva (multi-cadena)'; }
  }
}

// Empareja el encabezado de una columna de Excel sin importar mayúsculas,
// acentos o espacios extra (p.ej. "DIRECCIÓN", "Direccion ", "dirección" son
// la misma columna). Recibe la fila y una lista de nombres posibles.
function normalizeColKey(k){
  return String(k||'').trim().toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}
function getRowValue(row, aliases){
  if(!row.__normMap){
    row.__normMap = {};
    Object.keys(row).forEach(k => { row.__normMap[normalizeColKey(k)] = row[k]; });
  }
  for(const a of aliases){
    const v = row.__normMap[normalizeColKey(a)];
    if(v !== undefined && v !== null && String(v).trim() !== '') return String(v).trim();
  }
  return '';
}
// Junta varias columnas de teléfono (p.ej. "TELEFONO 1", "TELEFONO 2", "TELEFONO 3",
// "Celular", "Whatsapp") en un solo texto, separadas por " / ", sin duplicados.
function getPhonesCombined(row){
  if(!row.__normMap){
    row.__normMap = {};
    Object.keys(row).forEach(k => { row.__normMap[normalizeColKey(k)] = row[k]; });
  }
  const vals = [];
  Object.keys(row.__normMap).sort().forEach(k => {
    if(!/^(TEL|TELEFONO|CELULAR|WHATSAPP)/.test(k)) return;
    const v = row.__normMap[k];
    if(v !== undefined && v !== null && String(v).trim() !== '') vals.push(String(v).trim());
  });
  return [...new Set(vals)].join(' / ');
}
// Quita una etiqueta redundante al inicio de la dirección, p.ej.
// "DIRECCIÓN: Alejandro Humbolt #17614..." -> "Alejandro Humbolt #17614..."
function cleanDireccion(v){
  return String(v||'').replace(/^\s*(DIRECCI[OÓ]N|DOMICILIO)\s*:\s*/i, '').trim();
}

async function handleTallerBulkUpload(file){
  if(!file) return;
  try{
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data);
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet);
    if(!rows.length){ toast('El archivo Excel no tiene filas.', 'err'); return; }

    const existentes = await getAllTalleres();
    const existentesMap = new Map((existentes || []).map(t => [t.id, t]));

    const created = [];
    const updated = [];
    const skipped = [];
    for(const row of rows){
      const nombre = getRowValue(row, ['NOMBRE TALLER','Nombre del taller','Nombre','Taller','Razón social']);
      if(!nombre){ continue; } // filas vacías (número reservado sin usar aún)
      const idFromFile = getRowValue(row, ['No taller','No Taller','Número de taller','Numero de taller','No.','ID']);
      const id = idFromFile ? idFromFile.toUpperCase() : genTallerId();
      const camposComunes = {
        nombre,
        direccion: cleanDireccion(getRowValue(row, ['Dirección','Direccion','Domicilio','Calle','Ubicación exacta'])),
        ciudad: getRowValue(row, ['Ciudad','Municipio']),
        estado: getRowValue(row, ['Estado']),
        telefono: getPhonesCombined(row),
        contacto: getRowValue(row, ['Contacto','Persona de contacto','Encargado','Responsable','Nombre de contacto']),
        email: getRowValue(row, ['Correo','Correo electrónico','Email','E-mail']),
      };
      const yaExiste = existentesMap.get(id);
      try{
        if(yaExiste){
          // Ya existe: solo actualiza sus datos, sin tocar su contraseña ni su estatus.
          await updateTaller(id, camposComunes);
          updated.push({ id, ...camposComunes });
        }else{
          const taller = { id, password: genTallerPassword(), activo: true, ...camposComunes };
          await createTaller(taller);
          created.push(taller);
        }
      }catch(e){
        console.error(e);
        skipped.push(id);
      }
    }

    if(!created.length && !updated.length){
      toast('No se pudo procesar ningún taller. Verifica las columnas "No taller" y "NOMBRE TALLER" del archivo.', 'err');
      return;
    }

    // Genera un Excel de vuelta solo con los accesos de los talleres NUEVOS
    // (los que ya existían conservan su contraseña original, no se reparte de nuevo).
    if(created.length){
      const wsOut = XLSX.utils.json_to_sheet(created.map(t => ({
        'Número de taller': t.id,
        'Nombre': t.nombre,
        'Contraseña': t.password,
        'Dirección': t.direccion,
        'Ciudad': t.ciudad,
        'Estado': t.estado,
        'Teléfono': t.telefono,
        'Contacto': t.contacto,
        'Correo': t.email,
      })));
      const wbOut = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wbOut, wsOut, 'Accesos de talleres nuevos');
      XLSX.writeFile(wbOut, `Letbe_Accesos_Talleres_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    await loadTalleresAdmin();
    const parts = [];
    if(created.length) parts.push(`${created.length} taller(es) creados`);
    if(updated.length) parts.push(`${updated.length} taller(es) actualizados`);
    if(skipped.length) parts.push(`${skipped.length} con error`);
    const fileMsg = created.length ? ' Se descargó un Excel con los accesos de los nuevos.' : '';
    toast(`${parts.join(', ')}.${fileMsg}`, 'ok');
  }catch(err){
    console.error(err);
    toast('No se pudo procesar el archivo Excel.', 'err');
  }
}

async function exportExcelReport(){

    const orders = await getAllOrders();
    const garantiasTaller = await getAllGarantiasTaller();
    const pedidos = await getAllSolicitudesCompra();

    // Hoja 1: Clientes y motos
    const motosRows = customers.map(c => {
      const done = c.services.filter(s => s.done).length;
      const tier = tierFor(done);
      return {

    // Hoja 2: Servicios (una fila por cada uno de los 11 servicios, por moto)
    const serviciosRows = [];
    customers.forEach(c=>{
      c.services.forEach(s=>{
        const st = computeServiceStatus(s, c.purchaseDate);
        let estatus;
        if(s.done) estatus = s.validado ? 'Cumplido - validado' : 'Cumplido - en revisión';
        else if(st.status === 'overdue') estatus = 'Vencido';
        else if(st.status === 'soon') estatus = 'Próximo a vencer';

        serviciosRows.push({
          'Código cliente': c.id,
          'Nombre': c.name,
          'Modelo': c.model,
          'N° de servicio': s.n,
          'Programado (meses)': s.months,

          'Estatus': estatus,

          'Taller': s.taller || '',
          'Fecha realizado': s.fecha || '',
          'Km real': s.km_real || '',
          'N° factura': s.factura || '',
          'Comprobante (URL)': s.facturaFile || '',
        });
      });
    });

    // Hoja 3: Próximos y vencidos (solo lo que aún no se cumple)
    const proximosRows = serviciosRows.filter(r => r['Estatus'] === 'Vencido' || r['Estatus'] === 'Próximo a vencer' || r['Estatus'] === 'Pendiente');

    // Hoja 4: Reporte de fallas (reportadas por el cliente, por escrito, en Bitácora Digital)
    const fallasRows = (claims || []).map(c=>{
      const cust = c.customers || {};
      return {
        'ID Reporte': c.id,
        'Código cliente': cust.id || c.customer_id,
        'Nombre': cust.name || '',
        'Modelo': cust.model || '',
        'Fecha de reporte': (c.created_at || '').slice(0,10),
        'Kilometraje reportado': c.km_actual,
        'Descripción': c.description,
        'Estatus': claimStatusInfo(c.status).label,
        'Comentarios Letbe': c.admin_notes || '',
      };
    });

    // Hoja 5: Órdenes de talleres (Servicio, Diagnóstico)
    const tipoLabelExport = { servicio: 'Servicio', diagnostico: 'Diagnóstico' };
    const ordenesRows = (orders || []).map(o => ({
      'Folio': o.id,
      'Tipo': tipoLabelExport[o.tipo] || o.tipo,
      'Taller': o.taller_nombre,
      'N° de taller': o.taller_id,
      'Cliente': o.cliente_nombre,
      'Código cliente': o.customer_id,
      'Moto': o.moto_modelo,
      'N° servicio kilometrado': o.servicio_n || '',
      'Total': o.total || '',
      'Estatus': orderStatusInfo(o.status).label,
      'Fecha de entrada': o.fecha_entrada ? o.fecha_entrada.slice(0,10) : '',
      'Fecha de creación': (o.created_at || '').slice(0,10),
    }));

    // Hoja 6: Garantías (generadas por talleres)
    const garantiasTallerRows = (garantiasTaller || []).map(g => ({
      'Folio': g.id,
      'Taller': g.taller_nombre,
      'N° de taller': g.taller_id,
      'Código cliente': g.customer_id,
      'Cliente': g.cliente_nombre,
      'Moto': g.moto_modelo,
      'Km actual': g.km_actual,
      'Descripción': g.description,
      'Estatus': garantiaTallerStatusInfo(g.status).label,
      'Refacciones solicitadas': (g.refacciones||[]).map(r => `${r.numero_parte||'s/n'} · ${r.nombre||''} · Cant.${r.cantidad} (${r.decision==='autorizada'?'Autorizada':r.decision==='rechazada'?'Rechazada':'Pendiente'})`).join(' | '),
      'Comentarios Letbe': g.admin_notes || '',
      'Foto moto (URL)': g.photo_moto || '',
      'Foto tablero TFT (URL)': g.photo_tablero || '',
      'Foto pieza dañada 1 (URL)': g.photo_parte1 || '',
      'Foto pieza dañada 2 (URL)': g.photo_parte2 || '',
      'Foto proceso reparación (URL)': g.photo_proceso || '',
      'Foto ya reparada (URL)': g.photo_reparada || '',
      'Fecha de reporte': (g.created_at || '').slice(0,10),
      'Fecha de entrega al cliente': g.fecha_entrega ? new Date(g.fecha_entrega).toLocaleString('es-MX') : '',
      'Comentarios de finalización': g.comentarios_finalizacion || '',
      'Última actualización': (g.updated_at || '').slice(0,10),
    }));

    // Hoja 7: Pedidos de refacciones (solicitudes de compra desde el cotizador)
    const pedidosRows = (pedidos || []).map(p => ({
      'Folio': p.id,
      'Nombre': p.nombre,
      'Teléfono': p.telefono,
      'Correo': p.correo || '',
      'Código cliente': p.codigo_cliente || '',
      'Taller': p.taller_nombre || '',
      'N° de taller': p.taller_id || '',
      'Refacciones solicitadas': (p.items||[]).map(i => `${i.numero_parte} · ${i.nombre} · Cant.${i.cantidad} · ${fmtMoney(i.subtotal)}`).join(' | '),
      'Total estimado': p.total_estimado || '',
      'Estatus': pedidoStatusInfo(p.status).label,
      'Notas del cliente': p.notas || '',
      'Notas internas': p.admin_notes || '',
      'Fecha de solicitud': (p.created_at || '').slice(0,10),
      'Última actualización': (p.updated_at || '').slice(0,10),
    }));

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(motosRows), 'Clientes y motos');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(serviciosRows), 'Servicios');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(proximosRows), 'Próximos y vencidos');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(fallasRows), 'Reporte de fallas');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ordenesRows), 'Órdenes de talleres');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(garantiasTallerRows), 'Garantías');
    XLSX.utils.book_append_sheet(wb, xlsxSheetOrPlaceholder(pedidosRows, 'Aún no hay pedidos registrados.'), 'Pedidos de refacciones');

    const filename = `Letbe_Reporte_${new Date().toISOString().slice(0,10)}.xlsx`;
    XLSX.writeFile(wb, filename);
    toast('Reporte descargado correctamente.', 'ok');
  }catch(err){
    console.error(err);
    toast('No se pudo generar el reporte. Intenta de nuevo.', 'err');
  }
  btn.disabled = false; btn.textContent = originalText;
}

async function loadAlerts(){
  const customers = await getAllCustomers();
  if(customers === null){
    document.getElementById('admin-alerts').innerHTML = `<div class="empty" style="padding:24px; color:var(--danger);">No se pudo conectar a la base de datos. Verifica tu conexión a internet.</div>`;
    window.__allAlerts = [];
    return;
  }
  const alerts = [];
  for(const c of customers){
    for(const s of c.services){
      if(s.done) continue;
      const st = computeServiceStatus(s, c.purchaseDate);
      if(st.status === 'overdue' || st.status === 'soon'){
        alerts.push({customer:c, service:s, ...st});
      }
    }
  }
  alerts.sort((a,b)=> a.diff - b.diff); // más vencido / más próximo primero
  window.__allAlerts = alerts;
  window.__allCustomers = customers;
  renderAlertsList(alerts);
}

function renderAlertsList(alerts){
  const tab = state.alertTab || 'all';
  const filtered = alerts.filter(a => tab === 'all' ? true : a.status === tab);
  const container = document.getElementById('admin-alerts');
  if(!container) return;
  if(!filtered.length){
    container.innerHTML = `<div class="empty" style="padding:24px;">Sin alertas pendientes en esta categoría. 🎉</div>`;
    return;
  }
  container.innerHTML = filtered.map(a=>{
    const isOverdue = a.status === 'overdue';
    const dueStr = fmtDate(a.due.toISOString().slice(0,10));
    const badge = isOverdue
      ? `<span class="badge badge-danger">Vencido hace ${Math.abs(a.diff)} día${Math.abs(a.diff)===1?'':'s'}</span>`
      : `<span class="badge badge-yellow">Vence en ${a.diff} día${a.diff===1?'':'s'}</span>`;
    return `
    <div class="alert-item ${a.status}">
      <div class="alert-info">
        <b>${esc(a.customer.name)}</b> · ${esc(a.customer.model)} <span class="id-pill" style="margin-left:6px;">${a.customer.id}</span>
        <div class="meta">Servicio ${a.service.n} · programado a los ${a.service.months} meses · fecha estimada ${dueStr}</div>
      </div>
      <div class="alert-actions">
        ${badge}
        <a href="tel:${esc(a.customer.phone)}" class="btn btn-ghost btn-sm">📞 Llamar</a>
        <a href="mailto:${esc(a.customer.email)}" class="btn btn-ghost btn-sm">✉️ Correo</a>
      </div>
    </div>`;
  }).join('');
}

            ${CLAIM_STATUSES.map(s => `<option value="${s.key}" ${c.status===s.key?'selected':''}>${s.label}</option>`).join('')}
          </select>
          <button class="btn btn-yellow btn-sm" data-admin-save-claim="${c.id}">Guardar cambios</button>
          ${cust.phone ? `<a href="tel:${esc(cust.phone)}" class="btn btn-ghost btn-sm">📞 Llamar</a>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  container.querySelectorAll('[data-admin-save-claim]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const claimId = btn.dataset.adminSaveClaim;
      const select = container.querySelector(`.admin-claim-status-select[data-claim="${claimId}"]`);
      const notesInput = container.querySelector(`.admin-claim-notes-input[data-claim="${claimId}"]`);
      btn.disabled = true; btn.textContent = 'Guardando...';
      try{
        await updateClaimStatus(claimId, select.value, notesInput ? notesInput.value.trim() : '');
        toast('Garantía actualizada.', 'ok');
        await loadClaimsAdmin();
      }catch(err){
        console.error(err);
        toast('No se pudo actualizar. Intenta de nuevo.', 'err');
        btn.disabled = false; btn.textContent = 'Guardar cambios';
      }
    });
  });
}

async function loadAdminTable(filter){
  const customers = window.__allCustomers || await getAllCustomers();
  if(customers === null){
    document.getElementById('admin-tbody').innerHTML = `<tr><td colspan="7"><div class="empty" style="color:var(--danger);">No se pudo conectar a la base de datos. Verifica tu conexión a internet.</div></td></tr>`;
    return;
  }
  const rows = [];
  let totalMotos = customers.length;
  let totalServiciosCumplidos = 0;

  for(const c of customers){
    const services = c.services;
    const done = services.filter(s => s.done).length;
    totalServiciosCumplidos += done;
    const tier = tierFor(done);

    const haystack = [c.name, c.phone, c.email, c.serial, c.id, c.model, formatAddress(c)].join(' ').toLowerCase();
    if(filter && !haystack.includes(filter)) continue;

    rows.push(`
      <tr>
        <td><span class="id-pill">${c.id}</span></td>
        <td><b>${esc(c.name)}</b></td>
        <td>${esc(c.model)} · ${esc(c.year)}</td>
        <td>${esc(c.phone)}<br><span style="color:var(--text-faint);">${esc(c.email)}</span></td>
        <td>${done} / ${SCHEDULE.length}</td>
        <td>${tier ? `<span class="badge" style="background:${tier.color}22; color:${tier.color};">${tier.label}</span>` : `<span class="badge badge-pending">—</span>`}</td>
        <td><button class="btn btn-ghost btn-sm" data-open="${c.id}">Ver</button></td>
      </tr>
    `);
  }

  document.getElementById('admin-tbody').innerHTML = rows.length
    ? rows.join('')
    : `<tr><td colspan="7"><div class="empty">Sin resultados para mostrar.</div></td></tr>`;

  document.getElementById('admin-stats').innerHTML = `
    <div class="card"><div class="eyebrow">Motos registradas</div><div class="display" style="font-size:28px;">${totalMotos}</div></div>
    <div class="card"><div class="eyebrow">Servicios cumplidos</div><div class="display" style="font-size:28px;">${totalServiciosCumplidos}</div></div>
    <div class="card"><div class="eyebrow">Alertas activas</div><div class="display" style="font-size:28px; color:var(--danger);">${(window.__allAlerts||[]).length}</div></div>
  `;

  document.querySelectorAll('[data-open]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.open;
      const c = await getCustomer(id);
      const detail = document.getElementById('admin-detail');
      detail.innerHTML = await renderCustomerDetail(id, c, true);
      bindCustomerDetail(id, true);
      detail.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

async function render(){
  let activeLabel = '';
  document.querySelectorAll('#nav button').forEach(b=>{
    const isActive = b.dataset.view === state.view;
    b.classList.toggle('active', isActive);
    if(isActive) activeLabel = b.textContent;
  });
  const navToggleLabel = document.getElementById('nav-toggle-label');
  if(navToggleLabel && activeLabel) navToggleLabel.textContent = activeLabel;
  closeNavDropdown();
  const main = document.getElementById('main');
  if(state.view === 'registro'){
    main.innerHTML = renderRegistro();
    bindRegistro();
  }else if(state.view === 'consulta'){
    main.innerHTML = renderConsulta();
    bindConsulta();
  }else if(state.view === 'talleres'){
    main.innerHTML = renderTalleres();
    bindTalleres();
  }else if(state.view === 'socios'){
    main.innerHTML = renderSociosComerciales();
    bindSociosComerciales();
  }else if(state.view === 'distribuidores'){
    main.innerHTML = renderDistribuidores();
    bindDistribuidores();
  }else if(state.view === 'retail'){
    main.innerHTML = renderRetail();
    bindRetail();
  }else if(state.view === 'cotizador'){
    main.innerHTML = renderCotizador();
    bindCotizador();
  }else if(state.view === 'admin'){
    if(state.refaccionesStaffAuthed){
      main.innerHTML = renderRefaccionesStaffPanel();
      await bindRefaccionesStaffPanel();
    }else{
      main.innerHTML = renderAdmin();
      await bindAdmin();
    }
  }
  renderPedidoFloat();
}

// Cuando la herramienta se carga dentro de un <iframe> (p.ej. incrustada en
// la página oficial de Letbe para el público), se oculta el botón "Panel
// admin" del menú — el acceso administrativo queda reservado para cuando el
// staff entra directo a la URL de la herramienta (fuera del iframe). No es
// una medida de seguridad (el panel sigue protegido por su propio código de
// acceso), solo evita mostrarle ese botón a cualquier visitante público.
(function hideAdminButtonInIframe(){
  let inIframe = false;
  try{ inIframe = window.self !== window.top; }catch(e){ inIframe = true; }

    if(adminBtn) adminBtn.remove();

// Menú desplegable de navegación en móvil: el botón "Menú" abre/cierra
// la lista de opciones; un tap fuera de la lista la cierra.
function closeNavDropdown(){
  const nav = document.getElementById('nav');
  const toggle = document.getElementById('nav-toggle');
  if(nav) nav.classList.remove('open');
  if(toggle){ toggle.classList.remove('open'); toggle.setAttribute('aria-expanded','false'); }
}
(function bindNavToggle(){
  const toggle = document.getElementById('nav-toggle');
  const nav = document.getElementById('nav');
  if(!toggle || !nav) return;
  toggle.addEventListener('click', (e)=>{
    e.stopPropagation();
    const willOpen = !nav.classList.contains('open');
    nav.classList.toggle('open', willOpen);
    toggle.classList.toggle('open', willOpen);
    toggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
  });
  document.addEventListener('click', (e)=>{
    if(!nav.classList.contains('open')) return;
    if(nav.contains(e.target) || toggle.contains(e.target)) return;
    closeNavDropdown();
  });
})();

// ---------- Ayuda: manual de usuario por apartado ----------
// Cada apartado de la herramienta tiene su propio manual de usuario (HTML
// autocontenido en la carpeta "manuals/", junto a este archivo). El botón
// flotante "Ayuda" abre el manual correspondiente a la vista activa en ese
// momento — incluye los sub-portales de Socios comerciales (Distribuidor y
// Retail comparten manual) y el panel de Staff de Refacciones dentro de
// Panel admin.
const HELP_MANUALS = {
  registro:        { file: 'manual-registro.html',           label: 'Activa tu garantía' },
  consulta:        { file: 'manual-bitacora.html',            label: 'Bitácora digital' },
  cotizador:       { file: 'manual-refacciones.html',         label: 'Refacciones' },
  socios:          { file: 'manual-socios.html',               label: 'Socios comerciales' },
  distribuidores:  { file: 'manual-socios.html',               label: 'Socios comerciales · Distribuidor' },
  retail:          { file: 'manual-socios.html',               label: 'Socios comerciales · Retail' },
  talleres:        { file: 'manual-talleres.html',             label: 'Talleres' },
  admin:           { file: 'manual-admin.html',                label: 'Panel admin' },
};
function currentHelpManual(){
  if(state.view === 'admin' && state.refaccionesStaffAuthed){
    return { file: 'manual-refacciones-staff.html', label: 'Staff de Refacciones' };
  }
  return HELP_MANUALS[state.view] || HELP_MANUALS.registro;
}
function closeHelpModal(){
  const wrap = document.getElementById('help-modal-wrap');
  if(wrap) wrap.innerHTML = '';
  document.removeEventListener('keydown', helpModalEscHandler);
}
function helpModalEscHandler(e){
  if(e.key === 'Escape') closeHelpModal();
}
// URL base pública donde vive esta herramienta (GitHub Pages). Los manuales
// se cargan desde aquí, en vez de con una ruta relativa ("manuals/archivo.html"),
// para que abran correctamente sin importar cómo se haya abierto app.html —
// desde la URL real, desde una copia compartida por WhatsApp/correo, desde un
// ZIP descomprimido, etc. Una ruta relativa solo funciona cuando el navegador
// puede ver la carpeta "manuals/" junto al archivo, lo cual falla en copias
// locales (p.ej. content://... en Android). Actualizar si el sitio se muda.
const APP_BASE_URL = 'https://letbepv.github.io/plataformapostventa/';
function openHelpModal(){
  const manual = currentHelpManual();
  const manualUrl = `${APP_BASE_URL}manuals/${manual.file}`;
  const wrap = document.getElementById('help-modal-wrap');
  if(!wrap) return;
  wrap.innerHTML = `
  <div class="help-modal-overlay" id="help-modal-overlay">
    <div class="help-modal">
      <div class="help-modal-bar">
        <b>Manual de usuario — ${esc(manual.label)}</b>
        <a href="${manualUrl}" target="_blank" rel="noopener">Abrir en pestaña nueva ↗</a>
        <button class="help-modal-close" id="help-modal-close" type="button" aria-label="Cerrar">✕</button>
      </div>
      <div class="help-modal-fallback" id="help-modal-fallback">
        ¿No ves el manual aquí abajo? Tu navegador puede estar bloqueando el contenido incrustado —
        <a href="${manualUrl}" target="_blank" rel="noopener"><b>ábrelo directo en una pestaña nueva ↗</b></a>
      </div>
      <iframe id="help-modal-iframe" src="${manualUrl}" title="Manual de usuario — ${esc(manual.label)}"></iframe>
    </div>
  </div>`;
  document.getElementById('help-modal-close').addEventListener('click', closeHelpModal);
  document.getElementById('help-modal-overlay').addEventListener('click', (e)=>{
    if(e.target.id === 'help-modal-overlay') closeHelpModal();
  });
  document.addEventListener('keydown', helpModalEscHandler);
  // Si el iframe no termina de cargar en un par de segundos (bloqueo del
  // navegador, restricciones de seguridad en archivos locales, etc.), se
  // resalta el aviso de "abrir en pestaña nueva" para que no pase inadvertido.
  const fallback = document.getElementById('help-modal-fallback');
  const iframeEl = document.getElementById('help-modal-iframe');
  let loaded = false;
  if(iframeEl) iframeEl.addEventListener('load', ()=>{ loaded = true; });
  setTimeout(()=>{
    if(!loaded && fallback) fallback.classList.add('help-modal-fallback-alert');
  }, 1800);
}
(function bindHelpFab(){
  const fab = document.getElementById('help-fab');
  if(fab) fab.addEventListener('click', openHelpModal);
})();

// Calcula la posición vertical del botón flotante "Ayuda" para que quede
// siempre justo debajo del header (nunca encimado con el menú de navegación),
// tanto en la app directa como incrustada (?embed=1) y en cualquier ancho de
// pantalla. Se recalcula al cargar, al cambiar el tamaño de la ventana y al
// abrir/cerrar el menú móvil (por si el navegador reflowea el header).
(function positionHelpFab(){
  function update(){
    const header = document.querySelector('header');
    if(!header) return;
    const h = header.getBoundingClientRect().height;
    document.documentElement.style.setProperty('--help-fab-top', (h + 12) + 'px');
  }
  update();
  window.addEventListener('resize', update);
  window.addEventListener('load', update);
  const navToggle = document.getElementById('nav-toggle');
  if(navToggle) navToggle.addEventListener('click', ()=> setTimeout(update, 0));
})();

render();

        </div>`;
    }

    document.getElementById('mode-banner').innerHTML = `

        <b>⚠ Sin conexión a la base de datos</b>

      </div>`;

})();
