<style>
  :root{
    --bg:#F6F7F9;
    --surface:#FFFFFF;
    --surface-2:#F1F2F5;
    --surface-3:#E7E9ED;
    --red:#E1121B;
    --red-dim:#8C0B12;
    --yellow:#FFC800;
    --yellow-ink:#9C6B0A;
    --text:#191B23;
    --text-muted:#5B6472;
    --text-faint:#98A0AC;
    --border:#E2E5EA;
    --success:#35C46D;
    --danger:#FF5A5F;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Archivo Black',sans-serif;}

  /* ---------- Header (siempre oscuro, igual que el sitio oficial) ---------- */
  header{
    position:sticky; top:0; z-index:40;
    background:rgba(14,15,19,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    --bg:#0E0F13;
    --surface:#17181F;
    --surface-2:#1F212B;
    --surface-3:#282A36;
    --text:#F5F5F7;
    --text-muted:#8D93A3;
    --text-faint:#5A5E6C;
    --border:#2A2C38;
  }
  html, body{ overflow-x:hidden; max-width:100%; }
  .header-inner{
    max-width:1180px; margin:0 auto; padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .logo{display:flex; align-items:center; gap:12px; user-select:none; flex:0 0 auto;}
  .logo-chip{
    display:flex; align-items:center; line-height:0;
  }
  .logo img{height:24px; width:auto; display:block;}
  .logo-divider{width:1px; height:26px; background:var(--border);}
  .logo-text{
    font-family:'Inter',sans-serif; font-weight:700;
    font-size:10.5px; letter-spacing:2.2px; color:var(--text-muted); line-height:1.3;
  }
  .logo-text b{display:block; color:var(--yellow-ink); font-weight:800; letter-spacing:2.2px;}
  nav{
    display:flex; gap:6px; background:var(--surface); padding:5px; border-radius:12px; border:1px solid var(--border);
    min-width:0; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  nav::-webkit-scrollbar{ display:none; }
  nav button{
    border:none; background:transparent; color:var(--text-muted);
    font-family:'Inter',sans-serif; font-weight:800; font-size:13.5px;
    padding:10px 16px; border-radius:9px; cursor:pointer; letter-spacing:0.3px;
    transition:all .15s ease; white-space:nowrap; flex:0 0 auto;
  }
  nav button:hover{color:var(--text);}
  nav button.active{background:var(--yellow); color:#141414; box-shadow:0 2px 10px rgba(255,199,44,0.4);}

  /* ---------- Accesos "internos" (Socios comerciales, Panel admin) -----------
     Se muestran más pequeños y discretos que los accesos de cliente
     (Activa tu garantía, Bitácora digital, Refacciones), que son los que
     debe usar la mayoría de la gente que llega al sitio. Un separador
     sutil marca la transición entre ambos grupos. ---------- */
  nav button.nav-secondary{
    font-weight:600; font-size:11px; padding:7px 11px; color:var(--text-faint);
    margin-left:2px;
  }
  nav button.nav-secondary:first-of-type{
    margin-left:10px; position:relative;
  }
  nav button.nav-secondary:first-of-type::before{
    content:''; position:absolute; left:-6px; top:50%; transform:translateY(-50%);
    width:1px; height:18px; background:var(--border);
  }
  nav button.nav-secondary:hover{color:var(--text-muted);}
  nav button.nav-secondary.active{background:var(--surface-3); color:var(--text); box-shadow:none;}

  /* ---------- Menú desplegable de navegación (solo móvil) ----------
     En pantallas angostas el <nav> original (scroll horizontal) se
     oculta y se sustituye por un botón "Menú" que abre una lista
     vertical con todas las opciones, para que sean visibles de
     inmediato en vez de requerir deslizar hacia la derecha. ---------- */
  .nav-toggle{ display:none; }

  @media(max-width:600px){
    .logo-text{ display:none; }
    .logo-divider{ display:none; }
    .header-inner{ padding:12px 14px; gap:10px; position:relative; }
    nav button{ padding:9px 11px; font-size:12px; }

    .nav-toggle{
      display:flex; align-items:center; gap:8px; background:var(--surface);
      color:var(--text); border:1px solid var(--border); border-radius:10px;
      padding:9px 12px; font-family:'Inter',sans-serif; font-weight:700;
      font-size:12.5px; letter-spacing:0.3px; cursor:pointer; white-space:nowrap;
    }
    .nav-toggle .nav-toggle-chev{ font-size:9px; transition:transform .15s ease; color:var(--text-faint); }
    .nav-toggle.open .nav-toggle-chev{ transform:rotate(180deg); }

    nav#nav{
      display:none; position:absolute; top:100%; left:0; right:0; margin-top:8px;
      flex-direction:column; align-items:stretch; gap:3px;
      background:var(--surface); border:1px solid var(--border); border-radius:12px;
      padding:6px; overflow:visible; max-height:70vh; overflow-y:auto;
      box-shadow:0 16px 32px rgba(0,0,0,0.35); z-index:5;
    }
    nav#nav.open{ display:flex; }
    nav#nav button{ width:100%; text-align:left; padding:12px 14px; font-size:13.5px; }
    nav#nav button.nav-secondary{
      font-size:12px; padding:10px 14px; margin-left:0;
    }
    nav#nav button.nav-secondary:first-of-type{
      margin-left:0; margin-top:6px; padding-top:14px;
    }
    nav#nav button.nav-secondary:first-of-type::before{
      left:14px; right:14px; top:0; width:auto; height:1px; transform:none;
    }
  }

  /* ---------- Modo incrustado (?embed=1): oculta el logo/branding propio,
     que sería redundante dentro de un iframe en el sitio oficial de Letbe.
     El menú de navegación (nav) se conserva siempre, es indispensable para
     moverse entre secciones dentro del iframe. ---------- */
  html.embed-mode header{ position:static; }
  html.embed-mode .logo{ display:none; }
  html.embed-mode .header-inner{ justify-content:center; padding:10px 14px; }

  main{max-width:1180px; margin:0 auto; padding:36px 24px 80px;}

  /* ---------- Generic UI ---------- */
  .eyebrow{
    font-size:11px; font-weight:800; letter-spacing:2.5px; color:var(--yellow-ink);
    text-transform:uppercase; margin:0 0 8px;
  }
  h1.page-title{
    font-family:'Archivo Black',sans-serif; font-size:32px; margin:0 0 6px;
    letter-spacing:0.3px;
  }
  .page-sub{color:var(--text-muted); font-size:14.5px; margin:0 0 28px; max-width:560px; line-height:1.5;}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:24px;
  }
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;}
  .grid4{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:16px;}
  @media(max-width:720px){.grid2,.grid3,.grid4{grid-template-columns:1fr;}}

  label{display:block; font-size:12px; font-weight:700; color:var(--text-muted); margin:0 0 6px; letter-spacing:0.3px;}
  .field{margin-bottom:16px;}
  input,select,textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:11px 13px; border-radius:9px; font-family:'Inter',sans-serif; font-size:14px;
    outline:none; transition:border-color .15s ease;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--yellow);}
  input::placeholder{color:var(--text-faint);}
  textarea{resize:vertical; min-height:64px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:10px; padding:12px 22px; font-weight:800; font-size:13.5px;
    letter-spacing:0.3px; cursor:pointer; transition:transform .1s ease, box-shadow .15s ease;
    font-family:'Inter',sans-serif;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--yellow); color:#141414; box-shadow:0 4px 16px rgba(255,199,44,0.35);}
  .btn-primary:hover{box-shadow:0 6px 20px rgba(255,199,44,0.5);}
  .btn-ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--text-faint);}
  .btn-yellow{background:var(--yellow); color:#141414;}
  .btn-sm{padding:8px 14px; font-size:12px; border-radius:8px;}
  .btn-block{width:100%;}

  .badge{
    display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:100px;
    font-size:11px; font-weight:800; letter-spacing:0.4px;
  }
  .badge-success{background:rgba(53,196,109,0.15); color:var(--success);}
  .badge-pending{background:rgba(91,100,114,0.13); color:var(--text-muted);}
  .badge-yellow{background:rgba(255,199,44,0.15); color:var(--yellow-ink);}
  .badge-danger{background:rgba(255,90,95,0.15); color:var(--danger);}

  .divider{height:1px; background:var(--border); margin:24px 0;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--surface-3); border:1px solid var(--border); color:var(--text);
    padding:13px 20px; border-radius:10px; font-size:13.5px; font-weight:600;
    box-shadow:0 10px 30px rgba(20,20,30,0.18); opacity:0; pointer-events:none;
    transition:all .25s ease; z-index:100; display:flex; align-items:center; gap:10px;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.err{border-color:var(--danger);}
  .toast.ok{border-color:var(--success);}

  .pedido-float{
    position:fixed; bottom:24px; right:24px; z-index:90;
    background:var(--yellow); color:#141414; border:none; border-radius:100px;
    padding:14px 22px; font-family:'Inter',sans-serif; font-weight:800; font-size:13.5px;
    box-shadow:0 8px 24px rgba(255,199,44,0.45); cursor:pointer;
    display:flex; align-items:center; gap:10px;
  }
  .pedido-float .pedido-float-count{
    background:#141414; color:var(--yellow); border-radius:100px; padding:2px 9px; font-size:12px;
  }

  /* ---------- Ayuda: botón flotante + modal con el manual de usuario ----------
     Se posiciona arriba a la derecha (en vez de abajo a la izquierda) porque al
     incrustarse en la página oficial de Letbe la parte inferior puede quedar
     fuera del área visible del iframe. El "top" real se calcula por JS (ver
     positionHelpFab más abajo) para quedar siempre justo debajo del header y
     nunca encimarse con el menú de navegación; --help-fab-top es el valor de
     respaldo mientras carga o si JS no puede medir el header. ---------- */
  .help-fab{
    position:fixed; top:var(--help-fab-top, 88px); right:16px; z-index:90;
    background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:100px;
    padding:12px 18px 12px 14px; font-family:'Inter',sans-serif; font-weight:800; font-size:13px;
    box-shadow:0 8px 24px rgba(20,20,30,0.25); cursor:pointer;
    display:flex; align-items:center; gap:9px;
  }
  .help-fab:hover{border-color:var(--yellow);}
  .help-fab .help-fab-icon{
    width:22px; height:22px; border-radius:50%; background:var(--yellow); color:#141414;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; flex:none;
  }
  .help-modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:300; padding:20px;
  }
  .help-modal{
    background:#fff; border-radius:16px; width:100%; max-width:920px; height:88vh;
    display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }
  .help-modal-bar{
    display:flex; align-items:center; gap:12px; padding:12px 16px; background:#15161c; color:#fff;
    border-bottom:3px solid var(--yellow); flex:none;
  }
  .help-modal-bar b{font-size:13.5px; font-weight:800;}
  .help-modal-bar a{color:#d8dbe2; font-size:12px; text-decoration:none; margin-left:auto;}
  .help-modal-bar a:hover{color:var(--yellow); text-decoration:underline;}
  .help-modal-close{
    background:none; border:none; color:#fff; font-size:20px; line-height:1; cursor:pointer;
    padding:2px 6px; border-radius:6px;
  }
  .help-modal-close:hover{background:rgba(255,255,255,0.12);}
  .help-modal-fallback{
    flex:none; padding:9px 16px; font-size:12px; color:var(--muted, #5B6472); background:#FAFAFB;
    border-bottom:1px solid #E2E5EA; text-align:center;
  }
  .help-modal-fallback a{color:#141414; text-decoration:underline;}
  .help-modal-fallback-alert{background:#FFF6DE; color:#7A4E10; font-weight:600;}
  .help-modal-fallback-alert a{color:#7A4E10;}
  .help-modal iframe{flex:1; width:100%; border:none; background:#fff;}
  @media(max-width:640px){
    .help-fab span{display:none;}
    .help-fab{padding:12px; border-radius:50%;}
    .help-modal{height:94vh; border-radius:12px;}
  }

  /* ---------- Hero / lookup ---------- */
  .hero{
    display:grid; grid-template-columns:1.1fr 0.9fr; gap:28px; align-items:stretch; margin-bottom:40px;
  }
  @media(max-width:900px){.hero{grid-template-columns:1fr;}}
  .hero-card{
    border-radius:20px; padding:32px; position:relative; overflow:hidden;
    background:var(--surface);
    border:1px solid var(--border);
    box-shadow:0 4px 24px rgba(20,20,30,0.06);
  }
  .hero-card::after{
    content:""; position:absolute; right:-60px; top:-60px; width:260px; height:260px;
    background:radial-gradient(circle, rgba(255,199,44,0.25), transparent 70%);
  }
  .hero-card h2{font-family:'Archivo Black',sans-serif; font-size:26px; margin:0 0 10px; line-height:1.15;}
  .hero-card p{color:var(--text-muted); font-size:14px; line-height:1.6; margin:0 0 20px; max-width:420px;}

  /* ---------- Odometer gauge (signature element) ---------- */
  .gauge-wrap{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;}
  .gauge-label{font-size:11px; font-weight:800; letter-spacing:2px; color:var(--text-muted); text-transform:uppercase;}
  .gauge-value{font-family:'Archivo Black',sans-serif; font-size:15px; margin-top:-84px;}
  .gauge-tier{font-family:'Inter',sans-serif; font-weight:800; font-size:12px; margin-top:2px; letter-spacing:0.5px;}

  /* ---------- Tables / lists ---------- */
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; color:var(--text-muted); font-size:11px; letter-spacing:0.6px; text-transform:uppercase;
     padding:10px 12px; border-bottom:1px solid var(--border); font-weight:800;}
  td{padding:12px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(20,20,30,0.025);}

  .service-row{
    display:grid; grid-template-columns:56px 1fr auto; gap:16px; align-items:center;
    padding:16px; border-radius:12px; border:1px solid var(--border); background:var(--surface-2);
    margin-bottom:10px;
  }
  .service-num{
    width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-family:'Archivo Black',sans-serif; font-size:16px; background:var(--surface-3); color:var(--text-muted);
  }
  .service-row.done .service-num{background:rgba(53,196,109,0.15); color:var(--success);}
  .service-row.overdue{border-color:var(--danger); background:rgba(255,90,95,0.05);}
  .service-row.overdue .service-num{background:rgba(255,90,95,0.15); color:var(--danger);}
  .service-row.soon{border-color:var(--yellow); background:rgba(255,199,44,0.05);}
  .service-row.soon .service-num{background:rgba(255,199,44,0.15); color:var(--yellow-ink);}
  .service-title{font-weight:700; font-size:14px;}
  .service-meta{color:var(--text-muted); font-size:12.5px; margin-top:2px;}
  .service-detail{color:var(--text-faint); font-size:12px; margin-top:4px;}

  .empty{
    text-align:center; padding:50px 20px; color:var(--text-muted);
  }
  .empty .display{font-size:15px; color:var(--text); margin-bottom:6px;}

  .id-pill{
    font-family:'JetBrains Mono',monospace; font-weight:700; background:var(--surface-3);
    padding:5px 10px; border-radius:7px; font-size:12.5px; letter-spacing:0.5px; color:var(--yellow-ink);
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;
  }
  .modal{
    background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px;
    max-width:440px; width:100%;
  }

  .tier-strip{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
  .tier-detail-card{
    border-radius:12px; border:1px solid var(--border); background:var(--surface-2);
    padding:16px; margin-bottom:10px; position:relative; overflow:hidden;
  }
  .tier-detail-card.active{border-color:var(--tier-color, var(--yellow)); background:linear-gradient(135deg, color-mix(in srgb, var(--tier-color, var(--yellow)) 10%, var(--surface-2)), var(--surface-2));}
  .tier-detail-card.reached{opacity:0.75;}
  .tier-detail-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px;}
  .tier-detail-name{display:flex; align-items:center; gap:8px; font-weight:800; font-size:14px;}
  .tier-detail-dot{width:10px; height:10px; border-radius:50%; background:var(--tier-color, var(--text-faint));}
  .tier-detail-req{font-size:11px; color:var(--text-faint); font-weight:700; letter-spacing:0.3px;}
  .tier-detail-benefit{font-size:12.5px; color:var(--text-muted); line-height:1.55;}
  .tier-clause{
    margin-top:16px; padding:12px 14px; border-radius:10px; background:rgba(255,199,44,0.07);
    border:1px solid var(--border); font-size:11.5px; color:var(--text-muted); line-height:1.6;
  }
  .tier-chip{
    padding:6px 12px; border-radius:100px; font-size:11px; font-weight:800; border:1px solid var(--border);
    color:var(--text-faint);
  }
  .tier-chip.active{border-color:var(--yellow); color:var(--yellow-ink); background:rgba(255,199,44,0.08);}

  .alert-section{margin-bottom:28px;}
  .alert-item{
    display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
    padding:14px 16px; border-radius:12px; border:1px solid var(--border); background:var(--surface-2);
    margin-bottom:9px;
  }
  .alert-item.overdue{border-color:rgba(255,90,95,0.5);}
  .alert-item.soon{border-color:rgba(255,199,44,0.5);}
  .alert-info b{font-size:13.5px;}
  .alert-info .meta{color:var(--text-muted); font-size:12px; margin-top:2px;}
  .alert-actions{display:flex; gap:8px; align-items:center;}
  .alert-actions a{color:var(--text); text-decoration:none;}
  .alert-tabs{display:flex; gap:8px; margin-bottom:14px;}
  .alert-tab{
    padding:7px 14px; border-radius:100px; font-size:12px; font-weight:800; cursor:pointer;
    border:1px solid var(--border); color:var(--text-muted); background:transparent;
  }
  .alert-tab.active{background:var(--surface-3); color:var(--text); border-color:var(--text-faint);}

  .footer-note{color:var(--text-faint); font-size:11.5px; text-align:center; margin-top:50px; line-height:1.6;}
  .claim-note{
    margin-top:12px; padding:12px 14px; border-radius:10px;
    background:rgba(255,199,44,0.08); border:1px solid rgba(255,199,44,0.35);
    font-size:12.5px; color:var(--text);
  }
  .claim-note b{display:block; color:var(--yellow-ink); font-size:12px; margin-bottom:4px;}
  .mode-banner{
    position:fixed; bottom:16px; right:16px; z-index:90; max-width:300px;
    background:var(--surface-3); border:1px solid var(--yellow); border-radius:12px;
    padding:12px 14px; font-size:11.5px; color:var(--text-muted); line-height:1.5;
    box-shadow:0 8px 24px rgba(20,20,30,0.15);
  }
  .mode-banner b{color:var(--yellow-ink); display:block; font-size:11.5px; margin-bottom:3px;}
  ::selection{background:var(--yellow); color:#141414;}
  input[type=date]{color-scheme:light;}

  /* ---------- Etiquetas tipo "pill" para selects (estilo buscador del sitio oficial) ---------- */
  .field:has(> select) > label,
  label:has(+ select){
    display:inline-flex; align-items:center; width:auto;
    background:var(--yellow); color:#141414;
    padding:6px 14px; border-radius:100px;
    font-size:11px; font-weight:800; letter-spacing:0.4px; text-transform:uppercase;
    margin:0 0 8px;
  }
</style>

  // Modo incrustado: si la página se abre como https://.../letbe-servicio.html?embed=1

  (function(){

function openPolizaGarantia(){
  const blob = (() => {
    const byteChars = atob(POLIZA_GARANTIA_PDF.split(',')[1]);
    const byteNumbers = new Array(byteChars.length);
    for(let i=0;i<byteChars.length;i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const byteArray = new Uint8Array(byteNumbers);
    return new Blob([byteArray], { type: 'application/pdf' });
  })();
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}

function tierFor(count){
  let current = null;
  for(const t of TIERS){ if(count >= t.min) current = t; }
  return current;
}
function nextTier(count){
  return TIERS.find(t => count < t.min) || null;
}

/* ---- Alertas de vencimiento (basadas en tiempo desde la fecha de compra) ---- */
const ALERT_WINDOW_DAYS = 30; // ventana para marcar "próximo a vencer"

function addMonths(dateStr, months){
  const d = new Date(dateStr + 'T00:00:00');
  d.setMonth(d.getMonth() + months);
  return d;
}
function daysDiff(dateObj){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateObj); d.setHours(0,0,0,0);
  return Math.round((d - today) / (1000*60*60*24));
}
// Returns {status: 'done'|'overdue'|'soon'|'pending', diff, due}
function computeServiceStatus(service, purchaseDate){
  if(service.done) return {status:'done', diff:null, due:null};
  if(!purchaseDate) return {status:'pending', diff:null, due:null};
  const due = addMonths(purchaseDate, service.months);
  const diff = daysDiff(due);
  if(diff < 0) return {status:'overdue', diff, due};
  if(diff <= ALERT_WINDOW_DAYS) return {status:'soon', diff, due};
  return {status:'pending', diff, due};
}

// Nombre exacto del distribuidor al que aplica el caso especial de arriba
// (tal como aparece en DISTRIBUIDOR_NOMBRES / el registro del distribuidor).
const DISTRIBUIDOR_ACTIVACION_ESPECIAL = 'Letbe Periférico';
// Compara nombres de distribuidor ignorando acentos, mayúsculas y espacios
// sobrantes, para que no falle por una tilde mal colocada al capturar el dato.
function mismoNombreDistribuidor(a, b){
  const norm = s => String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  return norm(a) === norm(b);
}

// Envío genérico vía API REST de EmailJS. Devuelve true/false según el resultado
// y nunca lanza excepción hacia quien lo llama (no debe romper el flujo principal).
async function sendEmailJS(templateId, templateParams){
  try{
    const res = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        service_id: EMAILJS_SERVICE_ID,
        template_id: templateId,
        user_id: EMAILJS_PUBLIC_KEY,
        template_params: templateParams,
      }),
    });
    const text = await res.text().catch(()=>'');
    if(!res.ok){
      console.error('EmailJS respondió con error:', res.status, text);
      return false;
    }
    console.log('EmailJS envío OK:', res.status, text);
    return true;
  }catch(err){
    console.error('Error de red al enviar por EmailJS:', err);
    return false;
  }
}

// Aviso al departamento de refacciones cuando el admin autoriza una garantía
// de taller, con el detalle de las piezas marcadas como autorizadas.
async function notifyRefaccionesAutorizadas(g){
  if(!EMAILJS_TEMPLATE_ID_REFACCIONES){
    console.warn('EMAILJS_TEMPLATE_ID_REFACCIONES no configurado; no se envió el correo a refacciones.');
    return false;
  }
  const autorizadas = (g.refacciones || []).filter(r => r.decision === 'autorizada');
  const rechazadas = (g.refacciones || []).filter(r => r.decision === 'rechazada');
  const listaAutorizadas = autorizadas.length
    ? autorizadas.map(r => `- ${r.numero_parte || 's/n'} · ${r.nombre || ''} · Cant. ${r.cantidad}`).join('\n')
    : 'Sin refacciones autorizadas.';
  const listaRechazadas = rechazadas.length
    ? rechazadas.map(r => `- ${r.numero_parte || 's/n'} · ${r.nombre || ''} · Cant. ${r.cantidad}`).join('\n')
    : '';
  const ok = await sendEmailJS(EMAILJS_TEMPLATE_ID_REFACCIONES, {
    tipo_evento: 'Garantía autorizada — envío de refacciones',
    nombre_cliente: g.cliente_nombre || '',
    codigo_cliente: g.customer_id || '',
    modelo_moto: g.moto_modelo || '',
    telefono_cliente: g.cliente_telefono || '',
    detalle: `N° de garantía: ${g.id}\nTaller: ${g.taller_nombre} (${g.taller_id})\nVIN: ${g.moto_serial}\n\nRefacciones autorizadas:\n${listaAutorizadas}${listaRechazadas ? `\n\nRefacciones rechazadas:\n${listaRechazadas}` : ''}`,
    fecha_evento: new Date().toLocaleString('es-MX'),
  });
  if(ok) logEmailSent('Refacciones autorizadas');
  return ok;
}

// Aviso a Postventa cuando un Distribuidor o una tienda Retail levanta una
// solicitud de activación o un reporte de falla/garantía — desglosa la
// motocicleta, la tienda de origen, el vendedor que solicita, su número de
// contacto y (solo para activaciones) la fecha máxima de activación.
async function notifySolicitudSocio(s, origen){
  const esActivacion = s.tipo === 'activacion';
  // Caso especial: activación solicitada por el distribuidor "Letbe Periférico"
  // se enruta a un template distinto (jefetaller/servicio en vez de Postventa
  // como principal); si aún no está configurado, cae de regreso al general.
  const esActivacionPeriferico = esActivacion
    && s.origen_tipo === 'distribuidor'
    && mismoNombreDistribuidor(s.origen_nombre, DISTRIBUIDOR_ACTIVACION_ESPECIAL);
  const templateId = (esActivacionPeriferico && EMAILJS_TEMPLATE_ID_ACTIVACION_PERIFERICO)
    ? EMAILJS_TEMPLATE_ID_ACTIVACION_PERIFERICO
    : EMAILJS_TEMPLATE_ID_SOLICITUD_SOCIO;
  if(!templateId){
    console.warn('Ningún template de EmailJS configurado; no se envió el correo de la solicitud.');
    return false;
  }
  const tipoLegible = esActivacion ? 'Solicitud de activación' : 'Reporte de falla / garantía';
  const origenLegible = s.origen_tipo === 'distribuidor' ? 'Distribuidor' : 'Tienda retail';
  const cadenaLinea = (s.origen_tipo === 'retail' && origen && origen.cadena_nombre) ? `\nCadena: ${origen.cadena_nombre}` : '';
  const motoLineas = [
    `Modelo: ${s.moto_modelo || ''}`,
    esActivacion ? `Año: ${s.moto_anio || ''}` : null,
    `N° de serie (VIN): ${s.moto_serie || ''}`,
  ].filter(Boolean).join('\n');
  const bloques = [
    `Folio: ${s.id}`,
    `${origenLegible}: ${s.origen_nombre} (${s.origen_id})${cadenaLinea}`,
    `Vendedor que solicita: ${s.vendedor || ''}\nNúmero de contacto: ${s.contacto || ''}`,
    motoLineas,
    esActivacion
      ? `Fecha máxima para la activación: ${fmtDate(s.fecha_entrega)}`
      : `Fecha máxima para la activación: No aplica (reporte de falla/garantía)`,
  ];
  if(!esActivacion && s.descripcion){
    bloques.push(`Descripción de la falla/daño:\n${s.descripcion}`);
  }
  const detalle = bloques.join('\n\n');
  const ok = await sendEmailJS(templateId, {
    tipo_evento: `${tipoLegible} — ${s.origen_nombre}`,
    nombre_cliente: s.origen_nombre || '',
    codigo_cliente: s.id || '',
    modelo_moto: s.moto_modelo || '',
    telefono_cliente: s.contacto || '',
    detalle,
    fecha_evento: new Date().toLocaleString('es-MX'),
  });
  if(ok) logEmailSent(tipoLegible + ' (socio comercial)');
  return ok;
}

/* ---- Subida de archivos (fotos, comprobantes) a Supabase Storage ---- */
const STORAGE_BUCKET = 'letbe-files';

async function uploadFile(file, pathPrefix){
  if(!file) return '';
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
  const path = `${pathPrefix}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${path}`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': file.type || 'application/octet-stream',
    },
    body: file,
  });
  if(!res.ok){
    const t = await res.text().catch(()=>'');
    throw new Error('Error subiendo archivo: ' + t);
  }
  return `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${path}`;
}

// Parsea un catálogo de refacciones (varias hojas F1, F2, ... por subsistema,
// con encabezado SN / PART CODE / CHINESE NAME / ENGLISH NAME / QTY / REMARK)
// y regresa un arreglo de {numero_parte, nombre}.
const IVA_RATE = 0.16;
function conIva(sinIva){
  return (sinIva === null || sinIva === undefined || sinIva === '') ? null : Number(sinIva) * (1 + IVA_RATE);
}
function calcUtilidad(precioPublicoSinIva, precioTallerSinIva){
  if(precioPublicoSinIva == null || precioTallerSinIva == null) return null;
  return Number(precioPublicoSinIva) - Number(precioTallerSinIva);
}
function calcPctUtilidad(precioPublicoSinIva, precioTallerSinIva){
  const u = calcUtilidad(precioPublicoSinIva, precioTallerSinIva);
  if(u == null || !precioTallerSinIva) return null;
  return (u / Number(precioTallerSinIva)) * 100;
}
function fmtMoneyOrDash(v){
  return (v === null || v === undefined || v === '') ? '—' : fmtMoney(v);
}
function fmtPctOrDash(v){
  return (v === null || v === undefined) ? '—' : `${v.toFixed(1)}%`;
}

function parseCatalogoWorkbook(wb){
  const items = [];
  const porSeccion = {};
  wb.SheetNames.forEach(sheetName=>{
    if(/^indice$/i.test(sheetName.trim())) return;
    const sheet = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:null });
    const partesDeSeccion = [];
    rows.forEach(row=>{
      const sn = row[0];
      const partCode = row[1];
      const isDataRow = (typeof sn === 'number' || (typeof sn === 'string' && /^\d+$/.test(sn.trim())))
        && partCode && typeof partCode === 'string' && partCode.trim().length > 2;
      if(isDataRow){
        // El nombre puede venir en distinta columna según la versión del catálogo
        // (con chino+inglés, o solo español). Tomamos la última celda de texto de
        // la fila (después del número de parte) — ahí siempre queda el nombre,
        // sin depender de una posición fija de columna.
        let nombre = '';
        for(let ci = 2; ci < row.length; ci++){
          const cell = row[ci];
          if(typeof cell === 'string' && cell.trim().length > 0) nombre = cell.trim();
        }
        const numeroParte = partCode.trim().toUpperCase();
        const numeroDiagrama = sn.toString().trim(); // mismo número que aparece junto a la pieza en el diagrama
        items.push({ numero_parte: numeroParte, nombre });
        partesDeSeccion.push({ numero_parte: numeroParte, numero_diagrama: numeroDiagrama });
      }
    });
    if(partesDeSeccion.length) porSeccion[sheetName] = partesDeSeccion;
  });
  return { items, porSeccion };
}

/* ---- Extracción de diagramas incrustados e índice de secciones ---- */
function normalizeCode(suffix){
  return suffix.split('-').map(s => s.replace(/^0+/, '') || '0').join('-');
}
function parseIndiceEntries(wb){
  const indiceSheetName = wb.SheetNames.find(n => /^indice$/i.test(n.trim()));
  const entries = [];
  if(!indiceSheetName) return entries;
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[indiceSheetName], { header:1, defval:null });
  rows.forEach(row=>{
    (row||[]).forEach(cell=>{
      if(typeof cell === 'string'){
        const m = cell.trim().match(/^F-?([\d-]+)\s+(.+)$/i);
        if(m){
          const nombreLimpio = m[2].replace(/[^\x00-\x7F]+/g, ' ').replace(/\s+/g,' ').trim();
          entries.push({ suffix: normalizeCode(m[1]), nombre: nombreLimpio || m[2].trim() });
        }
      }
    });
  });
  return entries;
}
function findNombreForSheet(sheetName, indiceEntries){
  const m = sheetName.trim().match(/^F-?([\d-]+)$/i);
  if(!m) return sheetName;
  const norm = normalizeCode(m[1]);
  const found = indiceEntries.find(e => e.suffix === norm);
  return found ? found.nombre : sheetName;
}

// Extrae el diagrama incrustado de cada hoja de sección (usa la estructura ZIP
// del propio .xlsx, ya que SheetJS no expone imágenes incrustadas).
async function extractCatalogImages(arrayBuffer, sheetNames){
  const results = {};
  try{
    const zip = await JSZip.loadAsync(arrayBuffer);
    const wbXmlFile = zip.file('xl/workbook.xml');
    const relsFile = zip.file('xl/_rels/workbook.xml.rels');
    if(!wbXmlFile || !relsFile) return results;
    const wbXml = await wbXmlFile.async('string');
    const relsXml = await relsFile.async('string');
    const relMap = {};
    [...relsXml.matchAll(/<Relationship Id="(rId\d+)"[^>]*Target="([^"]+)"/g)].forEach(m => relMap[m[1]] = m[2]);
    const sheetMatches = [...wbXml.matchAll(/<sheet[^>]*name="([^"]+)"[^>]*r:id="(rId\d+)"/g)];

    for(const m of sheetMatches){
      const sheetName = m[1];
      if(!sheetNames.includes(sheetName)) continue;
      const rid = m[2];
      const target = relMap[rid];
      if(!target) continue;
      const sheetFileName = target.split('/').pop();
      const sheetRelsFile = zip.file(`xl/worksheets/_rels/${sheetFileName}.rels`);
      if(!sheetRelsFile) continue;
      const sheetRelsXml = await sheetRelsFile.async('string');
      const drawingMatch = sheetRelsXml.match(/<Relationship[^>]*Type="[^"]*\/drawing"[^>]*Target="([^"]+)"/);
      if(!drawingMatch) continue;
      const drawingFileName = drawingMatch[1].split('/').pop();
      const drawingRelsFile = zip.file(`xl/drawings/_rels/${drawingFileName}.rels`);
      if(!drawingRelsFile) continue;
      const drawingRelsXml = await drawingRelsFile.async('string');
      const imageMatch = drawingRelsXml.match(/<Relationship[^>]*Type="[^"]*\/image"[^>]*Target="([^"]+)"/);
      if(!imageMatch) continue;
      const imageFileName = imageMatch[1].split('/').pop();
      const imageFile = zip.file(`xl/media/${imageFileName}`);
      if(!imageFile) continue;
      const blob = await imageFile.async('blob');
      results[sheetName] = { blob, ext: (imageFileName.split('.').pop() || 'png').toLowerCase() };
    }
  }catch(e){
    console.error('Error extrayendo imágenes del catálogo:', e);
  }
  return results;
}

function horasRestantes(fechaLimite){
  if(!fechaLimite) return null;
  const diffMs = new Date(fechaLimite).getTime() - Date.now();
  return diffMs / (60*60*1000);
}
function countdownBadge(fechaLimite){
  const h = horasRestantes(fechaLimite);
  if(h === null) return '';
  if(h < 0) return `<span class="badge badge-danger">Vencida hace ${Math.abs(h).toFixed(0)}h</span>`;
  if(h < 24) return `<span class="badge badge-danger">${h.toFixed(0)}h restantes</span>`;
  if(h < 48) return `<span class="badge badge-yellow">${h.toFixed(0)}h restantes</span>`;
  return `<span class="badge badge-success">${h.toFixed(0)}h restantes</span>`;
}

// Ejemplos de audio SINTETIZADOS (no son grabaciones reales) para ayudar al
// cliente a identificar el tipo de ruido durante la entrevista técnica.
function playNoiseExample(kind){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    if(kind === 'Rechinido'){
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(3200, now);
      osc.frequency.linearRampToValueAtTime(3800, now+0.6);
      gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now+1.1);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now+1.1);
    }else if(kind === 'Golpeteo'){
      for(let i=0;i<4;i++){
        const t0 = now + i*0.28;
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'square'; osc.frequency.setValueAtTime(110, t0);
        gain.gain.setValueAtTime(0.25, t0); gain.gain.exponentialRampToValueAtTime(0.001, t0+0.12);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t0); osc.stop(t0+0.12);
      }
    }else if(kind === 'Vibración'){
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      const lfo = ctx.createOscillator(); const lfoGain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(70, now);
      lfo.frequency.setValueAtTime(18, now); lfoGain.gain.setValueAtTime(0.08, now);
      lfo.connect(lfoGain); lfoGain.connect(gain.gain);
      gain.gain.setValueAtTime(0.18, now);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); lfo.start(now);
      osc.stop(now+1.3); lfo.stop(now+1.3);
    }
  }catch(e){ console.error('No se pudo reproducir el audio de ejemplo:', e); }
}

/* ---- Medidor visual de gasolina (tipo tablero, E a F, en octavos) ---- */
function fuelGaugeSVG(eighths, containerId){
  containerId = containerId || 'fuel-gauge-container';
  eighths = Math.max(0, Math.min(8, eighths));
  const cx=100, cy=95, r=72;
  const pt = (i, radius) => {
    const angleDeg = 180 - i*(180/8);
    const angleRad = angleDeg * Math.PI/180;
    return { x: cx + radius*Math.cos(angleRad), y: cy - radius*Math.sin(angleRad) };
  };
  const eStart = pt(0, r), fEnd = pt(8, r), curEnd = pt(eighths, r);
  const bgArc = `M ${eStart.x.toFixed(1)} ${eStart.y.toFixed(1)} A ${r} ${r} 0 0 1 ${fEnd.x.toFixed(1)} ${fEnd.y.toFixed(1)}`;
  const fillArc = eighths>0 ? `M ${eStart.x.toFixed(1)} ${eStart.y.toFixed(1)} A ${r} ${r} 0 0 1 ${curEnd.x.toFixed(1)} ${curEnd.y.toFixed(1)}` : '';
  const needleTip = pt(eighths, r-14);

  const ticks = [];
  for(let i=1; i<=8; i++){
    const p = pt(i, r);
    const filled = i <= eighths;
    ticks.push(`
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="14" fill="transparent" style="cursor:pointer;" onclick="setOrdenFuelLevel(${i}, '${containerId}')"></circle>
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="6" fill="${filled ? '#FFC800' : '#E2E5EA'}" stroke="${filled ? '#FFC800' : '#98A0AC'}" stroke-width="1.5" style="pointer-events:none;"></circle>
    `);
  }

  return `
  <svg viewBox="0 0 200 130" width="100%" style="max-width:280px; display:block; margin:0 auto;">
    <path d="${bgArc}" fill="none" stroke="#E2E5EA" stroke-width="10" stroke-linecap="round"></path>
    ${fillArc ? `<path d="${fillArc}" fill="none" stroke="#FFC800" stroke-width="10" stroke-linecap="round"></path>` : ''}
    <line x1="${cx}" y1="${cy}" x2="${needleTip.x.toFixed(1)}" y2="${needleTip.y.toFixed(1)}" stroke="#191B23" stroke-width="2.5" stroke-linecap="round" style="pointer-events:none;"></line>
    <circle cx="${cx}" cy="${cy}" r="4" fill="#191B23" style="pointer-events:none;"></circle>
    ${ticks.join('')}
    <text x="${eStart.x-4}" y="${eStart.y+16}" fill="#5B6472" font-size="11" font-weight="700" font-family="Inter">E</text>
    <text x="${fEnd.x-4}" y="${fEnd.y+16}" fill="#5B6472" font-size="11" font-weight="700" font-family="Inter">F</text>
    <text x="${cx}" y="${cy+28}" fill="#9C6B0A" font-size="14" font-weight="800" font-family="Inter" text-anchor="middle">${eighths}/8</text>
  </svg>`;
}

// Calcula el kilometraje más alto registrado para un cliente, cruzando bitácora
// (servicios cumplidos), órdenes previas (de cualquier taller) y garantías de
// taller previas. Devuelve también de dónde salió ese máximo, para mostrarlo.
async function getUltimoKmRegistrado(customerId){
  let maxKm = 0;
  let fuente = '';
  try{
    const customer = await getCustomer(customerId);
    if(customer && Array.isArray(customer.services)){
      customer.services.forEach(s=>{
        const km = Number(s.km_real);
        if(s.done && km > maxKm){ maxKm = km; fuente = `Servicio ${s.n} cumplido (bitácora${s.taller ? ', ' + s.taller : ''})`; }
      });
    }
  }catch(e){ console.error(e); }
  try{
    const rows = await sbRequest('ordenes?customer_id=eq.' + encodeURIComponent(customerId) + '&select=id,km_actual,taller_nombre', { method:'GET' });
    (rows||[]).forEach(o=>{
      const km = Number(o.km_actual);
      if(km > maxKm){ maxKm = km; fuente = `Orden ${o.id} (${o.taller_nombre || 'taller'})`; }
    });
  }catch(e){ console.error(e); }
  try{
    const rows = await sbRequest('garantias_taller?customer_id=eq.' + encodeURIComponent(customerId) + '&select=id,km_actual,taller_nombre', { method:'GET' });
    (rows||[]).forEach(g=>{
      const km = Number(g.km_actual);
      if(km > maxKm){ maxKm = km; fuente = `Garantía ${g.id} (${g.taller_nombre || 'taller'})`; }
    });
  }catch(e){ console.error(e); }
  return { km: maxKm, fuente };
}

// Revisa si un kilometraje declarado puede registrarse para este cliente, o si
// choca con el candado (menor al último registrado). Si ya existe una corrección
// AUTORIZADA que cubre este kilometraje, el candado se libera automáticamente.
async function checkKmLock(customerId, kmDeclarado){
  const km = Number(kmDeclarado);
  const ultimo = await getUltimoKmRegistrado(customerId);
  if(!ultimo.km || km >= ultimo.km) return { bloqueado:false };
  const corrections = await getCorreccionesKmForCustomer(customerId);
  const autorizada = corrections.find(c => c.status === 'autorizada' && km >= Number(c.km_declarado));
  if(autorizada) return { bloqueado:false };
  const pendiente = corrections.find(c => c.status === 'pendiente');
  return { bloqueado:true, ultimoKm: ultimo.km, fuente: ultimo.fuente, pendiente: pendiente || null };
}

async function sbRequest(path, options){
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...options,
    headers: { ...sbHeaders, ...(options && options.headers ? options.headers : {}) },
  });
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error('Supabase error ' + res.status + ': ' + errText);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// Supabase/PostgREST limita cada respuesta a un máximo de filas (por default
// suele ser 1000), aunque la tabla tenga más — hay que paginar con
// limit/offset para traer todo. Usar en listados que puedan crecer de 1000
// filas (p.ej. tiendas_retail, que ya supera esa cifra).
async function sbRequestAllPages(path){
  const pageSize = 1000;
  let offset = 0;
  let all = [];
  while(true){
    const sep = path.includes('?') ? '&' : '?';
    const page = await sbRequest(`${path}${sep}limit=${pageSize}&offset=${offset}`, { method: 'GET' });
    if(!page || !page.length) break;
    all = all.concat(page);
    if(page.length < pageSize) break;
    offset += pageSize;
  }
  return all;
}

    const addr = {
      calle: f.calle.value.trim(),
      numero: f.numero.value.trim(),
      colonia: f.colonia.value.trim(),
      ciudad: f.ciudad.value.trim(),
      estado: f.estado.value.trim(),
      cp: f.cp.value.trim(),
    };
    const customer = {
      id,
      name: f.name.value.trim(),
      phone: f.phone.value.trim(),
      email: f.email.value.trim(),
      address: addr,
      addressText: `${addr.calle} ${addr.numero}, ${addr.colonia}, ${addr.ciudad}, ${addr.estado}, C.P. ${addr.cp}`,
      brand: 'Letbe',
      model: f.model.value,
      year: f.year.value,
      serial: f.serial.value.trim().toUpperCase(),
      purchaseDate: f.purchaseDate.value,
      invoice: f.invoice.value.trim(),
      createdAt: new Date().toISOString(),
    };
    const btn = f.querySelector('button');
    btn.textContent = 'Guardando...'; btn.disabled = true;
    try{
      customer.services = emptyServices();
      await saveCustomer(customer);
      showConfirmModal(customer);
      f.reset();
      notifyEmail('Nuevo registro de moto', {
        nombre_cliente: customer.name,
        codigo_cliente: customer.id,
        modelo_moto: `${customer.model} (${customer.year})`,
        telefono_cliente: customer.phone,
        detalle: `Serie: ${customer.serial}\nCompra: ${customer.purchaseDate} · Factura ${customer.invoice}\nDirección: ${customer.addressText}`,
      });
    }catch(err){
      console.error(err);
      toast('No se pudo guardar el registro. Revisa tu conexión a internet e intenta de nuevo.', 'err');
    }
    btn.textContent = 'Registrar motocicleta'; btn.disabled = false;
  });
}

/* ---- Directorio público de talleres autorizados (desde Bitácora digital) ---- */
async function openTalleresDirectorioModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:560px; max-height:88vh; overflow-y:auto;">
      <div class="eyebrow">Talleres autorizados</div>
      <h2 style="font-family:'Archivo Black'; font-size:20px; margin:0 0 6px;">Encuentra tu taller Letbe</h2>
      <p style="color:var(--text-muted); font-size:12.5px; margin:0 0 16px;">Talleres autorizados por Letbe para dar mantenimiento a tu moto y validar tu garantía.</p>
      <div class="field" style="margin-bottom:14px;">
        <label>Buscar por ciudad, estado o nombre</label>
        <input id="talleres-dir-search" placeholder="Ej. CDMX, Guadalajara...">
      </div>
      <div id="talleres-dir-list"><div class="empty">Cargando talleres...</div></div>
      <button type="button" class="btn btn-ghost btn-block" id="cerrar-talleres-dir" style="margin-top:16px;">Cerrar</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });
  overlay.querySelector('#cerrar-talleres-dir').addEventListener('click', ()=> overlay.remove());

  const listEl = overlay.querySelector('#talleres-dir-list');
  const all = await getAllTalleres();
  if(all === null){
    listEl.innerHTML = `<div class="empty" style="color:var(--danger);">No se pudo conectar a la base de datos.</div>`;
    return;
  }
  const activos = all.filter(t => t.activo).sort((a,b)=>{
    const ea = (a.estado||'').localeCompare(b.estado||'');
    return ea !== 0 ? ea : (a.nombre||'').localeCompare(b.nombre||'');
  });

  const renderList = (filterText)=>{
    const q = (filterText||'').trim().toLowerCase();
    const filtered = !q ? activos : activos.filter(t =>
      (t.nombre||'').toLowerCase().includes(q) ||
      (t.direccion||'').toLowerCase().includes(q) ||
      (t.ciudad||'').toLowerCase().includes(q) ||
      (t.estado||'').toLowerCase().includes(q)
    );
    if(!filtered.length){
      listEl.innerHTML = `<div class="empty">${activos.length ? 'Sin talleres para esa búsqueda.' : 'Aún no hay talleres autorizados registrados.'}</div>`;
      return;
    }
    listEl.innerHTML = filtered.map(t => `
      <div class="card" style="margin-bottom:10px; padding:14px;">
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <div class="id-pill">${esc(t.id)}</div>
          <b style="font-size:13.5px;">${esc(t.nombre)}</b>
        </div>
        ${t.direccion ? `<div style="font-size:12.5px; color:var(--text-muted); margin-top:6px;">${esc(t.direccion)}</div>` : ''}
        <div style="font-size:12.5px; color:var(--text-muted); margin-top:${t.direccion?'2px':'6px'};">
          ${esc(t.ciudad || '')}${t.ciudad && t.estado ? ', ' : ''}${esc(t.estado || '')}
          ${t.telefono ? ` · ${esc(t.telefono)}` : ''}
        </div>
      </div>
    `).join('');
  };
  renderList('');
  overlay.querySelector('#talleres-dir-search').addEventListener('input', (e)=> renderList(e.target.value));
}

async function renderCustomerDetail(id, customer, adminMode){
  const services = await getServices(id);
  const doneCount = services.filter(s => s.done).length;
  const tier = tierFor(doneCount);
  const next = nextTier(doneCount);

  const tierChips = TIERS.map(t => `
    <div class="tier-chip ${tier && tier.key===t.key ? 'active':''}">${t.label} · ${t.min}+</div>
  `).join('');

  const tierDetailCards = TIERS.map(t => {
    const isActive = tier && tier.key === t.key;
    const isReached = doneCount > t.min && !isActive;
    return `
    <div class="tier-detail-card ${isActive?'active':''} ${isReached?'reached':''}" style="--tier-color:${t.color};">
      <div class="tier-detail-head">
        <div class="tier-detail-name"><span class="tier-detail-dot"></span>${t.label}</div>
        <span class="tier-detail-req">${t.min} SERVICIOS CUMPLIDOS</span>
        ${isActive ? `<span class="badge badge-success" style="margin-left:auto;">Nivel actual</span>` : (doneCount >= t.min ? `<span class="badge badge-pending" style="margin-left:auto;">Alcanzado</span>` : '')}
      </div>
      <div class="tier-detail-benefit">${t.benefit}</div>
    </div>`;
  }).join('');

  const loyaltySection = `
  <h3 style="font-family:'Archivo Black'; font-size:16px; margin:0 0 4px;">Niveles de lealtad</h3>
  <p style="color:var(--text-muted); font-size:12px; margin:0 0 14px;">Beneficios que se activan conforme se cumplen los servicios de mantenimiento en tiempo y forma.</p>
  ${tierDetailCards}
  <div class="tier-clause">⚠ ${TIERS_CLAUSE}</div>
  <button class="btn btn-ghost btn-sm" id="view-poliza-btn" style="margin-top:12px;">📄 Ver póliza de garantía completa</button>
  `;

  const rows = services.map(s => {
    let cls = 'service-row';
    let statusBadge = `<span class="badge badge-pending">Pendiente</span>`;
    let extraMeta = '';
    if(s.done){
      cls += ' done';
      statusBadge = s.validado
        ? `<span class="badge badge-success">✓ Validado</span>`
        : `<span class="badge badge-yellow">En revisión</span>`;
    }else{
      const st = computeServiceStatus(s, customer.purchaseDate);
      if(st.status === 'overdue'){
        cls += ' overdue';
        statusBadge = `<span class="badge badge-danger">Vencido hace ${Math.abs(st.diff)} día${Math.abs(st.diff)===1?'':'s'}</span>`;
        extraMeta = `<div class="service-detail" style="color:var(--danger);">Fecha estimada: ${fmtDate(st.due.toISOString().slice(0,10))}</div>`;
      }else if(st.status === 'soon'){
        cls += ' soon';
        statusBadge = `<span class="badge badge-yellow">Vence en ${st.diff} día${st.diff===1?'':'s'}</span>`;
        extraMeta = `<div class="service-detail" style="color:var(--yellow-ink);">Fecha estimada: ${fmtDate(st.due.toISOString().slice(0,10))}</div>`;
      }else if(st.due){
        extraMeta = `<div class="service-detail">Fecha estimada: ${fmtDate(st.due.toISOString().slice(0,10))}</div>`;
      }
    }
    return `
    <div class="${cls}">
      <div class="service-num">${s.n}</div>
      <div>
        <div class="service-title">Servicio ${s.n}</div>
        <div class="service-meta">Programado a los ${s.months} meses o ${s.km.toLocaleString('es-MX')} km</div>
        ${s.done ? `<div class="service-detail">Taller: ${esc(s.taller)} · ${fmtDate(s.fecha)} · ${Number(s.km_real).toLocaleString('es-MX')} km · Factura ${esc(s.factura)}${s.facturaFile ? ` · <a href="${s.facturaFile}" target="_blank" style="color:var(--yellow-ink); text-decoration:underline;">Ver comprobante</a>` : ''}</div>` : extraMeta}
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        ${statusBadge}
        ${!s.done ? `<button class="btn btn-ghost btn-sm" data-fill="${s.n}">Registrar</button>` : ''}
        ${adminMode && s.done && !s.validado ? `<button class="btn btn-yellow btn-sm" data-validate="${s.n}">Validar</button>` : ''}
      </div>
    </div>`;
  }).join('');

  return `
  <div class="hero" style="margin-bottom:32px;">
    <div class="hero-card">
      <div class="eyebrow" style="color:var(--yellow-ink);">${esc(customer.name)}</div>
      <h2>${esc(customer.model)} · ${esc(customer.year)}</h2>
      <p>
        VIN <span class="mono">${esc(customer.serial)}</span><br>
        Compra: ${fmtDate(customer.purchaseDate)} · Factura ${esc(customer.invoice)}<br>
        ${esc(customer.phone)} · ${esc(customer.email)}<br>
        ${esc(formatAddress(customer))}
      </p>
      <div class="id-pill">${id}</div>
      <div class="tier-strip">${tierChips}</div>
      ${next ? `<p style="margin-top:14px; font-size:12.5px; color:var(--text-muted);">Te faltan <b style="color:var(--yellow-ink);">${next.min - doneCount}</b> servicio(s) cumplidos para alcanzar el nivel <b style="color:${next.color};">${next.label}</b>.</p>` : `<p style="margin-top:14px; font-size:12.5px; color:var(--success);">¡Alcanzaste el nivel máximo, Platino!</p>`}
    </div>
    <div class="hero-card" style="display:flex; flex-direction:column; align-items:center; justify-content:center;">
      ${gaugeSVG(doneCount, SCHEDULE.length)}
      <div class="gauge-tier" style="color:${tier ? tier.color : 'var(--text-faint)'}">${tier ? 'Nivel ' + tier.label : 'Aún sin nivel'}</div>
      ${tier ? `<div style="font-size:11.5px; color:var(--text-muted); text-align:center; max-width:220px; margin-top:6px;">${tier.benefit}</div>` : ''}
    </div>
  </div>

  ${loyaltySection}

  <h3 style="font-family:'Archivo Black'; font-size:16px; margin:0 0 4px;">Tabla de precios · ${esc(customer.model)}</h3>
  <p style="color:var(--text-muted); font-size:12px; margin:0 0 14px;">Cubren únicamente el mantenimiento kilometrado de la póliza de garantía.</p>
  <div class="card" style="padding:0; overflow:hidden;">
    <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Servicio</th><th>Programado</th><th>Precio</th><th></th></tr></thead>
        <tbody>
          ${SCHEDULE.map(s => `
            <tr>
              <td><b>Servicio ${s.n}</b></td>
              <td>${s.months} meses · ${s.km.toLocaleString('es-MX')} km</td>
              <td class="mono">${fmtMoney(priceFor(customer.model, s.n))}</td>
              <td><button class="btn btn-ghost btn-sm" data-info="${s.n}" data-model="${esc(customer.model)}">Ver qué incluye</button></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>
  <p style="color:var(--text-faint); font-size:11px; line-height:1.6; margin:10px 0 32px;">Precios de servicios vigentes al 31 de diciembre de 2026. Precios en pesos mexicanos con IVA incluido. Precios sujetos a cambio por actualización de lista de proveedor.</p>

  <h3 style="font-family:'Archivo Black'; font-size:16px; margin:0 0 14px;">Bitácora de mantenimiento</h3>
  <div id="service-list">${rows}</div>

  <div class="divider"></div>
  <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px;">
    <h3 style="font-family:'Archivo Black'; font-size:16px; margin:0;">Garantías</h3>
    ${!adminMode ? `<button class="btn btn-primary btn-sm" id="new-claim-btn">+ Reportar una falla</button>` : ''}
  </div>
  <p style="color:var(--text-muted); font-size:12.5px; line-height:1.6; margin:0 0 8px;">En esta sección podrás reportar fallas de tu motocicleta y por este medio recibirás instrucciones y seguimiento para la reparación de tu motocicleta por garantía.</p>
  <div class="tier-clause" style="margin-bottom:16px;">⚠ Recuerda que para hacer válida tu garantía es obligatorio el cumplimiento y registro de los servicios kilometrados, de acuerdo a la póliza de garantía.</div>
  <div id="claims-list">${await renderClaimsList(id, adminMode)}</div>
  `;
}

async function renderClaimsList(customerId, adminMode){
  const claims = await getClaimsForCustomer(customerId);
  if(!claims.length){
    return `<div class="empty" style="padding:24px;">Aún no hay garantías reportadas para esta moto.</div>`;
  }
  return claims.map(c => claimCard(c, adminMode)).join('');
}

function bindCustomerDetail(id, adminMode){
  const container = document.getElementById(adminMode ? 'admin-detail' : 'consulta-result');
  const polizaBtn = container.querySelector('#view-poliza-btn');
  if(polizaBtn){
    polizaBtn.addEventListener('click', openPolizaGarantia);
  }
  container.querySelectorAll('[data-info]').forEach(btn=>{
    btn.addEventListener('click', ()=> openServiceInfoModal(Number(btn.dataset.info), btn.dataset.model));
  });
  container.querySelectorAll('[data-fill]').forEach(btn=>{
    btn.addEventListener('click', ()=> openServiceModal(id, Number(btn.dataset.fill), adminMode));
  });
  container.querySelectorAll('[data-validate]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const services = await getServices(id);
      const s = services.find(x => x.n === Number(btn.dataset.validate));
      if(s){ s.validado = true; await saveServices(id, services); }
      const customer = await getCustomer(id);
      container.innerHTML = await renderCustomerDetail(id, customer, adminMode);
      bindCustomerDetail(id, adminMode);
      toast('Servicio validado correctamente.', 'ok');
    });
  });
  const newClaimBtn = container.querySelector('#new-claim-btn');
  if(newClaimBtn){
    newClaimBtn.addEventListener('click', ()=> openClaimModal(id, adminMode));
  }
  container.querySelectorAll('[data-save-claim]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const claimId = btn.dataset.saveClaim;
      const select = container.querySelector(`.claim-status-select[data-claim="${claimId}"]`);
      const notesInput = container.querySelector(`.claim-notes-input[data-claim="${claimId}"]`);
      const newStatus = select.value;

  container.querySelectorAll('.fr-parte').forEach(inp=>{

  });

function bindReportarFalla(origenTipo, origen){
  bindSocioBack();
  renderFallaRefaccionesRows();
  document.getElementById('falla-add-refaccion').addEventListener('click', ()=>{
    state.socioFallaRefacciones.push({ numero_parte:'', nombre:'', cantidad:1 });
    renderFallaRefaccionesRows();
  });
  document.getElementById('falla-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const f = e.target;
    const btn = document.getElementById('falla-submit-btn');
    const errEl = document.getElementById('falla-error');
    errEl.style.display = 'none';
    btn.disabled = true;
    try{
      const id = genSolicitudId('falla_garantia');
      const files = Array.from(f.evidencia.files || []);
      btn.textContent = 'Subiendo evidencia...';
      const urls = [];
      for(const file of files){
        const url = await uploadFile(file, `solicitudes/${origen.id}/${id}`);
        urls.push({ nombre: file.name, url, tipo: file.type.startsWith('video') ? 'video' : 'foto' });
      }
      btn.textContent = 'Guardando reporte...';
      const refacciones = (state.socioFallaRefacciones || [])
        .filter(r => r.numero_parte.trim() || r.nombre.trim())
        .map(r => ({ numero_parte: r.numero_parte.trim(), nombre: r.nombre.trim(), cantidad: Number(r.cantidad)||1, decision: null }));
      const solicitud = {
        id,
        tipo: 'falla_garantia',
        origen_tipo: origenTipo,
        origen_id: origen.id,
        origen_nombre: origen.nombre,
        moto_modelo: f.modelo.value,
        moto_serie: f.serie.value.trim().toUpperCase(),
        descripcion: f.descripcion.value.trim(),
        evidencia: urls,
        refacciones,
        vendedor: f.vendedor.value.trim(),
        contacto: f.contacto.value.trim(),
        status: 'recibida',
      };
      await createSolicitud(solicitud);
      notifySolicitudSocio(solicitud, origen).catch(err => console.error('No se pudo enviar el correo de la solicitud:', err));
      toast('Reporte enviado.', 'ok');
      state.socioSub = 'mis-solicitudes';
      state.socioFallaRefacciones = null;
      render();
    }catch(err){
      console.error(err);
      errEl.textContent = 'No se pudo enviar el reporte. Revisa tu conexión e intenta de nuevo.';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Enviar reporte';
    }
  });
}

/* ---- Reporte de Excel del taller (órdenes y garantías, por estatus) ---- */
function xlsxSheetOrPlaceholder(rows, placeholderMsg){
  return XLSX.utils.json_to_sheet(rows.length ? rows : [{ 'Info': placeholderMsg }]);
}
async function exportTallerReporte(taller){
  const btn = document.getElementById('taller-export-report-btn');
  if(!btn) return;
  const originalText = btn.textContent;
  btn.disabled = true; btn.textContent = 'Generando...';
  try{
    const [orders, garantias] = await Promise.all([
      getOrdersForTaller(taller.id),
      getGarantiasForTaller(taller.id),
    ]);

    if(!orders.length && !garantias.length){
      toast('Aún no tienes órdenes ni garantías registradas.', 'err');
      return;
    }

    const tipoLabel = { servicio: 'Servicio', diagnostico: 'Diagnóstico', garantia: 'Garantía' };

    // Hoja 1: Resumen por estatus
    const ordenesPorEstatus = {};
    ORDER_STATUSES.forEach(s => ordenesPorEstatus[s.label] = 0);
    orders.forEach(o => {
      const label = orderStatusInfo(o.status).label;
      ordenesPorEstatus[label] = (ordenesPorEstatus[label] || 0) + 1;
    });
    const garantiasPorEstatus = {};
    GARANTIA_TALLER_STATUSES.forEach(s => garantiasPorEstatus[s.label] = 0);
    garantias.forEach(g => {
      const label = garantiaTallerStatusInfo(g.status).label;
      garantiasPorEstatus[label] = (garantiasPorEstatus[label] || 0) + 1;
    });
    const resumenRows = [
      { 'Sección': 'Órdenes', 'Estatus': 'Total', 'Cantidad': orders.length },
      ...Object.entries(ordenesPorEstatus).map(([estatus, cantidad]) => ({ 'Sección': 'Órdenes', 'Estatus': estatus, 'Cantidad': cantidad })),
      { 'Sección': 'Garantías', 'Estatus': 'Total', 'Cantidad': garantias.length },
      ...Object.entries(garantiasPorEstatus).map(([estatus, cantidad]) => ({ 'Sección': 'Garantías', 'Estatus': estatus, 'Cantidad': cantidad })),
    ];

    // Hoja 2: Órdenes (Servicio y Diagnóstico)
    const ordenesRows = orders.map(o => ({
      'Folio': o.id,
      'Tipo': tipoLabel[o.tipo] || o.tipo,
      'Cliente': o.cliente_nombre,
      'Código cliente': o.customer_id,
      'Moto': o.moto_modelo,
      'N° servicio kilometrado': o.servicio_n || '',
      'Total': o.total || '',
      'Estatus': orderStatusInfo(o.status).label,
      'Fecha de entrada': o.fecha_entrada ? o.fecha_entrada.slice(0,10) : '',
      'Fecha de creación': (o.created_at || '').slice(0,10),
    }));

    // Hoja 3: Garantías
    const garantiasRows = garantias.map(g => ({
      'Folio': g.id,
      'Cliente': g.cliente_nombre,
      'Código cliente': g.customer_id,
      'Moto': g.moto_modelo,
      'Km actual': g.km_actual,
      'Descripción': g.description,
      'Estatus': garantiaTallerStatusInfo(g.status).label,
      'Refacciones solicitadas': (g.refacciones || []).map(r => `${r.numero_parte||'s/n'} · ${r.nombre||''} · Cant.${r.cantidad} (${r.decision==='autorizada'?'Autorizada':r.decision==='rechazada'?'Rechazada':'Pendiente'})`).join(' | '),
      'Comentarios Letbe': g.admin_notes || '',
      'Fecha de reporte': (g.created_at || '').slice(0,10),
      'Fecha de entrega al cliente': g.fecha_entrega ? new Date(g.fecha_entrega).toLocaleString('es-MX') : '',
      'Comentarios de finalización': g.comentarios_finalizacion || '',
      'Última actualización': (g.updated_at || '').slice(0,10),
    }));

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resumenRows), 'Resumen por estatus');
    XLSX.utils.book_append_sheet(wb, xlsxSheetOrPlaceholder(ordenesRows, 'Aún no hay órdenes registradas.'), 'Órdenes');
    XLSX.utils.book_append_sheet(wb, xlsxSheetOrPlaceholder(garantiasRows, 'Aún no hay garantías registradas.'), 'Garantías');

    const filename = `Letbe_Reporte_${slugify(taller.nombre)}_${new Date().toISOString().slice(0,10)}.xlsx`;
    XLSX.writeFile(wb, filename);
    toast('Reporte descargado correctamente.', 'ok');
  }catch(err){
    console.error(err);
    toast('No se pudo generar el reporte. Intenta de nuevo.', 'err');
  }
  btn.disabled = false; btn.textContent = originalText;
}

async function bindMisOrdenes(taller){
  bindTallerBack();
  const orders = await getOrdersForTaller(taller.id);
  const container = document.getElementById('mis-ordenes-list');
  if(!orders.length){
    container.innerHTML = `<div class="empty">Aún no has generado ninguna orden.</div>`;
    return;
  }
  const tipoLabel = { servicio: 'Servicio', diagnostico: 'Diagnóstico', garantia: 'Garantía' };
  container.innerHTML = `
  <div class="card" style="padding:0; overflow:hidden;">
    <div style="overflow-x:auto;">
      <table><thead><tr><th>Folio</th><th>Tipo</th><th>Cliente</th><th>Moto</th><th>Fecha</th><th>Total</th><th>Estatus</th><th></th></tr></thead>
      <tbody>
        ${orders.map(o => {
          const info = orderStatusInfo(o.status);
          return `
          <tr>
            <td><span class="id-pill">${o.id}</span></td>
            <td>${tipoLabel[o.tipo]||o.tipo}</td>
            <td>${esc(o.cliente_nombre)}</td>
            <td>${esc(o.moto_modelo)}</td>
            <td>${fmtDate((o.created_at||'').slice(0,10))}</td>
            <td class="mono">${fmtMoney(o.total)}</td>
            <td>
              <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
                <select class="orden-status-select" data-order="${o.id}" style="max-width:170px; font-size:12px; padding:6px 8px;">
                  ${ORDER_STATUSES.map(s => `<option value="${s.key}" ${o.status===s.key?'selected':''}>${s.label}</option>`).join('')}
                </select>
                <button class="btn btn-yellow btn-sm" data-save-status="${o.id}">Guardar</button>
              </div>
            </td>
            <td><button class="btn btn-ghost btn-sm" data-reprint="${o.id}">📄 PDF</button></td>
          </tr>`;
        }).join('')}
      </tbody></table>
    </div>
  </div>`;
  container.querySelectorAll('[data-reprint]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const o = await getOrder(btn.dataset.reprint);
      if(!o) return;
      if(o.tipo === 'servicio') buildServiceOrderPDF(o);
      else if(o.tipo === 'diagnostico') buildDiagnosticoOrderPDF(o);
    });
  });
  container.querySelectorAll('[data-save-status]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const orderId = btn.dataset.saveStatus;
      const select = container.querySelector(`.orden-status-select[data-order="${orderId}"]`);
      const newStatus = select.value;
      btn.disabled = true; btn.textContent = 'Guardando...';
      try{
        const order = await getOrder(orderId);
        if(!order) throw new Error('Orden no encontrada');
        await updateOrderStatus(order, newStatus);
        if(newStatus === 'facturada' && order.tipo === 'servicio' && order.servicio_n){
          toast(`Orden ${orderId} facturada. El servicio ${order.servicio_n} ya se reflejó en la bitácora del cliente.`, 'ok');
        }else{
          toast('Estatus actualizado.', 'ok');
        }
        await bindMisOrdenes(taller);
      }catch(err){
        console.error(err);
        toast('No se pudo actualizar el estatus. Intenta de nuevo.', 'err');
        btn.disabled = false; btn.textContent = 'Guardar';
      }
    });
  });
}

function bindNuevaOrdenServicio(taller){
  bindTallerBack();
  const flow = state.ordenFlow;
  if(!flow || !flow.customer){
    const go = async ()=>{
      const id = document.getElementById('orden-cliente-input').value.trim().toUpperCase();
      const errEl = document.getElementById('orden-cliente-error');
      errEl.style.display = 'none';
      if(!id) return;
      const c = await getCustomer(id);
      if(!c){
        errEl.innerHTML = 'No encontramos ese código. Si el cliente aún no está registrado, debe darse de alta primero en <b>Bitácora Digital</b> antes de continuar.';
        errEl.style.display = 'block';
        return;
      }
      state.ordenFlow = { customer: c, lineas: [], nivelGasolina: 4 };
      render();
    };
    document.getElementById('orden-buscar-btn').addEventListener('click', go);
    document.getElementById('orden-cliente-input').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
    return;
  }

  renderLineasRows();

  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const localNow = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const feInput = document.getElementById('orden-fecha-entrada');
  if(feInput && !feInput.value) feInput.value = localNow;

  document.getElementById('orden-llamar-check').addEventListener('change', (e)=>{
    document.getElementById('orden-fecha-promesa-wrap').style.display = e.target.checked ? 'none' : 'block';
  });
  document.getElementById('orden-servicio-select').addEventListener('change', updateOrderTotal);
  document.getElementById('orden-add-linea').addEventListener('click', ()=>{
    flow.lineas.push({ descripcion:'', precio:0 });
    renderLineasRows();
    updateOrderTotal();
  });
  document.getElementById('orden-generar-btn').addEventListener('click', handleGenerarOrdenServicio);
  updateOrderTotal();
}

function renderLineasRows(){
  const flow = state.ordenFlow;
  const container = document.getElementById('orden-lineas');
  if(!container || !flow) return;
  container.innerHTML = flow.lineas.length ? flow.lineas.map((l,idx) => `
    <div style="display:flex; gap:8px; margin-bottom:8px; align-items:center;">
      <input class="linea-desc" data-idx="${idx}" placeholder="Descripción (ej. Limpieza de frenos)" style="flex:2;" value="${esc(l.descripcion)}">
      <input class="linea-precio mono" data-idx="${idx}" type="number" min="0" step="0.01" placeholder="Precio" style="flex:1;" value="${l.precio||''}">
      <button class="btn btn-ghost btn-sm" data-remove-linea="${idx}">✕</button>
    </div>
  `).join('') : `<p style="color:var(--text-faint); font-size:12px;">Sin líneas adicionales.</p>`;

  container.querySelectorAll('.linea-desc').forEach(inp=>{
    inp.addEventListener('input', e=>{ flow.lineas[Number(e.target.dataset.idx)].descripcion = e.target.value; });
  });
  container.querySelectorAll('.linea-precio').forEach(inp=>{
    inp.addEventListener('input', e=>{ flow.lineas[Number(e.target.dataset.idx)].precio = parseFloat(e.target.value)||0; updateOrderTotal(); });
  });
  container.querySelectorAll('[data-remove-linea]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      flow.lineas.splice(Number(btn.dataset.removeLinea), 1);
      renderLineasRows();
      updateOrderTotal();
    });
  });
}

function updateOrderTotal(){
  const flow = state.ordenFlow;
  if(!flow) return 0;
  const select = document.getElementById('orden-servicio-select');
  const n = select ? Number(select.value) : 0;
  const servicioPrecio = n ? (priceFor(flow.customer.model, n) || 0) : 0;
  const lineasTotal = flow.lineas.reduce((sum,l) => sum + (Number(l.precio)||0), 0);
  const total = servicioPrecio + lineasTotal;
  const disp = document.getElementById('orden-total-display');
  if(disp) disp.textContent = fmtMoney(total);
  return total;
}

async function handleGenerarOrdenServicio(){
  const flow = state.ordenFlow;
  const taller = state.tallerAuthed;
  const btn = document.getElementById('orden-generar-btn');
  const lockDiv = document.getElementById('orden-km-lock');
  const kmVal = document.getElementById('orden-km').value;
  if(lockDiv) lockDiv.style.display = 'none';

  if(kmVal !== ''){
    const lock = await checkKmLock(flow.customer.id, kmVal);
    if(lock.bloqueado){
      if(lockDiv){
        lockDiv.style.display = 'block';
        lockDiv.innerHTML = renderKmLockWarning(lock, kmVal);
        wireKmLockWarning(lockDiv, { customer: flow.customer, taller, tipoOrden:'servicio', kmDeclarado: kmVal, kmAnterior: lock.ultimoKm, fuente: lock.fuente });
      }
      return;
    }
  }

  btn.disabled = true; btn.textContent = 'Generando...';
  try{
    const n = Number(document.getElementById('orden-servicio-select').value) || null;
    const servicioPrecio = n ? (priceFor(flow.customer.model, n) || 0) : 0;
    const lineasFiltradas = flow.lineas.filter(l => l.descripcion && l.descripcion.trim());
    const lineasTotal = lineasFiltradas.reduce((sum,l)=> sum + (Number(l.precio)||0), 0);
    const total = servicioPrecio + lineasTotal;

    const checklist = {};
    document.querySelectorAll('.checklist-item').forEach(cb => { checklist[cb.dataset.item] = cb.checked; });
    checklist.nivel_aceite = document.getElementById('orden-nivel-aceite').value;
    checklist.nivel_gasolina = `${flow.nivelGasolina ?? 4}/8`;

    const llamarCheck = document.getElementById('orden-llamar-check').checked;
    const fechaEntradaVal = document.getElementById('orden-fecha-entrada').value;
    const fechaPromesaVal = document.getElementById('orden-fecha-promesa').value;

    const order = {
      id: genOrderId('OS'),
      tipo: 'servicio',
      taller_id: taller.id,
      taller_nombre: taller.nombre,
      customer_id: flow.customer.id,
      cliente_nombre: flow.customer.name,
      cliente_telefono: flow.customer.phone,
      cliente_email: flow.customer.email,
      moto_modelo: flow.customer.model,
      moto_year: flow.customer.year,
      moto_serial: flow.customer.serial,
      fecha_entrada: fechaEntradaVal ? new Date(fechaEntradaVal).toISOString() : new Date().toISOString(),
      fecha_promesa: (!llamarCheck && fechaPromesaVal) ? new Date(fechaPromesaVal).toISOString() : null,
      llamar_cuando_lista: llamarCheck,
      km_actual: document.getElementById('orden-km').value,
      asesor: document.getElementById('orden-asesor').value.trim(),
      nota: document.getElementById('orden-nota').value.trim(),
      checklist,
      servicio_n: n,
      servicio_precio: servicioPrecio,
      lineas_adicionales: lineasFiltradas,
      total,
      status: 'recibido',
      created_at: new Date().toISOString(),
    };

    await createOrder(order);
    buildServiceOrderPDF(order);
    toast('Orden generada y PDF descargado.', 'ok');
    state.ordenFlow = null;
    state.tallerSub = 'mis-ordenes';
    render();
  }catch(err){
    console.error(err);
    toast('No se pudo generar la orden. Revisa tu conexión e intenta de nuevo.', 'err');
    btn.disabled = false;
    btn.textContent = 'Generar orden y descargar PDF';
  }
}

/* ---- Generación de PDF: Orden de Servicio ---- */
function buildServiceOrderPDF(o){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const pageW = 210;

  // Logo real de Letbe (mismo PNG del encabezado de la app), proporción real 885x160 (~5.53:1)
  doc.addImage(LETBE_LOGO_BASE64, 'PNG', 14, 10, 42, 7.59);
  doc.setTextColor(90,94,108);
  doc.setFont('helvetica','bold');
  doc.setFontSize(8.5);
  doc.text(o.taller_nombre || '', 14, 28);

  doc.setTextColor(90,94,108);
  doc.setFont('helvetica','normal');
  doc.setFontSize(10);
  doc.text('Orden de Servicio', 14, 33);

  doc.setTextColor(20,20,20);
  doc.setFontSize(9);
  doc.text(`Folio: ${o.id}`, pageW-14, 12, {align:'right'});
  doc.text(`N° de taller: ${o.taller_id}`, pageW-14, 17, {align:'right'});
  doc.text(`Fecha: ${new Date(o.created_at||Date.now()).toLocaleDateString('es-MX')}`, pageW-14, 22, {align:'right'});

  doc.setDrawColor(255,199,44);
  doc.setLineWidth(0.8);
  doc.line(14, 37, pageW-14, 37);
  doc.setTextColor(20,20,20);

  let y = 45;
  const section = (title)=>{ doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text(title, 14, y); doc.setFont('helvetica','normal'); y+=5.5; };
  const line = (text)=>{ doc.setFontSize(9); doc.text(text, 14, y); y+=5; };
  const checkBreak = (needed)=>{ if(y + needed > 280){ doc.addPage(); y = 20; } };

  section('Cliente');
  line(`${o.cliente_nombre}   ·   Código: ${o.customer_id}`);
  line(`Tel: ${o.cliente_telefono||'—'}    Correo: ${o.cliente_email||'—'}`);
  y += 3;

  section('Motocicleta');
  line(`${o.moto_modelo} (${o.moto_year})   ·   VIN: ${o.moto_serial}   ·   Km. actual: ${o.km_actual||'—'}`);
  y += 3;

  section('Fechas y asesor');
  line(`Entrada: ${o.fecha_entrada ? new Date(o.fecha_entrada).toLocaleString('es-MX') : '—'}`);
  line(o.llamar_cuando_lista ? 'Entrega: Te llamamos cuando esté lista' : `Fecha promesa de entrega: ${o.fecha_promesa ? new Date(o.fecha_promesa).toLocaleString('es-MX') : 'No especificada'}`);
  line(`Asesor: ${o.asesor || '—'}`);
  y += 3;

  checkBreak(30);
  section('Inventario de unidad (check-in)');
  const checked = Object.keys(o.checklist||{}).filter(k => CHECKLIST_ITEMS.includes(k) && o.checklist[k]);
  doc.setFontSize(8.5);
  const checklistTxt = checked.length ? checked.join(', ') : 'Ninguno marcado';
  const splitChecklist = doc.splitTextToSize(checklistTxt, pageW-28);
  doc.text(splitChecklist, 14, y);
  y += splitChecklist.length * 4 + 3;
  doc.setFontSize(9);
  line(`Nivel de aceite: ${o.checklist?.nivel_aceite||'—'}     Nivel de gasolina: ${o.checklist?.nivel_gasolina||'—'}`);
  y += 2;

  checkBreak(40);
  const rows = [];
  if(o.servicio_n) rows.push([`Servicio ${o.servicio_n} (kilometrado)`, '1', fmtMoney(o.servicio_precio), fmtMoney(o.servicio_precio)]);
  (o.lineas_adicionales||[]).forEach(l => rows.push([l.descripcion, '1', fmtMoney(l.precio), fmtMoney(l.precio)]));
  doc.autoTable({
    startY: y,
    head: [['Concepto','Cant.','P. Unitario','Subtotal']],
    body: rows.length ? rows : [['Sin conceptos registrados','','','']],
    styles:{ fontSize:9 },
    headStyles:{ fillColor:[255,199,44], textColor:[20,20,20] },
    margin:{ left:14, right:14 },
  });
  y = doc.lastAutoTable.finalY + 8;

  checkBreak(20);
  doc.setFont('helvetica','bold');
  doc.setFontSize(12);
  doc.text(`Total a pagar: ${fmtMoney(o.total)}`, pageW-14, y, {align:'right'});
  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  y += 10;

  if(o.nota){
    checkBreak(20);
    section('Nota / descripción');
    doc.setFontSize(9);
    const splitNota = doc.splitTextToSize(o.nota, pageW-28);
    doc.text(splitNota, 14, y);
    y += splitNota.length * 4.2 + 6;
  }

  checkBreak(30);
